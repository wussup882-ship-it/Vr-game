name: Rebuild Gilla from scratch (APK)

# Setup: put GillaRemake__1_.apk in the repo root, save this file as
# .github/workflows/rebuild-gilla.yml, push, then run it from the Actions tab.
# The signed APK shows up under "Artifacts" when the run finishes.
#
# This throws away the old compiled game scripts and installs a brand-new
# game written from scratch (it reuses the APK's engine, OpenXR setup and the
# original gilla.glb model + fur texture, so model textures stay original).
# UNTESTED - I could not run Godot here.
#
# What the new game has:
#   * Lobby: concrete bunker hall, ceiling panels, crates, recycler, level/money
#     board, pads for BASE RUN, THE MINE and a FUR SHOP.
#   * Base map: big open halls with wide doorways (no maze). Find gold bars,
#     recycle them, escape through the EXIT while a monster hunts you.
#   * Mine map: open dirt cavern, red lantern light, headlamp, diamonds.
#   * Gorilla-tag locomotion, snap turn (right stick), one set of arms using the
#     original gorilla fur texture (no duplicate placeholder arms).
#   * Progress (money, XP, fur colours) saved on the headset.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write new game scripts
        run: |
          mkdir -p patch
          cat > patch/game.gd <<'EOF'
          extends Node

          const SAVE_PATH := "user://gilla_remake.cfg"
          const FUR := [
              {"name": "Gilla Green", "color": Color(1.0, 1.0, 1.0), "cost": 0},
              {"name": "Charcoal", "color": Color(0.35, 0.35, 0.38), "cost": 150},
              {"name": "Crimson", "color": Color(1.6, 0.45, 0.45), "cost": 300},
              {"name": "Ocean", "color": Color(0.45, 0.8, 2.0), "cost": 500},
              {"name": "Gold", "color": Color(2.0, 1.6, 0.45), "cost": 800},
          ]

          var money := 0
          var xp := 0
          var owned: Array = [0]
          var equipped := 0


          func _ready() -> void:
              load_game()


          func level() -> int:
              return 1 + int(sqrt(xp / 100.0))


          func xp_next() -> int:
              var l := level()
              return l * l * 100


          func add_money(n: int) -> void:
              money += n
              save_game()


          func add_xp(n: int) -> void:
              xp += n
              save_game()


          func save_game() -> void:
              var cf := ConfigFile.new()
              cf.set_value("g", "money", money)
              cf.set_value("g", "xp", xp)
              cf.set_value("g", "owned", owned)
              cf.set_value("g", "equipped", equipped)
              cf.save(SAVE_PATH)


          func load_game() -> void:
              var cf := ConfigFile.new()
              if cf.load(SAVE_PATH) != OK:
                  return
              money = int(cf.get_value("g", "money", 0))
              xp = int(cf.get_value("g", "xp", 0))
              owned = cf.get_value("g", "owned", [0])
              equipped = int(cf.get_value("g", "equipped", 0))
          EOF
          cat > patch/mats.gd <<'EOF'
          extends RefCounted

          var cache := {}


          func tex(kind: String) -> ImageTexture:
              if cache.has("t_" + kind):
                  return cache["t_" + kind]
              var S := 128
              var n := FastNoiseLite.new()
              n.noise_type = FastNoiseLite.TYPE_SIMPLEX_SMOOTH
              n.frequency = 0.03
              n.fractal_octaves = 3
              var noise: Image = n.get_seamless_image(S, S)
              var img := Image.create(S, S, false, Image.FORMAT_RGB8)
              for y in S:
                  for x in S:
                      var v: float = noise.get_pixel(x, y).r - 0.5
                      var c := Color(0.7, 0.7, 0.7)
                      match kind:
                          "wall":
                              c = Color(0.72, 0.71, 0.68) + Color(1, 1, 1) * v * 0.14
                          "floor":
                              c = Color(0.75, 0.77, 0.79) + Color(1, 1, 1) * v * 0.07
                              if x % 64 < 2 or y % 64 < 2:
                                  c = Color(0.38, 0.39, 0.41)
                          "dirt":
                              c = Color(0.36, 0.25, 0.15) + Color(1, 1, 1) * v * 0.22
                          "rock":
                              c = Color(0.3, 0.27, 0.25) + Color(1, 1, 1) * v * 0.2
                          "wood":
                              c = Color(0.55, 0.38, 0.2) + Color(1, 1, 1) * v * 0.1
                              if y % 32 < 2:
                                  c = Color(0.25, 0.16, 0.08)
                          "metal":
                              c = Color(0.5, 0.52, 0.55) + Color(1, 1, 1) * v * 0.06
                          "hazard":
                              if ((x + y) / 16) % 2 == 0:
                                  c = Color(0.95, 0.75, 0.05)
                              else:
                                  c = Color(0.08, 0.08, 0.08)
                      img.set_pixel(x, y, c.clamp())
              img.generate_mipmaps()
              var t := ImageTexture.create_from_image(img)
              cache["t_" + kind] = t
              return t


          func get_mat(kind: String, tint: Color = Color.WHITE) -> StandardMaterial3D:
              var key := kind + tint.to_html()
              if cache.has(key):
                  return cache[key]
              var m := StandardMaterial3D.new()
              m.albedo_texture = tex(kind)
              m.albedo_color = tint
              m.uv1_triplanar = true
              m.uv1_world_triplanar = true
              m.uv1_scale = Vector3(0.5, 0.5, 0.5)
              m.texture_filter = BaseMaterial3D.TEXTURE_FILTER_LINEAR_WITH_MIPMAPS
              m.roughness = 0.9
              cache[key] = m
              return m


          func glow(col: Color, energy: float = 1.5) -> StandardMaterial3D:
              var key := "g" + col.to_html() + str(energy)
              if cache.has(key):
                  return cache[key]
              var m := StandardMaterial3D.new()
              m.albedo_color = col
              m.emission_enabled = true
              m.emission = col
              m.emission_energy_multiplier = energy
              cache[key] = m
              return m
          EOF
          cat > patch/gorilla_player.gd <<'EOF'
          extends CharacterBody3D

          const GRAV := 9.8
          const JUMP_MULT := 1.1
          const MAX_SPEED := 6.5
          const SHOULDER := Vector3(0.19, -0.24, 0.0)

          var origin: XROrigin3D
          var cam: XRCamera3D
          var ctrl := {}
          var arm_mesh := {}
          var last := {}
          var vel := Vector3.ZERO
          var hist: Array = []
          var was_touching := false
          var turn_latched := false
          var shape_node: CollisionShape3D
          var sphere := SphereShape3D.new()
          var arm_mat: StandardMaterial3D
          var spawn_pos := Vector3(0, 0.2, 0)


          func _ready() -> void:
              collision_layer = 0
              collision_mask = 1
              sphere.radius = 0.1
              origin = XROrigin3D.new()
              add_child(origin)
              cam = XRCamera3D.new()
              origin.add_child(cam)
              var cap := CapsuleShape3D.new()
              cap.radius = 0.15
              cap.height = 0.5
              shape_node = CollisionShape3D.new()
              shape_node.shape = cap
              add_child(shape_node)
              # arms use the ORIGINAL gorilla fur texture from the model
              arm_mat = StandardMaterial3D.new()
              var tex = load("res://gilla_img0.png")
              if tex:
                  arm_mat.albedo_texture = tex
              else:
                  arm_mat.albedo_color = Color(0.1, 0.7, 0.1)
              arm_mat.uv1_triplanar = true
              arm_mat.uv1_scale = Vector3(1.5, 1.5, 1.5)
              arm_mat.texture_filter = BaseMaterial3D.TEXTURE_FILTER_LINEAR_WITH_MIPMAPS
              arm_mat.roughness = 0.9
              for s in ["l", "r"]:
                  var c := XRController3D.new()
                  c.tracker = "left_hand" if s == "l" else "right_hand"
                  origin.add_child(c)
                  ctrl[s] = c
                  var h := MeshInstance3D.new()
                  var sm := SphereMesh.new()
                  sm.radius = 0.055
                  sm.height = 0.11
                  h.mesh = sm
                  h.material_override = arm_mat
                  c.add_child(h)
                  var a := MeshInstance3D.new()
                  var cm := CylinderMesh.new()
                  cm.top_radius = 0.03
                  cm.bottom_radius = 0.06
                  cm.height = 1.0
                  cm.radial_segments = 10
                  cm.rings = 1
                  a.mesh = cm
                  a.material_override = arm_mat
                  a.top_level = true
                  add_child(a)
                  arm_mesh[s] = a


          func set_tint(c: Color) -> void:
              arm_mat.albedo_color = c


          func respawn() -> void:
              global_position = spawn_pos
              vel = Vector3.ZERO
              last.clear()
              hist.clear()
              was_touching = false


          func _physics_process(dt: float) -> void:
              if dt <= 0.0:
                  return
              shape_node.global_position = cam.global_position + Vector3(0, -0.35, 0)
              _snap_turn()
              var space := get_world_3d().direct_space_state
              var move := Vector3.ZERO
              var hand_vel := Vector3.ZERO
              var n := 0
              for s in ctrl:
                  var c: XRController3D = ctrl[s]
                  var lp: Vector3 = to_local(c.global_position)
                  if not last.has(s):
                      last[s] = lp
                  var d: Vector3 = global_transform.basis * (lp - last[s])
                  last[s] = lp
                  var q := PhysicsShapeQueryParameters3D.new()
                  q.shape = sphere
                  q.transform = Transform3D(Basis(), c.global_position)
                  q.collision_mask = 1
                  q.exclude = [get_rid()]
                  if not space.intersect_shape(q, 1).is_empty():
                      n += 1
                      move -= d
                      hand_vel -= d / dt
              if n > 0:
                  move /= float(n)
                  hand_vel /= float(n)
                  hist.append(hand_vel)
                  if hist.size() > 6:
                      hist.pop_front()
                  vel = Vector3.ZERO
                  move_and_collide(move)
                  was_touching = true
              else:
                  if was_touching:
                      var avg := Vector3.ZERO
                      for v in hist:
                          avg += v
                      if hist.size() > 0:
                          avg /= float(hist.size())
                      vel = avg * JUMP_MULT
                      if vel.length() > MAX_SPEED:
                          vel = vel.normalized() * MAX_SPEED
                      hist.clear()
                      was_touching = false
                  vel.y -= GRAV * dt
                  vel *= 0.998
                  var col := move_and_collide(vel * dt)
                  if col:
                      var nrm := col.get_normal()
                      vel = vel.slide(nrm)
                      if nrm.y > 0.6:
                          vel.x *= 0.85
                          vel.z *= 0.85
              if global_position.y < -15.0:
                  respawn()


          func _snap_turn() -> void:
              var c: XRController3D = ctrl["r"]
              var x: float = c.get_vector2("primary").x
              if absf(x) > 0.7 and not turn_latched:
                  turn_latched = true
                  var before := cam.global_position
                  rotate_y(deg_to_rad(-30.0 * signf(x)))
                  global_position += before - cam.global_position
                  last.clear()
              elif absf(x) < 0.3:
                  turn_latched = false


          func _process(_dt: float) -> void:
              var yaw := Basis(Vector3.UP, cam.global_rotation.y)
              for s in ctrl:
                  var side := -1.0 if s == "l" else 1.0
                  var sh: Vector3 = cam.global_position + yaw * Vector3(SHOULDER.x * side, SHOULDER.y, SHOULDER.z)
                  _place(arm_mesh[s], sh, ctrl[s].global_position)


          func _place(mi: MeshInstance3D, a: Vector3, b: Vector3) -> void:
              var d := b - a
              var l := d.length()
              if l < 0.02:
                  return
              var y := d / l
              var ref := Vector3.UP if absf(y.dot(Vector3.UP)) < 0.95 else Vector3.RIGHT
              var x := ref.cross(y).normalized()
              var z := x.cross(y)
              mi.global_transform = Transform3D(Basis(x, y * l, z), (a + b) * 0.5)
          EOF
          cat > patch/main.gd <<'EOF'
          extends Node3D

          const PlayerScript = preload("res://gorilla_player.gd")
          const MatsScript = preload("res://mats.gd")

          var player
          var mats
          var world: Node3D
          var env: Environment
          var hud: Label3D
          var msg: Label3D
          var board: Label3D
          var fur_label: Label3D
          var lamp: OmniLight3D
          var mode := "lobby"
          var inter: Array = []
          var items: Array = []
          var inter_cd := 0.0
          var carried := 0
          var recycled := 0
          var quota := 3
          var item_val := 25
          var round_t := 0.0
          var end_t := 0.0
          var msg_t := 0.0
          var round_over := false
          var exit_open := false
          var exit_node: MeshInstance3D
          var monster: CharacterBody3D
          var mon_start := Vector3.ZERO
          var waypoints: Array = []
          var wp_i := 0
          var stuck_t := 0.0
          var model_scene: PackedScene


          func _ready() -> void:
              randomize()
              mats = MatsScript.new()
              env = Environment.new()
              var we := WorldEnvironment.new()
              we.environment = env
              add_child(we)
              _start_xr()
              player = PlayerScript.new()
              add_child(player)
              hud = _make_label(40, 0.0011)
              player.cam.add_child(hud)
              hud.position = Vector3(0, -0.33, -1.0)
              msg = _make_label(64, 0.0011)
              player.cam.add_child(msg)
              msg.position = Vector3(0, 0.12, -1.1)
              msg.modulate = Color(1, 0.9, 0.3)
              player.set_tint(Game.FUR[Game.equipped]["color"])
              if ResourceLoader.exists("res://gilla.glb"):
                  model_scene = load("res://gilla.glb")
              _enter_lobby()


          func _start_xr() -> void:
              var xr := XRServer.find_interface("OpenXR")
              if xr and (xr.is_initialized() or xr.initialize()):
                  get_viewport().use_xr = true
                  DisplayServer.window_set_vsync_mode(DisplayServer.VSYNC_DISABLED)


          func _make_label(size: int, px: float) -> Label3D:
              var l := Label3D.new()
              l.font_size = size
              l.pixel_size = px
              l.no_depth_test = true
              l.shaded = false
              l.outline_size = 10
              l.render_priority = 10
              l.outline_render_priority = 9
              l.modulate = Color(1, 1, 0.75)
              return l


          # ---------------------------------------------------------------- helpers
          func _set_env(bg: Color, amb: Color, energy: float, fog: float) -> void:
              env.background_mode = Environment.BG_COLOR
              env.background_color = bg
              env.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              env.ambient_light_color = amb
              env.ambient_light_energy = energy
              env.fog_enabled = fog > 0.0
              env.fog_light_color = bg
              env.fog_density = fog


          func _clear() -> void:
              if world:
                  world.queue_free()
              world = Node3D.new()
              add_child(world)
              if lamp:
                  lamp.queue_free()
                  lamp = null
              inter.clear()
              items.clear()
              waypoints.clear()
              monster = null
              carried = 0
              recycled = 0
              exit_open = false
              exit_node = null


          func _box(pos: Vector3, size: Vector3, kind: String, tint: Color = Color.WHITE, solid: bool = true) -> Node3D:
              var b: Node3D = StaticBody3D.new() if solid else Node3D.new()
              b.position = pos
              var mi := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = size
              mi.mesh = bm
              mi.material_override = mats.get_mat(kind, tint)
              b.add_child(mi)
              if solid:
                  var cs := CollisionShape3D.new()
                  var sh := BoxShape3D.new()
                  sh.size = size
                  cs.shape = sh
                  b.add_child(cs)
              world.add_child(b)
              return b


          func _glow_box(pos: Vector3, size: Vector3, col: Color, energy: float = 1.5) -> MeshInstance3D:
              var mi := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = size
              mi.mesh = bm
              mi.material_override = mats.glow(col, energy)
              mi.position = pos
              world.add_child(mi)
              return mi


          func _light(pos: Vector3, col: Color, energy: float, rng: float) -> void:
              var l := OmniLight3D.new()
              l.position = pos
              l.light_color = col
              l.light_energy = energy
              l.omni_range = rng
              world.add_child(l)


          func _panel(pos: Vector3, with_light: bool = false) -> void:
              _glow_box(pos, Vector3(1.4, 0.08, 1.4), Color(1, 1, 0.95), 2.5)
              _box(pos + Vector3(0, 0.05, 0), Vector3(1.6, 0.04, 1.6), "metal", Color(0.1, 0.1, 0.1), false)
              if with_light:
                  _light(pos - Vector3(0, 0.8, 0), Color(1, 0.97, 0.9), 1.3, 18.0)


          func _text(txt: String, pos: Vector3, size: int = 48, col: Color = Color.WHITE, billboard: bool = false) -> Label3D:
              var l := Label3D.new()
              l.text = txt
              l.font_size = size
              l.pixel_size = 0.004
              l.outline_size = 8
              l.modulate = col
              if billboard:
                  l.billboard = BaseMaterial3D.BILLBOARD_ENABLED
              l.position = pos
              world.add_child(l)
              return l


          func _room(w: float, d: float, h: float, floor_kind: String, wall_kind: String) -> void:
              _box(Vector3(0, -0.25, 0), Vector3(w, 0.5, d), floor_kind)
              _box(Vector3(0, h + 0.25, 0), Vector3(w + 1, 0.5, d + 1), wall_kind)
              _box(Vector3(0, h * 0.5, -d * 0.5 - 0.25), Vector3(w + 1, h, 0.5), wall_kind)
              _box(Vector3(0, h * 0.5, d * 0.5 + 0.25), Vector3(w + 1, h, 0.5), wall_kind)
              _box(Vector3(-w * 0.5 - 0.25, h * 0.5, 0), Vector3(0.5, h, d), wall_kind)
              _box(Vector3(w * 0.5 + 0.25, h * 0.5, 0), Vector3(0.5, h, d), wall_kind)
              if wall_kind == "wall":
                  var dark := Color(0.12, 0.11, 0.1)
                  _box(Vector3(0, 0.1, -d * 0.5 + 0.05), Vector3(w, 0.2, 0.1), "metal", dark, false)
                  _box(Vector3(0, 0.1, d * 0.5 - 0.05), Vector3(w, 0.2, 0.1), "metal", dark, false)
                  _box(Vector3(-w * 0.5 + 0.05, 0.1, 0), Vector3(0.1, 0.2, d), "metal", dark, false)
                  _box(Vector3(w * 0.5 - 0.05, 0.1, 0), Vector3(0.1, 0.2, d), "metal", dark, false)


          func _crate(pos: Vector3, s: float = 1.2) -> void:
              _box(pos + Vector3(0, s * 0.5, 0), Vector3(s, s, s), "wood")


          func _recycler(pos: Vector3) -> void:
              _box(pos + Vector3(0, 1.1, 0), Vector3(2.0, 2.2, 1.4), "metal", Color(0.15, 0.5, 0.2))
              _box(pos + Vector3(0, 0.2, 0.1), Vector3(2.3, 0.4, 1.7), "hazard")
              _glow_box(pos + Vector3(0, 1.5, 0.72), Vector3(1.2, 0.6, 0.05), Color(0.2, 1.0, 0.3), 1.2)
              _text("RECYCLER", pos + Vector3(0, 2.6, 0), 64, Color(0.3, 1, 0.4), true)
              _light(pos + Vector3(0, 2.0, 1.0), Color(0.3, 1.0, 0.4), 1.0, 6.0)
              inter.append({"pos": pos + Vector3(0, 1.1, 1.0), "r": 1.3, "a": "recycle"})


          func _exit_door(pos: Vector3) -> void:
              exit_node = _glow_box(pos + Vector3(0, 1.5, 0), Vector3(0.3, 3.0, 3.0), Color(1.0, 0.15, 0.1), 1.5)
              _text("EXIT", pos + Vector3(-0.6, 3.4, 0), 72, Color(1, 1, 1), true)
              inter.append({"pos": pos + Vector3(-0.8, 1.3, 0), "r": 1.4, "a": "exit"})


          func _pad(pos: Vector3, label: String, col: Color, action: String) -> Label3D:
              _box(pos + Vector3(0, 0.5, 0), Vector3(0.5, 1.0, 0.5), "metal", Color(0.3, 0.3, 0.32))
              _glow_box(pos + Vector3(0, 1.06, 0), Vector3(0.4, 0.12, 0.4), col, 2.0)
              var t := _text(label, pos + Vector3(0, 1.9, 0), 56, col, true)
              inter.append({"pos": pos + Vector3(0, 1.1, 0), "r": 0.3, "a": action})
              return t


          func _spawn_item(pos: Vector3, kind: String) -> void:
              var n := MeshInstance3D.new()
              if kind == "gold":
                  var bm := BoxMesh.new()
                  bm.size = Vector3(0.3, 0.12, 0.15)
                  n.mesh = bm
                  n.material_override = mats.glow(Color(1.0, 0.78, 0.15), 0.9)
              else:
                  var sm := SphereMesh.new()
                  sm.radius = 0.12
                  sm.height = 0.3
                  sm.radial_segments = 6
                  sm.rings = 3
                  n.mesh = sm
                  n.material_override = mats.glow(Color(0.3, 0.95, 1.0), 1.6)
              n.position = pos
              world.add_child(n)
              items.append({"n": n, "kind": kind})


          func _fit_model(inst: Node3D, h: float) -> void:
              var best := 0.0
              for mi in inst.find_children("*", "MeshInstance3D", true, false):
                  best = maxf(best, (mi as MeshInstance3D).get_aabb().size.y)
              if best > 0.001:
                  inst.scale = Vector3.ONE * (h / best)


          func _spawn_monster(pos: Vector3, pts: Array) -> void:
              monster = CharacterBody3D.new()
              monster.collision_layer = 0
              monster.collision_mask = 1
              var cs := CollisionShape3D.new()
              var cap := CapsuleShape3D.new()
              cap.radius = 0.35
              cap.height = 1.5
              cs.shape = cap
              cs.position = Vector3(0, 0.75, 0)
              monster.add_child(cs)
              if model_scene:
                  var inst: Node3D = model_scene.instantiate()
                  monster.add_child(inst)
                  _fit_model(inst, 1.7)
              else:
                  var mi := MeshInstance3D.new()
                  var cm := CapsuleMesh.new()
                  cm.radius = 0.35
                  cm.height = 1.5
                  mi.mesh = cm
                  mi.material_override = mats.glow(Color(0.6, 0.05, 0.05), 0.5)
                  mi.position = Vector3(0, 0.75, 0)
                  monster.add_child(mi)
              var l := OmniLight3D.new()
              l.light_color = Color(1, 0.15, 0.1)
              l.light_energy = 1.5
              l.omni_range = 6.0
              l.position = Vector3(0, 1.4, 0)
              monster.add_child(l)
              monster.position = pos
              mon_start = pos
              waypoints = pts
              wp_i = 0
              world.add_child(monster)


          # ---------------------------------------------------------------- lobby
          func _enter_lobby() -> void:
              mode = "lobby"
              round_over = false
              _clear()
              _set_env(Color(0.62, 0.65, 0.68), Color(0.88, 0.9, 0.94), 1.15, 0.0)
              _room(26.0, 26.0, 5.0, "floor", "wall")
              for p in [Vector3(-6, 4.95, -6), Vector3(6, 4.95, -6), Vector3(-6, 4.95, 6), Vector3(6, 4.95, 6)]:
                  _panel(p, true)
              _crate(Vector3(-11, 0, -10))
              _crate(Vector3(-9.7, 0, -10.2))
              _crate(Vector3(-10.4, 1.2, -10.1))
              _crate(Vector3(11, 0, 9.5))
              _crate(Vector3(9.7, 0, 10.2))
              _recycler(Vector3(10.5, 0, -10.5))
              _box(Vector3(0, 2.6, -12.7), Vector3(9.0, 2.8, 0.1), "metal", Color(0.08, 0.08, 0.1), false)
              _text("WELCOME TO GILLA", Vector3(0, 3.6, -12.6), 90, Color(1, 1, 1))
              board = _text("", Vector3(0, 2.4, -12.6), 44, Color(0.6, 1.0, 0.6))
              _pad(Vector3(-6, 0, -8), "BASE RUN\nloot, recycle, escape", Color(1.0, 0.6, 0.1), "base")
              _pad(Vector3(0, 0, -8), "THE MINE\nfind the diamonds", Color(0.3, 0.9, 1.0), "mine")
              fur_label = _pad(Vector3(6, 0, -8), "", Color(0.9, 0.3, 0.9), "fur")
              _refresh_fur_label()
              player.spawn_pos = Vector3(0, 0.2, 6.0)
              player.respawn()


          func _refresh_fur_label() -> void:
              var nxt: int = (Game.equipped + 1) % Game.FUR.size()
              var f: Dictionary = Game.FUR[nxt]
              var price := "OWNED" if Game.owned.has(nxt) else "$%d" % f["cost"]
              fur_label.text = "FUR: %s\n%s" % [f["name"], price]
              board.text = "LEVEL %d     $%d\nXP %d / %d" % [Game.level(), Game.money, Game.xp, Game.xp_next()]


          # ---------------------------------------------------------------- base map (open halls, no maze)
          func _enter_base() -> void:
              mode = "base"
              round_over = false
              _clear()
              quota = 3
              item_val = 25
              round_t = 150.0
              _set_env(Color(0.55, 0.58, 0.62), Color(0.86, 0.88, 0.92), 1.0, 0.003)
              _room(64.0, 40.0, 5.0, "floor", "wall")
              # two divider walls with wide doorways -> three big halls
              _box(Vector3(-12, 2.5, -14), Vector3(0.6, 5, 12), "wall")
              _box(Vector3(-12, 2.5, 14), Vector3(0.6, 5, 12), "wall")
              _box(Vector3(12, 2.5, -13), Vector3(0.6, 5, 14), "wall")
              _box(Vector3(12, 2.5, 12), Vector3(0.6, 5, 16), "wall")
              for p in [Vector3(-20, 2.5, -8), Vector3(-20, 2.5, 8), Vector3(0, 2.5, -10), Vector3(0, 2.5, 10), Vector3(22, 2.5, -10), Vector3(22, 2.5, 12)]:
                  _box(p, Vector3(1.2, 5, 1.2), "wall")
              _crate(Vector3(-4, 0, 0))
              _crate(Vector3(-2.8, 0, 0.3))
              _crate(Vector3(-3.4, 1.2, 0.1))
              _crate(Vector3(18, 0, -14))
              _crate(Vector3(19.3, 0, -14.2))
              _crate(Vector3(26, 0, 6))
              _crate(Vector3(27.3, 0, 6.4))
              _crate(Vector3(-24, 0, -14))
              _box(Vector3(6, 1.0, -16), Vector3(4, 2, 0.8), "metal")
              _box(Vector3(6, 0.5, 6), Vector3(5, 1.0, 1.2), "metal", Color(0.4, 0.45, 0.4))
              for x in [-24, -8, 8, 24]:
                  for z in [-10, 10]:
                      _panel(Vector3(x, 4.95, z))
              for p in [Vector3(-24, 4.2, 0), Vector3(-6, 4.2, -10), Vector3(-6, 4.2, 10), Vector3(6, 4.2, 0), Vector3(20, 4.2, -10), Vector3(20, 4.2, 10), Vector3(28, 4.2, 0)]:
                  _light(p, Color(1, 0.97, 0.9), 1.3, 18.0)
              _recycler(Vector3(-28, 0, 0))
              _exit_door(Vector3(31.6, 0, 0))
              for p in [Vector3(-6, 0.15, -12), Vector3(-18, 0.15, 14), Vector3(4, 0.15, 0), Vector3(6, 0.15, -14), Vector3(20, 0.15, 10), Vector3(24, 0.15, -14), Vector3(28, 0.15, 14), Vector3(14, 0.15, 14)]:
                  _spawn_item(p, "gold")
              _spawn_monster(Vector3(24, 0, 0), [Vector3(0, 0, -10), Vector3(20, 0, 12), Vector3(24, 0, -12), Vector3(-4, 0, 10), Vector3(8, 0, 0), Vector3(-20, 0, 0)])
              player.spawn_pos = Vector3(-25, 0.2, 10)
              player.respawn()
              _say("FIND THE GOLD.  RECYCLE %d BARS.  ESCAPE." % quota)


          # ---------------------------------------------------------------- mine map (open cavern with real dirt/rock)
          func _enter_mine() -> void:
              mode = "mine"
              round_over = false
              _clear()
              quota = 4
              item_val = 60
              round_t = 180.0
              _set_env(Color(0.05, 0.02, 0.02), Color(0.55, 0.3, 0.24), 0.9, 0.01)
              _room(70.0, 40.0, 7.0, "dirt", "rock")
              for p in [Vector3(-18, 3.5, -8), Vector3(-10, 3.5, 10), Vector3(-2, 3.5, -12), Vector3(4, 3.5, 6), Vector3(12, 3.5, -6), Vector3(16, 3.5, 12), Vector3(24, 3.5, -12), Vector3(26, 3.5, 4)]:
                  _box(p, Vector3(2.8, 7, 2.8), "rock", Color(0.8, 0.75, 0.7))
              for p in [Vector3(-14, 0.6, 2), Vector3(0, 0.6, 0), Vector3(8, 0.6, -14), Vector3(20, 0.6, -2), Vector3(-6, 0.6, 14), Vector3(30, 0.6, 12)]:
                  _box(p, Vector3(1.8, 1.2, 1.6), "rock", Color(0.9, 0.85, 0.8))
              _crate(Vector3(-30, 0, 12))
              _crate(Vector3(-28.7, 0, 12.3))
              for p in [Vector3(-28, 2.5, -6), Vector3(-10, 2.5, 0), Vector3(8, 2.5, 8), Vector3(18, 2.5, -10), Vector3(30, 2.5, 0)]:
                  _light(p, Color(1.0, 0.55, 0.2), 1.4, 12.0)
                  _glow_box(p, Vector3(0.2, 0.3, 0.2), Color(1.0, 0.6, 0.2), 3.0)
              lamp = OmniLight3D.new()
              lamp.light_color = Color(1.0, 0.9, 0.75)
              lamp.light_energy = 2.2
              lamp.omni_range = 16.0
              player.cam.add_child(lamp)
              _recycler(Vector3(-32, 0, 0))
              _exit_door(Vector3(34.6, 0, 0))
              for p in [Vector3(-12, 0.15, -14), Vector3(-6, 0.15, 6), Vector3(2, 0.15, -4), Vector3(10, 0.15, 12), Vector3(18, 0.15, -12), Vector3(22, 0.15, 8), Vector3(30, 0.15, -8)]:
                  _spawn_item(p, "diamond")
              _spawn_monster(Vector3(26, 0, -8), [Vector3(10, 0, 0), Vector3(-8, 0, -10), Vector3(0, 0, 14), Vector3(22, 0, 10), Vector3(30, 0, 0)])
              player.spawn_pos = Vector3(-29, 0.2, 6)
              player.respawn()
              _say("COLLECT %d DIAMONDS.  SOMETHING IS DOWN HERE." % quota)


          # ---------------------------------------------------------------- game loop
          func _say(t: String) -> void:
              msg.text = t
              msg_t = 3.0


          func _hands() -> Array:
              return [player.ctrl["l"].global_position, player.ctrl["r"].global_position]


          func _near(p: Vector3, r: float) -> bool:
              for h in _hands():
                  if h.distance_to(p) < r:
                      return true
              return false


          func _process(dt: float) -> void:
              inter_cd = maxf(0.0, inter_cd - dt)
              msg_t -= dt
              if msg_t <= 0.0:
                  msg.text = ""
              for it in items:
                  it["n"].rotate_y(dt * 1.5)
              if mode == "lobby":
                  hud.text = "GILLA   LVL %d   $%d" % [Game.level(), Game.money]
              else:
                  var t := maxi(0, int(round_t))
                  hud.text = "LOOT %d   RECYCLED %d/%d   CARRY %d\n%d:%02d" % [items.size(), recycled, quota, carried, t / 60, t % 60]
                  if not round_over:
                      round_t -= dt
                      if round_t <= 0.0:
                          _end_round(false)
              if end_t > 0.0:
                  end_t -= dt
                  if end_t <= 0.0:
                      _enter_lobby()
              if round_over:
                  return
              _check_items()
              _check_interact()


          func _check_items() -> void:
              var head: Vector3 = player.cam.global_position
              for it in items.duplicate():
                  var p: Vector3 = it["n"].global_position
                  if _near(p, 0.3) or head.distance_to(p) < 0.5:
                      carried += 1
                      it["n"].queue_free()
                      items.erase(it)
                      _say("PICKED UP " + ("GOLD" if it["kind"] == "gold" else "DIAMOND"))


          func _check_interact() -> void:
              if inter_cd > 0.0:
                  return
              for it in inter:
                  if _near(it["pos"], it["r"]):
                      inter_cd = 0.7
                      _activate(it["a"])
                      return


          func _activate(a: String) -> void:
              match a:
                  "base":
                      _enter_base()
                  "mine":
                      _enter_mine()
                  "fur":
                      var nxt: int = (Game.equipped + 1) % Game.FUR.size()
                      var f: Dictionary = Game.FUR[nxt]
                      if Game.owned.has(nxt):
                          Game.equipped = nxt
                      elif Game.money >= int(f["cost"]):
                          Game.money -= int(f["cost"])
                          Game.owned.append(nxt)
                          Game.equipped = nxt
                          _say("BOUGHT " + str(f["name"]))
                      else:
                          _say("NOT ENOUGH MONEY")
                          return
                      Game.save_game()
                      player.set_tint(Game.FUR[Game.equipped]["color"])
                      _refresh_fur_label()
                  "recycle":
                      if carried <= 0:
                          _say("BRING LOOT HERE")
                          return
                      recycled += carried
                      Game.add_money(carried * item_val)
                      Game.add_xp(carried * 5)
                      _say("RECYCLED  +$%d" % (carried * item_val))
                      carried = 0
                      if recycled >= quota and not exit_open:
                          exit_open = true
                          if exit_node:
                              exit_node.material_override = mats.glow(Color(0.2, 1.0, 0.3), 2.0)
                          _say("EXIT OPEN!  GET OUT!")
                  "exit":
                      if exit_open:
                          _end_round(true)
                      else:
                          _say("RECYCLE %d MORE" % maxi(0, quota - recycled))


          func _end_round(win: bool) -> void:
              round_over = true
              end_t = 3.5
              if win:
                  Game.add_money(100)
                  Game.add_xp(40)
                  _say("YOU ESCAPED!   +$100  +40 XP")
              else:
                  _say("TIME UP")


          # ---------------------------------------------------------------- monster
          func _los(a: Vector3, b: Vector3) -> bool:
              var q := PhysicsRayQueryParameters3D.create(a, b, 1)
              return get_world_3d().direct_space_state.intersect_ray(q).is_empty()


          func _physics_process(dt: float) -> void:
              if monster == null or round_over or dt <= 0.0:
                  return
              var head: Vector3 = player.cam.global_position
              var mp := monster.global_position
              var flat := head - mp
              flat.y = 0.0
              var dist := flat.length()
              var chase := dist < 16.0 and _los(mp + Vector3(0, 1.2, 0), head)
              var target: Vector3
              var spd := 2.4
              if chase:
                  target = head
                  spd = 4.2
              else:
                  target = waypoints[wp_i]
                  if Vector2(mp.x - target.x, mp.z - target.z).length() < 1.5:
                      wp_i = (wp_i + 1) % waypoints.size()
              var d := target - mp
              d.y = 0.0
              d = d.normalized() if d.length() > 0.01 else Vector3.ZERO
              monster.velocity.x = d.x * spd
              monster.velocity.z = d.z * spd
              if monster.is_on_floor():
                  monster.velocity.y = -0.5
              else:
                  monster.velocity.y -= 9.8 * dt
              monster.move_and_slide()
              if d != Vector3.ZERO:
                  monster.rotation.y = lerp_angle(monster.rotation.y, atan2(-d.x, -d.z), minf(1.0, dt * 8.0))
              if not chase:
                  if monster.get_real_velocity().length() < 0.4:
                      stuck_t += dt
                      if stuck_t > 1.0:
                          wp_i = (wp_i + 1) % waypoints.size()
                          stuck_t = 0.0
                  else:
                      stuck_t = 0.0
              if dist < 1.0 and absf(head.y - mp.y) < 2.6:
                  carried = 0
                  _say("IT GOT YOU!  LOST YOUR LOOT")
                  player.spawn_pos = player.spawn_pos
                  player.respawn()
                  monster.global_position = mon_start
                  wp_i = 0
          EOF

      - name: Patch APK
        run: |
          python3 - <<'EOF'
          import zipfile
          src = "GillaRemake__1_.apk"
          out = "patched_unsigned.apk"
          names = ["game", "mats", "gorilla_player", "main"]
          drop = set()
          for m in names + ["avatar"]:
              drop.add(f"assets/{m}.gd.remap")
              drop.add(f"assets/{m}.gdc")
          zin = zipfile.ZipFile(src)
          zout = zipfile.ZipFile(out, "w")
          for info in zin.infolist():
              n = info.filename
              if n.startswith("META-INF/") or n in drop:
                  continue
              zi = zipfile.ZipInfo(n, date_time=info.date_time)
              zi.compress_type = info.compress_type
              zout.writestr(zi, zin.read(n))
          for m in names:
              zi = zipfile.ZipInfo(f"assets/{m}.gd", date_time=(2026, 11, 21, 0, 0, 0))
              zi.compress_type = zipfile.ZIP_DEFLATED
              zout.writestr(zi, open(f"patch/{m}.gd", "rb").read())
          zout.close()
          EOF

      - name: Align and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 patched_unsigned.apk patched_aligned.apk
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Gilla Remake"
          $BT/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out GillaRemake-fixed.apk patched_aligned.apk
          $BT/apksigner verify GillaRemake-fixed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GillaRemake-rebuilt
          path: GillaRemake-fixed.apk
