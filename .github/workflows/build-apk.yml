          func _shop_fur(i: int) -> void:
              var f: Dictionary = Game.FUR[i]
              if Game.owned.has(i):
                  Game.equipped = i
                  Game.save_game()
                  _apply_fur(Game.fur_color(), Game.fur_amount())
                  _say("EQUIPPED " + str(f["name"]).to_upper(), 2.0)
              elif Game.money >= int(f["cost"]):
                  Game.money -= int(f["cost"])
                  Game.owned.append(i)
                  Game.equipped = i
                  Game.save_game()
                  _apply_fur(Game.fur_color(), Game.fur_amount())
                  _say("BOUGHT " + str(f["name"]).to_upper(), 2.0)
              else:
                  _say("NOT ENOUGH MONEY", 2.0)
              _refresh_lobby_text()


          # ---------------------------------------------------------------------------
          # THE BASE / BE THE MONSTER : maze helpers
          # ---------------------------------------------------------------------------
          func _cell_center(c: Vector3i) -> Vector3:
              var fy := 0.0 if c.z == 0 else BASE_Y
              return Vector3((float(c.x) - GW / 2.0 + 0.5) * CELL, fy, (float(c.y) - GH / 2.0 + 0.5) * CELL)


          func _pos_to_cell(p: Vector3) -> Vector3i:
              var cx := clampi(int(floorf(p.x / CELL + GW / 2.0)), 0, GW - 1)
              var cy := clampi(int(floorf(p.z / CELL + GH / 2.0)), 0, GH - 1)
              var cz := 1 if p.y < -2.0 else 0
              return Vector3i(cx, cy, cz)


          func _passable(c: Vector3i) -> bool:
              if c.x < 0 or c.y < 0 or c.x >= GW or c.y >= GH:
                  return false
              var ch: String = lv[c.z][c.y][c.x]
              return ch != "#" and ch != "W" and ch != "L"


          func _is_open_ch(l: int, x: int, y: int) -> bool:
              var ch: String = lv[l][y][x]
              return ch != "#" and ch != "W" and ch != "L"


          func _neighbors(c: Vector3i) -> Array[Vector3i]:
              var res: Array[Vector3i] = []
              for d in DIRS:
                  var n := Vector3i(c.x + d.x, c.y + d.y, c.z)
                  if _passable(n):
                      res.append(n)
              if c == stair_top:
                  res.append(stair_bottom)
              elif c == stair_bottom:
                  res.append(stair_top)
              return res


          func _bfs_dist(from_c: Vector3i) -> Dictionary:
              var dist := {}
              dist[from_c] = 0
              var queue: Array = [from_c]
              var qi := 0
              while qi < queue.size():
                  var c: Vector3i = queue[qi]
                  qi += 1
                  for n in _neighbors(c):
                      if not dist.has(n):
                          dist[n] = int(dist[c]) + 1
                          queue.append(n)
              return dist


          # Cell centres to walk through (not including the start cell). Stairs get waypoints.
          func _find_path(from_c: Vector3i, to_c: Vector3i, avoid_c: Vector3i = Vector3i(-99, -99, 0), avoid_r: int = 0) -> Array:
              var result: Array = []
              if from_c == to_c:
                  return result
              var prev := {}
              prev[from_c] = from_c
              var queue: Array = [from_c]
              var qi := 0
              var found := false
              while qi < queue.size():
                  var c: Vector3i = queue[qi]
                  qi += 1
                  if c == to_c:
                      found = true
                      break
                  for n in _neighbors(c):
                      if prev.has(n):
                          continue
                      if avoid_r > 0 and n != to_c and n.z == avoid_c.z and absi(n.x - avoid_c.x) + absi(n.y - avoid_c.y) <= avoid_r:
                          continue
                      prev[n] = c
                      queue.append(n)
              if not found:
                  return result
              var rev: Array = []
              var cur: Vector3i = to_c
              while cur != from_c:
                  rev.append(cur)
                  cur = prev[cur]
              rev.reverse()
              var sc := _cell_center(Vector3i(stair_cell.x, stair_cell.y, 0))
              var last := from_c
              for c2 in rev:
                  var cc: Vector3i = c2
                  if cc.z != last.z:
                      var steps: Array = []
                      for i in 5:
                          steps.append(Vector3(sc.x - 1.5 + 0.6 * float(i) + 0.3, BASE_Y + 0.8 * float(i + 1), sc.z))
                      if cc.z == 1:
                          steps.reverse()
                      for s in steps:
                          result.append(s)
                  result.append(_cell_center(cc))
                  last = cc
              return result


          func _open_count(c: Vector3i) -> int:
              var n := 0
              for d in DIRS:
                  if _passable(Vector3i(c.x + d.x, c.y + d.y, c.z)):
                      n += 1
              return n


          func _vault_locked() -> bool:
              for d in doors:
                  if d["kind"] == "L" and not d["open"]:
                      return true
              return false


          func _locked_door() -> Dictionary:
              for d in doors:
                  if d["kind"] == "L" and not d["open"]:
                      return d
              return {}


          func _random_cell() -> Vector3i:
              return all_cells[rng.randi() % all_cells.size()]


          func _gen_maze() -> Array:
              var rows: Array = []
              for y in GH:
                  var r: Array = []
                  for x in GW:
                      r.append("#")
                  rows.append(r)
              var visited := {}
              var stack: Array = []
              var start := Vector2i(1, 1)
              visited[start] = true
              rows[1][1] = "."
              stack.append(start)
              while not stack.is_empty():
                  var c: Vector2i = stack[stack.size() - 1]
                  var opts: Array = []
                  for d in DIRS:
                      var n := c + d * 2
                      if n.x > 0 and n.y > 0 and n.x < GW - 1 and n.y < GH - 1 and not visited.has(n):
                          opts.append(d)
                  if opts.is_empty():
                      stack.pop_back()
                  else:
                      var dd: Vector2i = opts[rng.randi() % opts.size()]
                      var n2 := c + dd * 2
                      visited[n2] = true
                      rows[n2.y][n2.x] = "."
                      rows[c.y + dd.y][c.x + dd.x] = "."
                      stack.append(n2)
              # extra loops so nothing is a single long dead-end tree
              for k in 18:
                  var lx := rng.randi_range(1, GW - 2)
                  var ly := rng.randi_range(1, GH - 2)
                  if (lx % 2) != (ly % 2) and rows[ly][lx] == "#":
                      rows[ly][lx] = "."
              # a few open rooms
              for k in 3:
                  var cx := 3 + 2 * rng.randi_range(0, 5)
                  var cy := 3 + 2 * rng.randi_range(0, 4)
                  for yy in range(cy - 1, cy + 2):
                      for xx in range(cx - 1, cx + 2):
                          rows[yy][xx] = "."
              return rows


          # Wall slots between two open cells that can hold a door/window pane.
          func _slot_candidates(l: int, want: String, avoid: Vector2i) -> Array:
              var res: Array = []
              for y in range(1, GH - 1):
                  for x in range(1, GW - 1):
                      if (x % 2) == (y % 2):
                          continue
                      var ch: String = lv[l][y][x]
                      if ch != want:
                          continue
                      if avoid.x >= 0 and absi(avoid.x - x) + absi(avoid.y - y) == 1:
                          continue
                      if l == 0 and x == stair_cell.x + 1 and y == stair_cell.y:
                          continue
                      if l == 1 and x == stair_cell.x - 1 and y == stair_cell.y:
                          continue
                      var ok := false
                      if x % 2 == 0:
                          ok = _is_open_ch(l, x - 1, y) and _is_open_ch(l, x + 1, y) and lv[l][y - 1][x] == "#" and lv[l][y + 1][x] == "#"
                      else:
                          ok = _is_open_ch(l, x, y - 1) and _is_open_ch(l, x, y + 1) and lv[l][y][x - 1] == "#" and lv[l][y][x + 1] == "#"
                      if ok:
                          res.append(Vector2i(x, y))
              res.shuffle()
              return res


          func _generate_base() -> void:
              lv = [_gen_maze(), _gen_maze()]
              all_cells.clear()
              for l in 2:
                  for y in range(1, GH, 2):
                      for x in range(1, GW, 2):
                          all_cells.append(Vector3i(x, y, l))

              spawn_cell = Vector3i(1, 1, 0)
              recycler_pos = _cell_center(Vector3i(1, 3, 0))

              # stairs: basement cell (sx-2) -> up through the shaft -> ground cell (sx+2)
              var sx := 3 + 2 * rng.randi_range(0, 5)
              var sy := 1 + 2 * rng.randi_range(0, 6)
              stair_cell = Vector2i(sx, sy)
              lv[0][sy][sx] = "P"
              lv[0][sy][sx + 1] = "."
              lv[1][sy][sx - 1] = "."
              stair_top = Vector3i(sx + 2, sy, 0)
              stair_bottom = Vector3i(sx - 2, sy, 1)

              var dist := _bfs_dist(spawn_cell)
              var far := spawn_cell
              var fd := -1
              for k in dist.keys():
                  var kc: Vector3i = k
                  if kc.z == 0 and int(dist[k]) > fd:
                      fd = int(dist[k])
                      far = kc
              monster_cell = far

              # vault = farthest dead end, its only entrance becomes a locked door
              var vault := Vector2i(-1, -1)
              var vslot := Vector2i(-1, -1)
              var best := -1
              for y in range(1, GH, 2):
                  for x in range(1, GW, 2):
                      var c := Vector2i(x, y)
                      if c == Vector2i(1, 1) or c == Vector2i(1, 3) or c == stair_cell or Vector3i(x, y, 0) == far:
                          continue
                      var opens: Array = []
                      for d in DIRS:
                          var s: Vector2i = c + d
                          if lv[0][s.y][s.x] != "#":
                              opens.append(s)
                      if opens.size() == 1:
                          var dd := int(dist.get(Vector3i(x, y, 0), 0))
                          if dd > best:
                              best = dd
                              vault = c
                              vslot = opens[0]
              if vault.x >= 0 and best >= 5 and not (vslot.x == stair_cell.x + 1 and vslot.y == stair_cell.y):
                  lv[0][vslot.y][vslot.x] = "L"
                  lv[0][vault.y][vault.x] = "V"
              else:
                  vault = Vector2i(-1, -1)

              # windows and hazard doors
              var w0 := _slot_candidates(0, "#", vault)
              for i in mini(4, w0.size()):
                  var s: Vector2i = w0[i]
                  lv[0][s.y][s.x] = "W"
              var w1 := _slot_candidates(1, "#", Vector2i(-1, -1))
              for i in mini(3, w1.size()):
                  var s: Vector2i = w1[i]
                  lv[1][s.y][s.x] = "W"
              var h0 := _slot_candidates(0, ".", vault)
              for i in mini(3, h0.size()):
                  var s: Vector2i = h0[i]
                  lv[0][s.y][s.x] = "H"
              var h1 := _slot_candidates(1, ".", Vector2i(-1, -1))
              for i in mini(3, h1.size()):
                  var s: Vector2i = h1[i]
                  lv[1][s.y][s.x] = "H"

              # loot placement
              var pool0: Array = []
              var pool1: Array = []
              for y in range(1, GH, 2):
                  for x in range(1, GW, 2):
                      var cv := Vector2i(x, y)
                      if cv == stair_cell:
                          continue
                      pool1.append(cv)
                      if cv == Vector2i(1, 1) or cv == Vector2i(1, 3) or cv == vault or Vector3i(x, y, 0) == far:
                          continue
                      if int(dist.get(Vector3i(x, y, 0), 0)) < 4:
                          continue
                      pool0.append(cv)
              pool0.shuffle()
              pool1.shuffle()
              if not pool0.is_empty():
                  var kc2: Vector2i = pool0.pop_back()
                  _add_key(_cell_center(Vector3i(kc2.x, kc2.y, 0)))
              for i in 10:
                  if pool0.is_empty():
                      break
                  _place_item("gold", 0, pool0.pop_back())
              for i in 3:
                  if pool0.is_empty():
                      break
                  _place_item("diamond", 0, pool0.pop_back())
              for i in 8:
                  if pool1.is_empty():
                      break
                  _place_item("gold", 1, pool1.pop_back())
              for i in 4:
                  if pool1.is_empty():
                      break
                  _place_item("diamond", 1, pool1.pop_back())
              if vault.x >= 0:
                  var vc := _cell_center(Vector3i(vault.x, vault.y, 0))
                  _add_item("diamond", vc + Vector3(-0.7, 0.0, 0.0), true)
                  _add_item("diamond", vc + Vector3(0.7, 0.0, 0.0), true)
                  _add_item("diamond", vc + Vector3(0.0, 0.0, 0.7), true)
                  _add_item("gold", vc + Vector3(0.0, 0.0, -0.7), true)


          func _place_item(kind: String, l: int, c: Vector2i) -> void:
              var p := _cell_center(Vector3i(c.x, c.y, l))
              p += Vector3(rng.randf_range(-0.7, 0.7), 0.0, rng.randf_range(-0.7, 0.7))
              _add_item(kind, p, false)


          func _add_item(kind: String, pos: Vector3, in_vault: bool) -> void:
              var n := MeshInstance3D.new()
