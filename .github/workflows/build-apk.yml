              light.position = Vector3(0.0, 4.8, 0.0)
              world.add_child(light)
              var light2 := OmniLight3D.new()
              light2.omni_range = 14.0
              light2.light_energy = 1.0
              light2.light_color = Color(1.0, 0.85, 0.6)
              light2.position = Vector3(0.0, 4.0, -6.0)
              world.add_child(light2)

              _label("GILLA", Vector3(0.0, 4.6, -8.4), 0.014, 120, Color(0.5, 1.0, 0.45))
              _label("fan remake  -  touch a button with your hand", Vector3(0.0, 3.7, -8.4), 0.004, 40, Color(0.85, 0.85, 0.85))
              _label("Player model: Gilla vr player model OFFICIAL by jlozano0137 (CC BY 4.0)", Vector3(0.0, 0.5, 8.4), 0.0028, 40, Color(0.7, 0.7, 0.7))

              _make_pad(Vector3(-5.0, 0.0, -7.0), "THE BASE", "loot, recycle,\nescape", Color(0.95, 0.75, 0.15), "base")
