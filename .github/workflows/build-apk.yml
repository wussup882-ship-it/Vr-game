          func _add_box(parent: Node, center: Vector3, size: Vector3, tint: Color, mat: Material = null, kind: String = "wall") -> StaticBody3D:
              var body := StaticBody3D.new()
              body.collision_layer = 1
              body.position = center
              var mesh := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = size
              mesh.mesh = bm
              if mat != null:
                  mesh.material_override = mat
              else:
                  mesh.material_override = mats.surface(kind, tint, 0.4)
              body.add_child(mesh)
              var shape := CollisionShape3D.new()
              var bs := BoxShape3D.new()
              bs.size = size
              shape.shape = bs
              body.add_child(shape)
              parent.add_child(body)
              return body


