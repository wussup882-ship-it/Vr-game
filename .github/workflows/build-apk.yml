name: Build Gilla VR APK

# Gilla remake (fan project) for Meta Quest.
# Repo needs: this file in .github/workflows/ and gilla.glb (the player model) in the repo root.
# Everything else (scripts, textures) is written by this file. Download the APK from the
# run's Artifacts or the Releases page.
on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out repo (for gilla.glb)
        uses: actions/checkout@v4

      - name: Write project files
        run: |
          mkdir -p game/build && cd game
          # Player model is embedded below (Gilla vr player model OFFICIAL by jlozano0137, CC-BY-4.0).
          # A gilla.glb in the repo root overrides it.
          if [ -f ../gilla.glb ]; then cp ../gilla.glb gilla.glb; else
          echo "::warning::gilla.glb is missing from the repo root - using placeholder apes"
          fi
          ls -la gilla.glb

          cat > project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Gilla Remake"
          run/main_scene="res://main.tscn"
          config/features=PackedStringArray("4.4", "GL Compatibility")

          [display]
          window/vsync/vsync_mode=0

          [physics]
          common/physics_ticks_per_second=72

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/vram_compression/import_etc2_astc=true
          anti_aliasing/quality/msaa_3d=0

          [xr]
          openxr/enabled=true
          openxr/startup_alert=false
          shaders/enabled=true

          [autoload]

          Game="*res://game.gd"

          [audio]

          driver/enable_input=true
          EOF

          cat > main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://main.gd" id="1"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > game.gd <<'EOF'
          extends Node

          # Save data, daily quests, levels and fur shop (autoload "Game").

          const SAVE_PATH := "user://gilla_remake.cfg"

          var FUR: Array = [
              {"name": "Gilla Green", "color": Color(0.3, 0.6, 0.2), "cost": 0, "amt": 0.0},
              {"name": "Charcoal", "color": Color(0.1, 0.1, 0.13), "cost": 150, "amt": 1.0},
              {"name": "Silver", "color": Color(0.72, 0.74, 0.8), "cost": 300, "amt": 1.0},
              {"name": "Crimson", "color": Color(0.75, 0.06, 0.08), "cost": 500, "amt": 1.0},
              {"name": "Ocean", "color": Color(0.12, 0.4, 0.95), "cost": 800, "amt": 1.0},
              {"name": "Gold", "color": Color(1.0, 0.78, 0.15), "cost": 1500, "amt": 1.0},
          ]

          var money := 0
          var xp := 0
          var owned: Array = [0]
          var equipped := 0
          var quest_day := ""
          var quests: Array = []


          func _ready() -> void:
              load_game()
              roll_quests()


          func level() -> int:
              return 1 + int(sqrt(float(xp) / 100.0))


          func xp_next() -> int:
              var l := level()
              return 100 * l * l


          func fur_color() -> Color:
              var f: Dictionary = FUR[equipped]
              return f["color"]


          func fur_amount() -> float:
              var f: Dictionary = FUR[equipped]
              return float(f["amt"])


          func add_money(n: int) -> void:
              money += n
              save_game()


          func add_xp(n: int) -> void:
              xp += n
              save_game()


          func roll_quests() -> void:
              var today := Time.get_date_string_from_system()
              if quest_day == today and quests.size() > 0:
                  return
              quest_day = today
              var r := RandomNumberGenerator.new()
              r.seed = hash(today)
              var defs: Array = [
                  {"id": "gold", "text": "Recycle %d gold bars", "lo": 6, "hi": 14, "per": 8},
                  {"id": "diamond", "text": "Recycle %d diamonds", "lo": 2, "hi": 5, "per": 30},
                  {"id": "escape", "text": "Escape the base %d time(s)", "lo": 1, "hi": 2, "per": 80},
                  {"id": "catch", "text": "Catch %d apes as the monster", "lo": 3, "hi": 8, "per": 20},
                  {"id": "splash", "text": "Cross DON'T SPLASH %d time(s)", "lo": 1, "hi": 2, "per": 70},
              ]
              for i in range(defs.size() - 1, 0, -1):
                  var j := r.randi_range(0, i)
                  var tmp = defs[i]
                  defs[i] = defs[j]
                  defs[j] = tmp
              quests = []
              for k in 3:
                  var d: Dictionary = defs[k]
                  var goal := r.randi_range(int(d["lo"]), int(d["hi"]))
                  quests.append({
                      "id": d["id"],
                      "text": String(d["text"]) % goal,
                      "goal": goal,
                      "progress": 0,
                      "reward": goal * int(d["per"]),
                      "done": false,
                  })
              save_game()


          # Returns the money reward if this call completed a quest, else 0.
          func progress(id: String, n: int) -> int:
              for q in quests:
                  if q["id"] == id and not q["done"]:
                      q["progress"] = mini(int(q["progress"]) + n, int(q["goal"]))
                      if int(q["progress"]) >= int(q["goal"]):
                          q["done"] = true
                          money += int(q["reward"])
                          save_game()
                          return int(q["reward"])
                      save_game()
                      return 0
              return 0


          func save_game() -> void:
              var cf := ConfigFile.new()
              cf.set_value("p", "money", money)
              cf.set_value("p", "xp", xp)
              cf.set_value("p", "owned", owned)
              cf.set_value("p", "equipped", equipped)
              cf.set_value("p", "quest_day", quest_day)
              cf.set_value("p", "quests", quests)
              cf.save(SAVE_PATH)


          func load_game() -> void:
              var cf := ConfigFile.new()
              if cf.load(SAVE_PATH) != OK:
                  return
              money = int(cf.get_value("p", "money", 0))
              xp = int(cf.get_value("p", "xp", 0))
              owned = cf.get_value("p", "owned", [0])
              equipped = int(cf.get_value("p", "equipped", 0))
              quest_day = str(cf.get_value("p", "quest_day", ""))
              quests = cf.get_value("p", "quests", [])
          EOF

          cat > gorilla_player.gd <<'EOF'
          extends CharacterBody3D

          # Godot 4 port of the Unity "GorillaLocomotion" Player.cs.
          # No thumbstick walking: push off surfaces with your hands to move,
          # let go while moving to launch yourself. Right thumbstick = snap turn only.
          #
          # Like the Unity rig, the body capsule hangs ~0.6 m BELOW the head, so you
          # are a short gorilla and your hands reach the ground while standing normally.
          # (Tracking-space floor ends up about 1 m below the virtual ground.)

          const HEAD_RADIUS := 0.15
          const BODY_RADIUS := 0.15
          const BODY_HEIGHT := 0.5
          const BODY_OFFSET := Vector3(0.0, -0.35, 0.06)  # relative to the head, yaw-rotated
          const HAND_VISUAL_RADIUS := 0.06
          const WORLD_MASK := 1
          const CAST_SKIN := 0.003
          const FLOOR_FRICTION := 5.0  # stops the body sliding along the floor after you let go
          const FUR_COLOR := Color(0.2, 0.14, 0.1)
          const HAND_COLOR := Color(0.3, 0.21, 0.15)
          const SHOULDER_OFFSET := Vector3(0.19, -0.24, 0.02)  # from the head (yaw-rotated)

          # Same defaults as the Unity "Gorilla Rig" prefab
          var velocity_history_size := 8
          var max_arm_length := 1.5
          var unstick_distance := 1.0
          var velocity_limit := 0.4
          var max_jump_speed := 6.5
          var jump_multiplier := 1.1
          var minimum_raycast_distance := 0.035
          var default_slide_factor := 0.03
          var default_precision := 0.995
          var gravity := 9.8
          var snap_turn_degrees := 30.0

          var origin: XROrigin3D
          var cam: XRCamera3D
          var left_ctrl: XRController3D
          var right_ctrl: XRController3D
          var left_follower: MeshInstance3D
          var right_follower: MeshInstance3D
          var body_shape: CollisionShape3D
          var left_arm: MeshInstance3D
          var right_arm: MeshInstance3D
          var spawn_point := Vector3(0.0, 2.0, 0.0)
          var fur_color := FUR_COLOR

          var _sphere := SphereShape3D.new()
          var _query := PhysicsShapeQueryParameters3D.new()
          var _exclude: Array[RID] = []

          var _running := false
          var _last_left := Vector3.ZERO
          var _last_right := Vector3.ZERO
          var _last_head := Vector3.ZERO
          var _last_position := Vector3.ZERO
          var _was_left := false
          var _was_right := false
          var _vel_history: Array[Vector3] = []
          var _vel_index := 0
          var _vel_avg := Vector3.ZERO
          var _turn_latched := false


          func _ready() -> void:
              # Run after the XR camera / controllers have updated this frame.
              process_priority = 1000

              origin = XROrigin3D.new()
              add_child(origin)
              cam = XRCamera3D.new()
              origin.add_child(cam)
              left_ctrl = _make_controller("left_hand")
              right_ctrl = _make_controller("right_hand")
              left_follower = _make_follower(HAND_COLOR)
              right_follower = _make_follower(HAND_COLOR)
              left_arm = _make_arm()
              right_arm = _make_arm()

              var capsule := CapsuleShape3D.new()
              capsule.radius = BODY_RADIUS
              capsule.height = BODY_HEIGHT
              body_shape = CollisionShape3D.new()
              body_shape.shape = capsule
              add_child(body_shape)

              collision_layer = 2
              collision_mask = WORLD_MASK
              _exclude.append(get_rid())
              _query.shape = _sphere
              _query.collision_mask = WORLD_MASK
              _query.exclude = _exclude

              for i in velocity_history_size:
                  _vel_history.append(Vector3.ZERO)


          func _make_controller(tracker_name: String) -> XRController3D:
              var c := XRController3D.new()
              c.tracker = tracker_name
              origin.add_child(c)
              return c


          func _make_follower(color: Color) -> MeshInstance3D:
              var mesh := MeshInstance3D.new()
              var s := SphereMesh.new()
              s.radius = HAND_VISUAL_RADIUS
              s.height = HAND_VISUAL_RADIUS * 2.0
              s.radial_segments = 16
              s.rings = 8
              mesh.mesh = s
              var m := StandardMaterial3D.new()
              m.albedo_color = color
              mesh.material_override = m
              add_child(mesh)
              return mesh


          func _make_arm() -> MeshInstance3D:
              var mesh := MeshInstance3D.new()
              var cyl := CylinderMesh.new()
              cyl.top_radius = 0.03     # wrist end (towards the hand)
              cyl.bottom_radius = 0.05  # shoulder end
              cyl.height = 1.0
              cyl.radial_segments = 10
              cyl.rings = 1
              mesh.mesh = cyl
              var m := StandardMaterial3D.new()
              m.albedo_color = FUR_COLOR
              m.emission_enabled = true
              m.emission = FUR_COLOR
              m.emission_energy_multiplier = 0.25
              m.roughness = 1.0
              mesh.material_override = m
              mesh.visible = false
              add_child(mesh)
              return mesh


          # Stretch a unit cylinder between a shoulder point and a hand.
          func _place_arm(arm: MeshInstance3D, a: Vector3, b: Vector3) -> void:
              var d := b - a
              var length := d.length()
              if length < 0.02:
                  arm.visible = false
                  return
              arm.visible = true
              var y := d / length
              var ref := Vector3.UP
              if absf(y.dot(ref)) > 0.95:
                  ref = Vector3.RIGHT
              var x := ref.cross(y).normalized()
              var z := x.cross(y).normalized()
              arm.global_transform = Transform3D(Basis(x, y * length, z), (a + b) * 0.5)


          func _update_arms() -> void:
              var head := cam.global_position
              var yaw := cam.global_transform.basis.get_euler().y
              var yb := Basis(Vector3.UP, yaw)
              var ls := head + yb * Vector3(-SHOULDER_OFFSET.x, SHOULDER_OFFSET.y, SHOULDER_OFFSET.z)
              var rs := head + yb * SHOULDER_OFFSET
              _place_arm(left_arm, ls, left_follower.global_position)
              _place_arm(right_arm, rs, right_follower.global_position)


          func _process(delta: float) -> void:
              if not _running:
                  _try_start()
                  return

              # Prevents falling through the floor on frame spikes (same as Unity).
              var dt := minf(delta, 1.0 / 20.0)
              if dt <= 0.0:
                  return

              _handle_turning()
              _update_body_shape()
              _update_locomotion(dt)
              _integrate_body(dt)
              _update_arms()

              if global_position.y < -60.0 or global_position.length() > 800.0:
                  _respawn()


          func _try_start() -> void:
              # Wait until the headset is actually tracking.
              if cam.position.y < 0.3:
                  return
              # Put the body capsule just above the ground (capsule bottom = head - 0.6 m).
              global_position.y = 0.65 - cam.position.y
              _update_body_shape()
              _last_head = cam.global_position
              _last_left = _hand_target(left_ctrl)
              _last_right = _hand_target(right_ctrl)
              _last_position = global_position
              velocity = Vector3.ZERO
              _vel_avg = Vector3.ZERO
              _vel_index = 0
              for i in _vel_history.size():
                  _vel_history[i] = Vector3.ZERO
              _was_left = false
              _was_right = false
              _running = true


          func respawn() -> void:
              _respawn()


          func _respawn() -> void:
              _running = false
              velocity = Vector3.ZERO
              global_position = spawn_point


          func _update_body_shape() -> void:
              var yaw := cam.global_transform.basis.get_euler().y
              body_shape.global_position = cam.global_position + Basis(Vector3.UP, yaw) * BODY_OFFSET


          # Hand position, clamped to max arm length from the head.
          func _hand_target(ctrl: XRController3D) -> Vector3:
              var head := cam.global_position
              if not ctrl.get_is_active() or not ctrl.get_has_tracking_data():
                  return head
              var p := ctrl.global_position
              var d := p - head
              if d.length() < max_arm_length:
                  return p
              return head + d.normalized() * max_arm_length


          func _handle_turning() -> void:
              var stick := right_ctrl.get_vector2("primary")
              if absf(stick.x) > 0.7:
                  if not _turn_latched:
                      _turn_latched = true
                      turn(-snap_turn_degrees * signf(stick.x), true)
              elif absf(stick.x) < 0.4:
                  _turn_latched = false


          # Port of Player.Turn(): rotate the rig around the head.
          func turn(degrees: float, snap: bool) -> void:
              var pivot := cam.global_position
              var rot := Basis(Vector3.UP, deg_to_rad(degrees))
              var t := global_transform
              t.origin = pivot + rot * (t.origin - pivot)
              t.basis = rot * t.basis
              global_transform = t
              _vel_avg = rot * _vel_avg
              for i in _vel_history.size():
                  _vel_history[i] = rot * _vel_history[i]
              velocity = rot * velocity
              _last_left = pivot + rot * (_last_left - pivot)
              _last_right = pivot + rot * (_last_right - pivot)
              _last_position = pivot + rot * (_last_position - pivot)
              _last_head = pivot + rot * (_last_head - pivot)
              if snap:
                  _was_left = false
                  _was_right = false


          # ---------------------------------------------------------------------------
          # Main locomotion update (port of Player.Update)
          # ---------------------------------------------------------------------------
          func _update_locomotion(dt: float) -> void:
              var left_col := false
              var right_col := false
              var first_left := Vector3.ZERO
              var first_right := Vector3.ZERO
              var grav_bias := Vector3.DOWN * 2.0 * gravity * dt * dt

              var cur_left := _hand_target(left_ctrl)
              var cur_right := _hand_target(right_ctrl)

              # left hand
              var r := _iter_cast(_last_left, minimum_raycast_distance, cur_left - _last_left + grav_bias, default_precision, true)
              if not r.is_empty():
                  # stick to the spot we touched while we keep touching it
                  if _was_left:
                      first_left = _last_left - cur_left
                  else:
                      first_left = r["pos"] - cur_left
                  velocity = Vector3.ZERO
                  left_col = true

              # right hand
              r = _iter_cast(_last_right, minimum_raycast_distance, cur_right - _last_right + grav_bias, default_precision, true)
              if not r.is_empty():
                  if _was_right:
                      first_right = _last_right - cur_right
                  else:
                      first_right = r["pos"] - cur_right
                  velocity = Vector3.ZERO
                  right_col = true

              # average or add
              var rb_move := Vector3.ZERO
              if (left_col or _was_left) and (right_col or _was_right):
                  rb_move = (first_left + first_right) / 2.0
              else:
                  rb_move = first_left + first_right

              # check valid head movement
              var head := cam.global_position
              var head_hit := _iter_cast(_last_head, HEAD_RADIUS, head + rb_move - _last_head, default_precision, false)
              if not head_hit.is_empty():
                  rb_move = head_hit["pos"] - _last_head
                  var ray_vec := head - _last_head + rb_move
                  if ray_vec.length() > 0.00001:
                      var ray_len := ray_vec.length() + HEAD_RADIUS * default_precision * 0.999
                      if not _ray_hit(_last_head, ray_vec.normalized() * ray_len).is_empty():
                          rb_move = _last_head - head

              if rb_move != Vector3.ZERO:
                  global_position += rb_move
              _last_head = cam.global_position

              # final left hand position
              cur_left = _hand_target(left_ctrl)
              var single := not ((left_col or _was_left) and (right_col or _was_right))
              r = _iter_cast(_last_left, minimum_raycast_distance, cur_left - _last_left, default_precision, single)
              if not r.is_empty():
                  _last_left = r["pos"]
                  left_col = true
              else:
                  _last_left = cur_left

              # final right hand position
              cur_right = _hand_target(right_ctrl)
              single = not ((left_col or _was_left) and (right_col or _was_right))
              r = _iter_cast(_last_right, minimum_raycast_distance, cur_right - _last_right, default_precision, single)
              if not r.is_empty():
                  _last_right = r["pos"]
                  right_col = true
              else:
                  _last_right = cur_right

              _store_velocities(dt)

              # launch / push-off velocity
              if right_col or left_col:
                  var speed := _vel_avg.length()
                  if speed > velocity_limit:
                      if speed * jump_multiplier > max_jump_speed:
                          velocity = _vel_avg.normalized() * max_jump_speed
                      else:
                          velocity = jump_multiplier * _vel_avg

              # unstick a hand that got left far behind
              if left_col:
                  cur_left = _hand_target(left_ctrl)
                  if (cur_left - _last_left).length() > unstick_distance and _head_line_clear(cur_left):
                      _last_left = cur_left
                      left_col = false
              if right_col:
                  cur_right = _hand_target(right_ctrl)
                  if (cur_right - _last_right).length() > unstick_distance and _head_line_clear(cur_right):
                      _last_right = cur_right
                      right_col = false

              left_follower.global_position = _last_left
              right_follower.global_position = _last_right

              _was_left = left_col
              _was_right = right_col


          func _head_line_clear(hand_pos: Vector3) -> bool:
              var head := cam.global_position
              var to_hand := hand_pos - head
              var dist := maxf(to_hand.length() - minimum_raycast_distance, 0.0)
              if dist <= 0.0:
                  return true
              return _sphere_cast(head, minimum_raycast_distance * default_precision, to_hand.normalized() * dist).is_empty()


          func _store_velocities(dt: float) -> void:
              _vel_index = (_vel_index + 1) % velocity_history_size
              var oldest := _vel_history[_vel_index]
              var current := (global_position - _last_position) / dt
              _vel_avg += (current - oldest) / float(velocity_history_size)
              _vel_history[_vel_index] = current
              _last_position = global_position


          # Stands in for the Unity Rigidbody: gravity + body capsule collision.
          func _integrate_body(dt: float) -> void:
              velocity.y -= gravity * dt
              _update_body_shape()
              var col := move_and_collide(velocity * dt)
              var on_floor_now := false
              if col != null:
                  var n := col.get_normal()
                  if n.y > 0.6:
                      on_floor_now = true
                  velocity = velocity.slide(n)
                  var rest := col.get_remainder().slide(n)
                  if rest.length() > 0.0001:
                      move_and_collide(rest)
              # Friction: without this the body keeps skating along the floor forever.
              if on_floor_now:
                  var k := exp(-FLOOR_FRICTION * dt)
                  velocity.x *= k
                  velocity.z *= k
                  if Vector2(velocity.x, velocity.z).length() < 0.05:
                      velocity.x = 0.0
                      velocity.z = 0.0


          # ---------------------------------------------------------------------------
          # Collision helpers (port of the Unity SphereCast helpers)
          # ---------------------------------------------------------------------------

          # Sphere sweep. Returns {} on no hit, else {pos, normal, collider_id}
          # where pos is the sphere centre at first contact.
          func _sphere_cast(start: Vector3, radius: float, motion: Vector3) -> Dictionary:
              var length := motion.length()
              if length < 0.00001:
                  return {}
              var space := get_world_3d().direct_space_state
              _sphere.radius = maxf(radius, 0.001)
              _query.transform = Transform3D(Basis.IDENTITY, start)
              _query.motion = motion
              _query.margin = CAST_SKIN
              var result := space.cast_motion(_query)
              if result.size() < 2 or result[0] >= 1.0:
                  return {}
              var safe: float = result[0]
              var unsafe: float = result[1]
              var dir := motion / length
              var hit := {"pos": start + motion * safe}
              # find the surface normal at the contact position
              _query.transform = Transform3D(Basis.IDENTITY, start + motion * unsafe)
              _query.motion = Vector3.ZERO
              _query.margin = maxf(radius * 0.1, 0.02)
              var rest := space.get_rest_info(_query)
              _query.margin = CAST_SKIN
              if rest.is_empty():
                  hit["normal"] = -dir
                  hit["collider_id"] = 0
              else:
                  var n: Vector3 = rest["normal"]
                  if n.dot(dir) > 0.0:
                      n = -n
                  hit["normal"] = n.normalized()
                  hit["collider_id"] = rest.get("collider_id", 0)
              return hit


          func _ray_hit(from: Vector3, motion: Vector3) -> Dictionary:
              if motion.length() < 0.00001:
                  return {}
              var space := get_world_3d().direct_space_state
              var rq := PhysicsRayQueryParameters3D.create(from, from + motion, WORLD_MASK, _exclude)
              return space.intersect_ray(rq)


          # Port of CollisionsSphereCast: contact position plus anti-clipping ray check.
          func _collisions_cast(start: Vector3, radius: float, motion: Vector3, precision: float) -> Dictionary:
              var length := motion.length()
              if length < 0.00001:
                  return {}
              var dir := motion / length
              var hit := _sphere_cast(start, radius * precision, dir * (length + radius * (1.0 - precision)))
              if not hit.is_empty():
                  var final_pos: Vector3 = hit["pos"]
                  var to_final := final_pos - start
                  var tf_len := to_final.length()
                  if tf_len > 0.00001:
                      var ray_len := tf_len + radius * precision * precision * 0.999
                      if not _ray_hit(start, to_final / tf_len * ray_len).is_empty():
                          final_pos = start
                  hit["pos"] = final_pos
                  return hit
              var ray := _ray_hit(start, dir * (length + radius * precision * 0.999))
              if not ray.is_empty():
                  return {"pos": start, "normal": ray["normal"], "collider_id": 0}
              return {}


          # Port of IterativeCollisionSphereCast: contact + a small slide along the surface.
          func _iter_cast(start: Vector3, radius: float, motion: Vector3, precision: float, single_hand: bool) -> Dictionary:
              var hit := _collisions_cast(start, radius * precision, motion, precision)
              if not hit.is_empty():
                  var first_pos: Vector3 = hit["pos"]
                  var slip := default_slide_factor
                  if single_hand:
                      slip = 0.001
                  var cid := int(hit.get("collider_id", 0))
                  if cid != 0:
                      var collider := instance_from_id(cid)
                      if collider != null and collider.has_meta("slip_percentage"):
                          slip = float(collider.get_meta("slip_percentage"))
                  var normal: Vector3 = hit["normal"]
                  var slide := (start + motion - first_pos).slide(normal) * slip
                  var h2 := _collisions_cast(first_pos, radius, slide, precision * precision)
                  if not h2.is_empty():
                      return {"pos": h2["pos"]}
                  var from3 := slide + first_pos
                  var h3 := _collisions_cast(from3, radius, start + motion - from3, precision * precision * precision)
                  if not h3.is_empty():
                      return {"pos": h3["pos"]}
                  return {"pos": first_pos}
              # sanity check with a smaller sphere for when we start out already touching
              var mlen := motion.length()
              if mlen > 0.00001:
                  var small := radius * precision * 0.66
                  var h4 := _collisions_cast(start, small, motion / mlen * (mlen + radius * precision * 0.34), precision * 0.66)
                  if not h4.is_empty():
                      return {"pos": start}
              return {}


          # Gilla remake: recolour the arms and hands (fur shop).
          func set_fur(c: Color) -> void:
              fur_color = c
              for arm in [left_arm, right_arm]:
                  var m := arm.material_override as StandardMaterial3D
                  if m != null:
                      m.albedo_color = c
                      m.emission = c
              for f in [left_follower, right_follower]:
                  var fm := f.material_override as StandardMaterial3D
                  if fm != null:
                      fm.albedo_color = c.lightened(0.25)
          EOF

          cat > avatar.gd <<'EOF'
          extends Node3D

          # Gilla ape avatar built from the official player model (gilla.glb).
          # Arms are solved with a stretchy two-bone IK so they can reach the controllers
          # (or the floor, for AI apes). The head can be hidden for first-person view.

          const MODEL_PATH := "res://gilla.glb"

          const FUR_SHADER := """
          shader_type spatial;
          render_mode cull_disabled;
          uniform sampler2D albedo_tex : source_color, filter_linear_mipmap, repeat_enable;
          uniform vec3 fur_tint : source_color = vec3(0.3, 0.6, 0.2);
          uniform float tint_amount = 0.0;
          void fragment() {
              vec3 t = texture(albedo_tex, UV).rgb;
              float lum = dot(t, vec3(0.3, 0.59, 0.11));
              float fur = clamp((t.g - max(t.r, t.b)) * 8.0, 0.0, 1.0) * tint_amount;
              vec3 recol = lum * fur_tint * 3.0;
              ALBEDO = mix(t, recol, fur);
              ROUGHNESS = 0.92;
              RIM = 0.45;
              RIM_TINT = 0.6;
              SPECULAR = 0.15;
          }
          """

          var skeleton: Skeleton3D
          var body_mesh: MeshInstance3D
          var eye_mesh: MeshInstance3D
          var fur_mat: ShaderMaterial
          var model_root: Node3D
          var b_head := -1
          var b_ul := -1
          var b_ll := -1
          var b_hl := -1
          var b_ur := -1
          var b_lr := -1
          var b_hr := -1
          var phase := 0.0


          static func available() -> bool:
              return ResourceLoader.exists(MODEL_PATH)


          func build(tint: Color, amount: float, hide_head: bool) -> bool:
              if not ResourceLoader.exists(MODEL_PATH):
                  return false
              var scn := load(MODEL_PATH) as PackedScene
              if scn == null:
                  return false
              model_root = Node3D.new()
              add_child(model_root)
              var inst := scn.instantiate()
              model_root.add_child(inst)
              skeleton = _find_skeleton(inst)
              if skeleton == null:
                  return false
              b_head = _bone("head_")
              b_ul = _bone("upperarm_L")
              b_ll = _bone("lowerarm_L")
              b_hl = _bone("hand_L")
              b_ur = _bone("upperarm_R")
              b_lr = _bone("lowerarm_R")
              b_hr = _bone("hand_R")
              # the rig is authored Z-up: stand it upright if needed (face ends up on +Z)
              if b_head >= 0:
                  var hp := skeleton.get_bone_global_rest(b_head).origin
                  if absf(hp.z) > absf(hp.y):
                      model_root.rotation_degrees = Vector3(-90.0, 0.0, 0.0)
              var meshes: Array = []
              _find_meshes(inst, meshes)
              var best := -1.0
              for m in meshes:
                  var mi: MeshInstance3D = m
                  var vol := mi.get_aabb().size.length()
                  if vol > best:
                      best = vol
                      body_mesh = mi
              for m2 in meshes:
                  if m2 != body_mesh:
                      eye_mesh = m2
              if body_mesh != null:
                  var tex: Texture2D = null
                  var orig := body_mesh.get_active_material(0)
                  if orig is BaseMaterial3D:
                      tex = (orig as BaseMaterial3D).albedo_texture
                  if tex != null:
                      var sh := Shader.new()
                      sh.code = FUR_SHADER
                      fur_mat = ShaderMaterial.new()
                      fur_mat.shader = sh
                      fur_mat.set_shader_parameter("albedo_tex", tex)
                      body_mesh.material_override = fur_mat
                      set_fur(tint, amount)
              if hide_head and b_head >= 0:
                  skeleton.set_bone_pose_scale(b_head, Vector3.ONE * 0.001)
              return true


          func set_fur(c: Color, amount: float) -> void:
              if fur_mat == null:
                  return
              fur_mat.set_shader_parameter("fur_tint", c)
              fur_mat.set_shader_parameter("tint_amount", amount)


          func set_eye_glow(c: Color) -> void:
              if eye_mesh == null:
                  return
              var m := StandardMaterial3D.new()
              m.albedo_color = c
              m.emission_enabled = true
              m.emission = c
              m.emission_energy_multiplier = 3.0
              eye_mesh.material_override = m


          func _find_skeleton(n: Node) -> Skeleton3D:
              if n is Skeleton3D:
                  return n as Skeleton3D
              for c in n.get_children():
                  var r := _find_skeleton(c)
                  if r != null:
                      return r
              return null


          func _find_meshes(n: Node, out: Array) -> void:
              if n is MeshInstance3D:
                  out.append(n)
              for c in n.get_children():
                  _find_meshes(c, out)


          func _bone(prefix: String) -> int:
              for i in skeleton.get_bone_count():
                  if skeleton.get_bone_name(i).begins_with(prefix):
                      return i
              return -1


          func shoulder_world(side: int) -> Vector3:
              var b := b_ul if side == 0 else b_ur
              if skeleton == null or b < 0:
                  return global_position + Vector3(0.0, 0.7, 0.0)
              return skeleton.global_transform * skeleton.get_bone_global_pose(b).origin


          func _axis(bone: int) -> Vector3:
              var o := skeleton.get_bone_rest(bone).origin
              if absf(o.y) >= absf(o.x) and absf(o.y) >= absf(o.z):
                  return Vector3(0.0, 1.0, 0.0)
              if absf(o.x) >= absf(o.z):
                  return Vector3(1.0, 0.0, 0.0)
              return Vector3(0.0, 0.0, 1.0)


          func _aim(bone: int, child: int, want: Vector3) -> void:
              if want.length() < 0.0001:
                  return
              var gp := skeleton.get_bone_global_pose(bone)
              var cur := skeleton.get_bone_global_pose(child).origin - gp.origin
              if cur.length() < 0.0001:
                  return
              var q := Quaternion(cur.normalized(), want.normalized())
              var nb := Basis(q) * gp.basis
              var parent := skeleton.get_bone_parent(bone)
              var pb := Basis.IDENTITY
              if parent >= 0:
                  pb = skeleton.get_bone_global_pose(parent).basis
              var local := pb.inverse() * nb
              skeleton.set_bone_pose_rotation(bone, local.orthonormalized().get_rotation_quaternion())


          # side 0 = left arm, 1 = right arm. Stretches the arm if the target is out of reach.
          func aim_arm(side: int, target_world: Vector3, pole_world: Vector3) -> void:
              if skeleton == null:
                  return
              var bu := b_ul if side == 0 else b_ur
              var lo := b_ll if side == 0 else b_lr
              var ha := b_hl if side == 0 else b_hr
              if bu < 0 or lo < 0 or ha < 0:
                  return
              var l1 := skeleton.get_bone_rest(lo).origin.length()
              var l2 := skeleton.get_bone_rest(ha).origin.length()
              if l1 < 0.001 or l2 < 0.001:
                  return
              skeleton.set_bone_pose_scale(bu, Vector3.ONE)
              skeleton.set_bone_pose_scale(ha, Vector3.ONE)
              var inv := skeleton.global_transform.affine_inverse()
              var t: Vector3 = inv * target_world
              var s: Vector3 = skeleton.get_bone_global_pose(bu).origin
              var to_t := t - s
              var dist := to_t.length()
              if dist < 0.001:
                  return
              var dirv := to_t / dist
              var reach := (l1 + l2) * 0.98
              var k := 1.0
              if dist > reach:
                  k = minf(dist / reach, 3.2)
              var l1k := l1 * k
              var l2k := l2 * k
              var dd := minf(dist, (l1k + l2k) * 0.999)
              var a := (l1k * l1k - l2k * l2k + dd * dd) / (2.0 * dd)
              var hgt := sqrt(maxf(l1k * l1k - a * a, 0.0))
              var pole: Vector3 = inv.basis * pole_world
              var pv := pole - dirv * pole.dot(dirv)
              if pv.length() < 0.0001:
                  pv = dirv.cross(Vector3.RIGHT)
                  if pv.length() < 0.0001:
                      pv = dirv.cross(Vector3.UP)
              pv = pv.normalized()
              var elbow := s + dirv * a + pv * hgt
              var wrist := s + dirv * dd
              var axis := _axis(lo)
              skeleton.set_bone_pose_scale(bu, Vector3.ONE + axis * (k - 1.0))
              skeleton.set_bone_pose_scale(ha, Vector3.ONE + axis * (1.0 / k - 1.0))
              _aim(bu, lo, elbow - s)
              _aim(lo, ha, wrist - elbow)


          # Knuckle-walk style idle/walk animation for AI apes and display models.
          func animate_ai(delta: float, speed: float, floor_y: float) -> void:
              if skeleton == null:
                  return
              phase += delta * (2.0 + speed * 2.4)
              var amp := clampf(speed / 3.0, 0.0, 1.0) * 0.45
              var sc := scale.x
              var fwd := global_transform.basis.z.normalized()
              var center := global_position
              for side in 2:
                  var sh := shoulder_world(side)
                  var out := sh - center
                  out.y = 0.0
                  if out.length() < 0.001:
                      out = Vector3.RIGHT
                  out = out.normalized()
                  var sw := sin(phase + (0.0 if side == 0 else PI)) * amp * sc
                  var tgt := Vector3(sh.x, floor_y, sh.z) + out * 0.10 * sc + fwd * (0.12 * sc + sw)
                  aim_arm(side, tgt, out * 0.6 - fwd * 0.5)
          EOF

