          extends RefCounted

          # Procedural textures and materials (no image files needed).

          var cache := {}
          var tex := {}


          func _noise(size: int, freq: float, seed_v: int, octaves: int) -> PackedByteArray:
              var n := FastNoiseLite.new()
              n.noise_type = FastNoiseLite.TYPE_SIMPLEX_SMOOTH
              n.seed = seed_v
              n.frequency = freq
              n.fractal_octaves = octaves
              var img := n.get_seamless_image(size, size)
              img.convert(Image.FORMAT_L8)
              return img.get_data()


          func _tex(kind: String) -> ImageTexture:
              if tex.has(kind):
                  return tex[kind]
              var t: ImageTexture
              if kind == "floor":
                  t = _floor_tex()
              elif kind == "wood":
                  t = _wood_tex()
              elif kind == "metal":
                  t = _metal_tex()
              elif kind == "hazard":
                  t = _hazard_tex()
              else:
                  t = _wall_tex()
              tex[kind] = t
              return t


          func _wall_tex() -> ImageTexture:
              var S := 256
              var a := _noise(S, 0.012, 11, 4)
              var b := _noise(S, 0.12, 12, 3)
              var c := _noise(S, 0.035, 13, 3)
              var img := Image.create(S, S, true, Image.FORMAT_RGB8)
              for y in S:
                  for x in S:
                      var i := y * S + x
                      var big := float(a[i]) / 255.0
                      var grain := float(b[i]) / 255.0
                      var stain := float(c[i]) / 255.0
                      var v := 0.50 + 0.22 * big + 0.16 * grain
                      var col := Color(v * 0.78, v * 0.84, v * 0.80)
                      if stain < 0.34:
                          col = col.darkened((0.34 - stain) * 1.8)
                          col = Color(col.r * 0.95, col.g, col.b * 0.85)
                      var px := x % 128
                      var py := y % 128
                      if px < 2 or py < 2:
                          col = col.darkened(0.45)
                      elif px == 2 or py == 2:
                          col = col.lightened(0.08)
                      var rx := px - 9
                      var ry := py - 9
                      if rx * rx + ry * ry < 9:
                          col = col.lightened(0.2)
                      img.set_pixel(x, y, col)
              img.generate_mipmaps()
              return ImageTexture.create_from_image(img)


          func _floor_tex() -> ImageTexture:
              var S := 256
              var a := _noise(S, 0.03, 21, 4)
              var b := _noise(S, 0.15, 22, 3)
              var img := Image.create(S, S, true, Image.FORMAT_RGB8)
              for y in S:
                  for x in S:
                      var i := y * S + x
                      var tx := x / 64
                      var ty := y / 64
                      var tv := float((tx * 73 + ty * 151) % 17) / 17.0
                      var v := 0.36 + 0.10 * tv + 0.14 * (float(b[i]) / 255.0)
                      v *= 0.75 + 0.45 * (float(a[i]) / 255.0)
                      var col := Color(v * 0.92, v * 0.97, v)
                      var px := x % 64
                      var py := y % 64
                      if px < 2 or py < 2:
                          col = Color(0.08, 0.09, 0.09)
                      elif px == 2 or py == 2:
                          col = col.lightened(0.12)
                      img.set_pixel(x, y, col)
              img.generate_mipmaps()
              return ImageTexture.create_from_image(img)


          func _wood_tex() -> ImageTexture:
              var S := 128
              var a := _noise(S, 0.04, 31, 3)
              var b := _noise(S, 0.2, 32, 2)
              var img := Image.create(S, S, true, Image.FORMAT_RGB8)
              for y in S:
                  for x in S:
                      var i := y * S + x
                      var plank := x / 32
                      var tone := float((plank * 37) % 11) / 11.0
                      var grain := sin((float(y) + float(a[i]) / 255.0 * 40.0) * 0.45) * 0.5 + 0.5
                      var v := 0.62 + 0.18 * grain + 0.12 * tone + 0.1 * (float(b[i]) / 255.0)
                      var col := Color(0.62 * v, 0.42 * v, 0.24 * v)
                      if (x % 32) < 2:
                          col = Color(0.1, 0.07, 0.04)
                      img.set_pixel(x, y, col)
              img.generate_mipmaps()
              return ImageTexture.create_from_image(img)


          func _metal_tex() -> ImageTexture:
              var S := 128
              var a := _noise(S, 0.2, 41, 3)
              var img := Image.create(S, S, true, Image.FORMAT_RGB8)
              for y in S:
                  for x in S:
                      var i := y * S + x
                      var v := 0.42 + 0.25 * (float(a[i]) / 255.0)
                      if (y % 8) == 0:
                          v *= 0.85
                      var col := Color(v * 0.85, v * 0.9, v)
                      if x < 2 or y < 2 or x > S - 3 or y > S - 3:
                          col = col.darkened(0.4)
                      img.set_pixel(x, y, col)
              img.generate_mipmaps()
              return ImageTexture.create_from_image(img)


          func _hazard_tex() -> ImageTexture:
              var S := 128
              var img := Image.create(S, S, true, Image.FORMAT_RGB8)
              for y in S:
                  for x in S:
                      var band := ((x + y) / 20) % 2
                      var col := Color(0.95, 0.75, 0.05) if band == 0 else Color(0.07, 0.07, 0.07)
                      img.set_pixel(x, y, col)
              img.generate_mipmaps()
              return ImageTexture.create_from_image(img)


          var ntex := {}


          func _normal_tex(kind: String) -> ImageTexture:
              if ntex.has(kind):
                  return ntex[kind]
              var im: Image = _tex(kind).get_image()
              im.decompress()
              im.convert(Image.FORMAT_RGBA8)
              im.bump_map_to_normal_map(3.0)
              im.generate_mipmaps(true)
              var t := ImageTexture.create_from_image(im)
              ntex[kind] = t
              return t


          func surface(kind: String, tint: Color, uv: float = 0.4) -> StandardMaterial3D:
              var key := kind + tint.to_html() + str(uv)
              if cache.has(key):
                  return cache[key]
              var m := StandardMaterial3D.new()
              m.albedo_texture = _tex(kind)
              m.albedo_color = tint
              m.uv1_triplanar = true
              m.uv1_world_triplanar = true
              m.uv1_scale = Vector3(uv, uv, uv)
              m.texture_filter = BaseMaterial3D.TEXTURE_FILTER_LINEAR_WITH_MIPMAPS_ANISOTROPIC
              m.roughness = 0.9
              if kind != "hazard":
                  m.normal_enabled = true
                  m.normal_texture = _normal_tex(kind)
                  m.normal_scale = 0.8
              if kind == "metal":
                  m.metallic = 0.4
                  m.roughness = 0.5
              elif kind == "floor":
                  m.roughness = 0.65
              cache[key] = m
              return m


          func glow(col: Color, energy: float) -> StandardMaterial3D:
              var m := StandardMaterial3D.new()
              m.albedo_color = col
              m.emission_enabled = true
              m.emission = col
              m.emission_energy_multiplier = energy
              return m


          func gold() -> StandardMaterial3D:
              var m := StandardMaterial3D.new()
              m.albedo_color = Color(1.0, 0.78, 0.2)
              m.metallic = 0.7
              m.roughness = 0.28
              m.emission_enabled = true
              m.emission = Color(0.9, 0.55, 0.05)
              m.emission_energy_multiplier = 0.9
              return m


          func diamond() -> StandardMaterial3D:
              var m := StandardMaterial3D.new()
              m.albedo_color = Color(0.5, 0.95, 1.0, 0.8)
              m.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              m.cull_mode = BaseMaterial3D.CULL_DISABLED
              m.roughness = 0.05
              m.emission_enabled = true
              m.emission = Color(0.2, 0.8, 1.0)
              m.emission_energy_multiplier = 1.8
              return m


          func glass() -> StandardMaterial3D:
              var m := StandardMaterial3D.new()
              m.albedo_color = Color(0.55, 0.85, 1.0, 0.3)
              m.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              m.roughness = 0.05
              m.metallic = 0.2
              return m


          func diamond_mesh(r: float) -> ArrayMesh:
              var st := SurfaceTool.new()
              st.begin(Mesh.PRIMITIVE_TRIANGLES)
              var top := Vector3(0.0, r * 1.4, 0.0)
              var bot := Vector3(0.0, -r * 1.4, 0.0)
              var ring: Array = []
              for i in 6:
                  var an := TAU * float(i) / 6.0
                  ring.append(Vector3(cos(an) * r, 0.0, sin(an) * r))
              for i in 6:
                  var p0: Vector3 = ring[i]
                  var p1: Vector3 = ring[(i + 1) % 6]
                  st.add_vertex(top)
                  st.add_vertex(p1)
                  st.add_vertex(p0)
                  st.add_vertex(bot)
                  st.add_vertex(p0)
                  st.add_vertex(p1)
              st.generate_normals()
              return st.commit()


          func water() -> ShaderMaterial:
              var sh := Shader.new()
              sh.code = """
          shader_type spatial;
          render_mode blend_mix, cull_disabled;
          uniform vec4 deep : source_color = vec4(0.02, 0.2, 0.42, 0.88);
          uniform vec4 shallow : source_color = vec4(0.1, 0.62, 0.82, 0.7);
          varying vec3 wpos;
          void vertex() {
              wpos = (MODEL_MATRIX * vec4(VERTEX, 1.0)).xyz;
              VERTEX.y += sin(wpos.x * 0.7 + TIME * 1.2) * 0.07 + cos(wpos.z * 0.9 + TIME * 0.9) * 0.06;
          }
          void fragment() {
              float w = sin(wpos.x * 2.0 + TIME * 1.5) * sin(wpos.z * 2.3 - TIME * 1.1);
              float f = pow(1.0 - clamp(dot(NORMAL, VIEW), 0.0, 1.0), 2.5);
              vec4 c = mix(deep, shallow, clamp(f * 0.7 + w * 0.12 + 0.25, 0.0, 1.0));
              float foam = smoothstep(0.8, 1.0, w) * 0.4;
              ALBEDO = c.rgb + vec3(foam);
              ALPHA = c.a;
              ROUGHNESS = 0.1;
              SPECULAR = 0.8;
          }
          """
              var m := ShaderMaterial.new()
              m.shader = sh
              return m
          EOF

