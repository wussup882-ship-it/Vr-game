              var h := 6.0
              var wall_t := Color(0.8, 0.88, 0.9)
              _add_box(world, Vector3(0.0, -1.0, 0.0), Vector3(w, 2.0, w), Color(0.85, 0.9, 0.85), null, "floor")
              _add_box(world, Vector3(0.0, h + 0.2, 0.0), Vector3(w, 0.4, w), Color(0.45, 0.5, 0.5))
              _add_box(world, Vector3(0.0, h / 2.0, -w / 2.0 - 0.2), Vector3(w + 0.8, h, 0.4), wall_t)
              _add_box(world, Vector3(0.0, h / 2.0, w / 2.0 + 0.2), Vector3(w + 0.8, h, 0.4), wall_t)
              _add_box(world, Vector3(-w / 2.0 - 0.2, h / 2.0, 0.0), Vector3(0.4, h, w + 0.8), wall_t)
              _add_box(world, Vector3(w / 2.0 + 0.2, h / 2.0, 0.0), Vector3(0.4, h, w + 0.8), wall_t)
              var trim := mats.glow(Color(0.2, 0.9, 0.5), 1.4)
