              flash.light_energy = 0.0
              cam.add_child(flash)

              hud = Label3D.new()
              hud.pixel_size = 0.0009
              hud.font_size = 48
              hud.modulate = Color(1.0, 0.9, 0.5)
              hud.no_depth_test = true
              hud.position = Vector3(0.0, -0.3, -0.8)
              cam.add_child(hud)

              if "--selftest" in OS.get_cmdline_user_args():
                  _selftest()
                  return
              _setup_mic()
              _start_xr()
              _enter_lobby()


          func _start_xr() -> void:
              var xr = XRServer.find_interface("OpenXR")
              if xr == null:
                  return
              if not xr.is_initialized():
                  xr.initialize()
              if xr.is_initialized():
                  get_viewport().use_xr = true
                  DisplayServer.window_set_vsync_mode(DisplayServer.VSYNC_DISABLED)


          func _say(text: String, secs: float) -> void:
              msg_text = text
              msg_t = secs


          # ---------------------------------------------------------------------------
          # Voice chat stand-in: the monster hears YOUR microphone
          # ---------------------------------------------------------------------------
          func _setup_mic() -> void:
              AudioServer.add_bus()
              var idx := AudioServer.bus_count - 1
              AudioServer.set_bus_name(idx, "MicCapture")
              mic_capture = AudioEffectCapture.new()
              AudioServer.add_bus_effect(idx, mic_capture)
              AudioServer.set_bus_mute(idx, true)
              mic_player = AudioStreamPlayer.new()
              mic_player.stream = AudioStreamMicrophone.new()
              mic_player.bus = "MicCapture"
              add_child(mic_player)
              get_tree().on_request_permissions_result.connect(_on_permission_result)
              OS.request_permissions()
              mic_player.play()


          func _on_permission_result(permission: String, granted: bool) -> void:
              if granted and permission.find("RECORD_AUDIO") >= 0 and mic_player != null:
                  mic_player.stop()
                  mic_player.play()


          func _update_voice(delta: float) -> void:
              if mic_capture == null:
                  return
              var n := mic_capture.get_frames_available()
              if n > 0:
                  var buf := mic_capture.get_buffer(n)
                  var sum := 0.0
                  for i in buf.size():
                      var s: Vector2 = buf[i]
                      sum += s.x * s.x
                  var rms := sqrt(sum / float(maxi(buf.size(), 1)))
                  mic_level = lerpf(mic_level, rms, 0.5)
              else:
                  mic_level = lerpf(mic_level, 0.0, minf(1.0, delta * 4.0))
              talking = mic_level > 0.03


          # ---------------------------------------------------------------------------
          # Per-frame
          # ---------------------------------------------------------------------------
          func _process(delta: float) -> void:
              if player == null or cam == null or delta <= 0.0:
                  return
              t_now += delta
              _update_voice(delta)
              var head := cam.global_position
              if player._running:
                  var inst := (head - last_head).length() / delta
                  head_speed = lerpf(head_speed, minf(inst, 12.0), minf(1.0, delta * 6.0))
                  head_vel = head_vel.lerp((head - last_head) / delta, minf(1.0, delta * 6.0))
              else:
                  head_speed = 0.0
                  head_vel = Vector3.ZERO
              last_head = head

              var lcp := player.left_ctrl.global_position
              var rcp := player.right_ctrl.global_position
              lc_speed = (lcp - lc_prev).length() / delta
              rc_speed = (rcp - rc_prev).length() / delta
              lc_prev = lcp
              rc_prev = rcp

              if msg_t > 0.0:
                  msg_t -= delta

              _update_local_avatar()
              _animate_items(delta)
              if flicker_mat != null:
                  flicker_t -= delta
                  if flicker_t <= 0.0:
                      flicker_t = rng.randf_range(0.05, 0.4)
                      flicker_mat.emission_energy_multiplier = rng.randf_range(0.2, 1.6) if rng.randf() < 0.5 else 1.6

              if player._running and not round_over:
                  _update_interacts(delta)
              if mode == "base" or mode == "monster":
                  _update_base(delta)
              elif mode == "splash":
                  _update_splash(delta)
              _update_hud()


          func _apply_fur(c: Color, amt: float) -> void:
              player.set_fur(c)
              if avatar_local != null:
                  avatar_local.set_fur(c, amt)


          # The Gilla body hangs under your head; its arms stretch to your hands.
          func _update_local_avatar() -> void:
              if avatar_local == null:
                  return
              var head := cam.global_position
              var f := -cam.global_transform.basis.z
              f.y = 0.0
              if f.length() > 0.05:
                  f = f.normalized()
                  avatar_yaw = lerp_angle(avatar_yaw, atan2(f.x, f.z), 0.25)
              avatar_local.rotation.y = avatar_yaw
              var fwd := Vector3(sin(avatar_yaw), 0.0, cos(avatar_yaw))
              avatar_local.global_position = Vector3(head.x, head.y - 0.93, head.z) - fwd * 0.1
              for side in 2:
                  var tgt := player.left_follower.global_position if side == 0 else player.right_follower.global_position
                  var sh := avatar_local.shoulder_world(side)
                  var out := sh - avatar_local.global_position
                  out.y = 0.0
                  if out.length() < 0.001:
                      out = Vector3.RIGHT
                  out = out.normalized()
                  avatar_local.aim_arm(side, tgt, out * 0.6 + Vector3.DOWN * 0.6 - fwd * 0.2)


          func _animate_items(delta: float) -> void:
              for i in items.size():
                  var it: Dictionary = items[i]
                  if it["taken"]:
                      continue
                  var nd: Node3D = it["node"]
                  var home: Vector3 = it["home"]
                  nd.rotation.y += delta * 1.4
                  nd.position.y = home.y + sin(t_now * 2.0 + float(i)) * 0.03
              for s in spinners:
                  var sn: Node3D = s["node"]
                  sn.rotation.y += delta * float(s["speed"])


          func _flat(a: Vector3, b: Vector3) -> float:
              return Vector2(a.x - b.x, a.z - b.z).length()


          func _update_hud() -> void:
              var t := ""
              if msg_t > 0.0:
                  t = msg_text
              elif mode == "lobby":
                  t = "GILLA   LVL %d   $%d" % [Game.level(), Game.money]
              elif mode == "base":
                  t = "TEAM %d/%d   YOU %d" % [team_value, quota, my_value]
                  if carried.size() > 0:
                      t += "   CARRY %d" % carried.size()
                  if has_key:
                      t += "   KEYCARD"
                  t += "\n" + _clock(round_t)
                  if talking:
                      t += "   VOICE!"
              elif mode == "monster":
                  t = "CAUGHT %d/%d   APES %d/%d" % [caught_bots, bots.size(), team_value, quota]
                  t += "\n" + _clock(round_t)
              elif mode == "splash":
                  t = "SPLASHES %d" % splashes
              if hud.text != t:
                  hud.text = t


          func _clock(t: float) -> String:
              var s := int(maxf(t, 0.0))
              return "%d:%02d" % [s / 60, s % 60]


          # ---------------------------------------------------------------------------
          # Hand-touch buttons
          # ---------------------------------------------------------------------------
          func _update_interacts(delta: float) -> void:
              interact_cd = maxf(interact_cd - delta, 0.0)
              var hands: Array[Vector3] = [player.left_follower.global_position, player.right_follower.global_position]
              for it in interacts:
                  var near := false
                  for h in hands:
                      if h.distance_to(it["pos"]) < it["radius"]:
                          near = true
                  if near and interact_cd <= 0.0:
                      it["t"] += delta
                      if it["t"] >= 0.5:
                          it["t"] = 0.0
                          interact_cd = 1.0
                          _activate(it["action"], it["arg"])
                          return
                  else:
                      it["t"] = maxf(it["t"] - delta * 2.0, 0.0)


          func _activate(action: String, arg: int) -> void:
              if action == "base":
                  _start_base(false)
              elif action == "monster":
                  _start_base(true)
              elif action == "splash":
                  _start_splash()
              elif action == "lobby":
                  _enter_lobby()
              elif action == "fur":
                  _shop_fur(arg)


          func _add_interact(pos: Vector3, radius: float, action: String, arg: int) -> void:
              interacts.append({"pos": pos, "radius": radius, "action": action, "arg": arg, "t": 0.0})


