              _add_mesh_box(Vector3(0.0, 0.08, w / 2.0 - 0.03), Vector3(w, 0.1, 0.06), trim)
              _add_mesh_box(Vector3(-w / 2.0 + 0.03, 0.08, 0.0), Vector3(0.06, 0.1, w), trim)
              _add_mesh_box(Vector3(w / 2.0 - 0.03, 0.08, 0.0), Vector3(0.06, 0.1, w), trim)
              for lx in [-5.0, 5.0]:
                  for lz in [-5.0, 5.0]:
                      _add_mesh_box(Vector3(lx, h - 0.05, lz), Vector3(2.0, 0.08, 0.5), mats.glow(Color(1.0, 0.95, 0.8), 2.0))
                      _add_box(world, Vector3(lx * 1.7, h / 2.0, lz * 1.7), Vector3(0.7, h, 0.7), Color(0.7, 0.75, 0.8), null, "metal")
              var light := OmniLight3D.new()
