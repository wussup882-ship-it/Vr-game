          var spawn_cell := Vector3i(1, 1, 0)
          var monster_cell := Vector3i(1, 1, 0)
          var stair_cell := Vector2i(3, 1)
          var stair_top := Vector3i(5, 1, 0)
          var stair_bottom := Vector3i(1, 1, 1)
          var recycler_pos := Vector3.ZERO
          var key_node: MeshInstance3D
          var has_key := false
          var team_value := 0
          var my_value := 0
          var quota := 0
          var round_t := 0.0
          var round_over := false
          var over_t := 0.0
          var caught_bots := 0

          # monster
          var monster: Node3D
          var mstate := "patrol"
          var path: Array = []
          var repath_t := 0.0
          var lost_t := 0.0
          var caught_t := 0.0
          var chase_pos := Vector3.ZERO
          var noise_pos := Vector3.ZERO
          var noise_r := 0.0
          var noise_t := 0.0

          # splash
          var platforms: Array = []
          var goal_pos := Vector3.ZERO
          var splashes := 0
          var sink_delay := 1.0


          func _ready() -> void:
              Engine.physics_ticks_per_second = 72
              rng.randomize()
              mats = Mats.new()
              _build_environment()

              player = GorillaPlayer.new()
              player.name = "GorillaPlayer"
              add_child(player)
              cam = player.cam

              # the official Gilla ape model is the player's body (needs gilla.glb in the repo)
              use_model = Avatar.available()
              if use_model:
                  avatar_local = Avatar.new()
                  add_child(avatar_local)
                  if avatar_local.build(Game.fur_color(), Game.fur_amount(), true):
                      player.left_arm.visible = false
                      player.right_arm.visible = false
                      player.left_follower.visible = false
                      player.right_follower.visible = false
                  else:
                      avatar_local.queue_free()
                      avatar_local = null
                      use_model = false
              _apply_fur(Game.fur_color(), Game.fur_amount())

              lamp = OmniLight3D.new()
              lamp.omni_range = 12.0
              lamp.light_energy = 0.0
              lamp.shadow_enabled = false
              cam.add_child(lamp)

              flash = OmniLight3D.new()
              flash.light_color = Color(1.0, 0.0, 0.0)
              flash.omni_range = 6.0
              flash.light_energy = 0.0
              cam.add_child(flash)

              hud = Label3D.new()
              hud.pixel_size = 0.0009
              hud.font_size = 48
              hud.modulate = Color(1.0, 0.9, 0.5)
              hud.no_depth_test = true
              hud.position = Vector3(0.0, -0.3, -0.8)
              cam.add_child(hud)

              if "--selftest" in OS.get_cmdline_user_args():
                  _selftest()
                  return
              _setup_mic()
              _start_xr()
              _enter_lobby()


          func _start_xr() -> void:
              var xr = XRServer.find_interface("OpenXR")
              if xr == null:
                  return
              if not xr.is_initialized():
                  xr.initialize()
              if xr.is_initialized():
                  get_viewport().use_xr = true
                  DisplayServer.window_set_vsync_mode(DisplayServer.VSYNC_DISABLED)


          func _say(text: String, secs: float) -> void:
              msg_text = text
              msg_t = secs


          # ---------------------------------------------------------------------------
          # Voice chat stand-in: the monster hears YOUR microphone
          # ---------------------------------------------------------------------------
          func _setup_mic() -> void:
              AudioServer.add_bus()
              var idx := AudioServer.bus_count - 1
              AudioServer.set_bus_name(idx, "MicCapture")
              mic_capture = AudioEffectCapture.new()
              AudioServer.add_bus_effect(idx, mic_capture)
              AudioServer.set_bus_mute(idx, true)
              mic_player = AudioStreamPlayer.new()
              mic_player.stream = AudioStreamMicrophone.new()
              mic_player.bus = "MicCapture"
              add_child(mic_player)
              get_tree().on_request_permissions_result.connect(_on_permission_result)
              OS.request_permissions()
              mic_player.play()


          func _on_permission_result(permission: String, granted: bool) -> void:
              if granted and permission.find("RECORD_AUDIO") >= 0 and mic_player != null:
                  mic_player.stop()
                  mic_player.play()


          func _update_voice(delta: float) -> void:
              if mic_capture == null:
                  return
              var n := mic_capture.get_frames_available()
              if n > 0:
                  var buf := mic_capture.get_buffer(n)
                  var sum := 0.0
                  for i in buf.size():
                      var s: Vector2 = buf[i]
                      sum += s.x * s.x
                  var rms := sqrt(sum / float(maxi(buf.size(), 1)))
                  mic_level = lerpf(mic_level, rms, 0.5)
              else:
                  mic_level = lerpf(mic_level, 0.0, minf(1.0, delta * 4.0))
              talking = mic_level > 0.03


          # ---------------------------------------------------------------------------
          # Per-frame
          # ---------------------------------------------------------------------------
          func _process(delta: float) -> void:
              if player == null or cam == null or delta <= 0.0:
                  return
              t_now += delta
              _update_voice(delta)
              var head := cam.global_position
              if player._running:
                  var inst := (head - last_head).length() / delta
                  head_speed = lerpf(head_speed, minf(inst, 12.0), minf(1.0, delta * 6.0))
                  head_vel = head_vel.lerp((head - last_head) / delta, minf(1.0, delta * 6.0))
              else:
                  head_speed = 0.0
                  head_vel = Vector3.ZERO
              last_head = head

              var lcp := player.left_ctrl.global_position
              var rcp := player.right_ctrl.global_position
              lc_speed = (lcp - lc_prev).length() / delta
              rc_speed = (rcp - rc_prev).length() / delta
              lc_prev = lcp
              rc_prev = rcp

              if msg_t > 0.0:
                  msg_t -= delta

              _update_local_avatar()
              _animate_items(delta)
              if flicker_mat != null:
                  flicker_t -= delta
                  if flicker_t <= 0.0:
                      flicker_t = rng.randf_range(0.05, 0.4)
                      flicker_mat.emission_energy_multiplier = rng.randf_range(0.2, 1.6) if rng.randf() < 0.5 else 1.6

              if player._running and not round_over:
                  _update_interacts(delta)
              if mode == "base" or mode == "monster":
                  _update_base(delta)
              elif mode == "splash":
                  _update_splash(delta)
              _update_hud()


          func _apply_fur(c: Color, amt: float) -> void:
              player.set_fur(c)
              if avatar_local != null:
                  avatar_local.set_fur(c, amt)


          # The Gilla body hangs under your head; its arms stretch to your hands.
          func _update_local_avatar() -> void:
              if avatar_local == null:
                  return
              var head := cam.global_position
              var f := -cam.global_transform.basis.z
              f.y = 0.0
              if f.length() > 0.05:
                  f = f.normalized()
                  avatar_yaw = lerp_angle(avatar_yaw, atan2(f.x, f.z), 0.25)
              avatar_local.rotation.y = avatar_yaw
              var fwd := Vector3(sin(avatar_yaw), 0.0, cos(avatar_yaw))
              avatar_local.global_position = Vector3(head.x, head.y - 0.93, head.z) - fwd * 0.1
              for side in 2:
                  var tgt := player.left_follower.global_position if side == 0 else player.right_follower.global_position
                  var sh := avatar_local.shoulder_world(side)
                  var out := sh - avatar_local.global_position
                  out.y = 0.0
                  if out.length() < 0.001:
                      out = Vector3.RIGHT
                  out = out.normalized()
                  avatar_local.aim_arm(side, tgt, out * 0.6 + Vector3.DOWN * 0.6 - fwd * 0.2)


          func _animate_items(delta: float) -> void:
              for i in items.size():
                  var it: Dictionary = items[i]
                  if it["taken"]:
                      continue
                  var nd: Node3D = it["node"]
                  var home: Vector3 = it["home"]
                  nd.rotation.y += delta * 1.4
                  nd.position.y = home.y + sin(t_now * 2.0 + float(i)) * 0.03
              for s in spinners:
                  var sn: Node3D = s["node"]
                  sn.rotation.y += delta * float(s["speed"])


          func _flat(a: Vector3, b: Vector3) -> float:
              return Vector2(a.x - b.x, a.z - b.z).length()


          func _update_hud() -> void:
              var t := ""
              if msg_t > 0.0:
                  t = msg_text
              elif mode == "lobby":
                  t = "GILLA   LVL %d   $%d" % [Game.level(), Game.money]
              elif mode == "base":
                  t = "TEAM %d/%d   YOU %d" % [team_value, quota, my_value]
                  if carried.size() > 0:
                      t += "   CARRY %d" % carried.size()
                  if has_key:
                      t += "   KEYCARD"
                  t += "\n" + _clock(round_t)
                  if talking:
                      t += "   VOICE!"
              elif mode == "monster":
                  t = "CAUGHT %d/%d   APES %d/%d" % [caught_bots, bots.size(), team_value, quota]
                  t += "\n" + _clock(round_t)
              elif mode == "splash":
                  t = "SPLASHES %d" % splashes
              if hud.text != t:
                  hud.text = t


          func _clock(t: float) -> String:
              var s := int(maxf(t, 0.0))
              return "%d:%02d" % [s / 60, s % 60]


          # ---------------------------------------------------------------------------
          # Hand-touch buttons
          # ---------------------------------------------------------------------------
          func _update_interacts(delta: float) -> void:
              interact_cd = maxf(interact_cd - delta, 0.0)
              var hands: Array[Vector3] = [player.left_follower.global_position, player.right_follower.global_position]
              for it in interacts:
                  var near := false
                  for h in hands:
                      if h.distance_to(it["pos"]) < it["radius"]:
                          near = true
                  if near and interact_cd <= 0.0:
                      it["t"] += delta
                      if it["t"] >= 0.5:
                          it["t"] = 0.0
                          interact_cd = 1.0
                          _activate(it["action"], it["arg"])
                          return
                  else:
                      it["t"] = maxf(it["t"] - delta * 2.0, 0.0)


          func _activate(action: String, arg: int) -> void:
              if action == "base":
                  _start_base(false)
              elif action == "monster":
                  _start_base(true)
              elif action == "splash":
                  _start_splash()
              elif action == "lobby":
                  _enter_lobby()
              elif action == "fur":
                  _shop_fur(arg)


          func _add_interact(pos: Vector3, radius: float, action: String, arg: int) -> void:
              interacts.append({"pos": pos, "radius": radius, "action": action, "arg": arg, "t": 0.0})


          # ---------------------------------------------------------------------------
          # World helpers
          # ---------------------------------------------------------------------------
          func _clear_world() -> void:
              if world != null:
                  world.queue_free()
              world = Node3D.new()
              world.name = "World"
              add_child(world)
              interacts.clear()
              items.clear()
              doors.clear()
              bots.clear()
              carried.clear()
              shop_labels.clear()
              platforms.clear()
              spinners.clear()
              monster = null
              monster_av = null
              key_node = null
              board_label = null
              flicker_mat = null
              key_bot = -1
              has_key = false
              round_over = false


          func _set_env(bg: Color, amb: Color, amb_e: float, fog_d: float, fog_col: Color = Color(0.0, 0.0, 0.0)) -> void:
              env.background_mode = Environment.BG_COLOR
              env.background_color = bg
              env.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              env.ambient_light_color = amb
              env.ambient_light_energy = amb_e
              env.fog_enabled = fog_d > 0.0
              env.fog_light_color = fog_col
              env.fog_density = fog_d
              env.tonemap_mode = Environment.TONE_MAPPER_FILMIC
              env.tonemap_exposure = 1.05
              env.adjustment_enabled = true
              env.adjustment_contrast = 1.08
              env.adjustment_saturation = 1.12


          func _set_sky() -> void:
              var sky := Sky.new()
              var sm := ProceduralSkyMaterial.new()
              sm.sky_top_color = Color(0.18, 0.42, 0.85)
              sm.sky_horizon_color = Color(0.72, 0.87, 1.0)
              sm.ground_horizon_color = Color(0.72, 0.87, 1.0)
              sm.ground_bottom_color = Color(0.25, 0.45, 0.65)
              sky.sky_material = sm
              env.sky = sky
              env.background_mode = Environment.BG_SKY


          func _build_environment() -> void:
              var we := WorldEnvironment.new()
              env = Environment.new()
              env.background_mode = Environment.BG_COLOR
              env.background_color = Color(0.0, 0.0, 0.0)
              env.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              env.ambient_light_color = Color(0.3, 0.35, 0.4)
              env.ambient_light_energy = 0.3
              env.fog_enabled = true
              env.fog_light_color = Color(0.0, 0.0, 0.0)
              env.fog_density = 0.08
              we.environment = env
              add_child(we)


          func _glow_mat(col: Color, energy: float) -> StandardMaterial3D:
              return mats.glow(col, energy)


          func _add_box(parent: Node, center: Vector3, size: Vector3, tint: Color, mat: Material = null, kind: String = "wall") -> StaticBody3D:
              var body := StaticBody3D.new()
              body.collision_layer = 1
              body.position = center
              var mesh := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = size
              mesh.mesh = bm
              if mat != null:
                  mesh.material_override = mat
              else:
                  mesh.material_override = mats.surface(kind, tint, 0.4)
              body.add_child(mesh)
              var shape := CollisionShape3D.new()
              var bs := BoxShape3D.new()
              bs.size = size
              shape.shape = bs
              body.add_child(shape)
              parent.add_child(body)
              return body


          func _add_mesh_box(pos: Vector3, size: Vector3, mat: Material) -> MeshInstance3D:
              var mi := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = size
              mi.mesh = bm
              mi.material_override = mat
              mi.position = pos
              world.add_child(mi)
              return mi


          func _label(text: String, pos: Vector3, px: float, size: int, col: Color) -> Label3D:
              var l := Label3D.new()
              l.text = text
              l.pixel_size = px
              l.font_size = size
              l.modulate = col
              l.outline_size = 8
              l.billboard = BaseMaterial3D.BILLBOARD_ENABLED
              l.position = pos
              world.add_child(l)
              return l


          func _make_exit(pos: Vector3) -> void:
              _add_box(world, pos + Vector3(0.0, 0.25, 0.0), Vector3(0.7, 0.5, 0.7), Color.WHITE, mats.surface("hazard", Color.WHITE, 1.2))
              _add_mesh_box(pos + Vector3(0.0, 0.52, 0.0), Vector3(0.5, 0.04, 0.5), mats.glow(Color(1.0, 0.2, 0.2), 2.0))
              _label("EXIT", pos + Vector3(0.0, 1.1, 0.0), 0.004, 40, Color(1.0, 0.4, 0.4))
              _add_interact(pos + Vector3(0.0, 0.55, 0.0), 0.4, "lobby", 0)


          # ---------------------------------------------------------------------------
          # LOBBY (play buttons, daily quests, level, fur shop)
