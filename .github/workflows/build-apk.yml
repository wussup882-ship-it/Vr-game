          func _make_pad(pos: Vector3, title: String, sub: String, col: Color, action: String) -> void:
              _add_box(world, pos + Vector3(0.0, 0.35, 0.0), Vector3(1.1, 0.7, 1.1), col.darkened(0.55), null, "metal")
              _add_mesh_box(pos + Vector3(0.0, 0.72, 0.0), Vector3(0.9, 0.04, 0.9), mats.glow(col, 2.0))
              var icon := MeshInstance3D.new()
              if action == "base":
                  var bm := BoxMesh.new()
                  bm.size = Vector3(0.5, 0.15, 0.28)
                  icon.mesh = bm
                  icon.material_override = mats.gold()
              elif action == "monster":
                  icon.mesh = mats.diamond_mesh(0.2)
                  icon.material_override = mats.glow(Color(1.0, 0.1, 0.1), 2.0)
              else:
                  var sm := SphereMesh.new()
                  sm.radius = 0.22
                  sm.height = 0.44
                  icon.mesh = sm
                  icon.material_override = mats.glow(Color(0.2, 0.6, 1.0), 1.6)
              icon.position = pos + Vector3(0.0, 1.35, 0.0)
              world.add_child(icon)
              spinners.append({"node": icon, "speed": 1.5})
              _label(title + "\n" + sub, pos + Vector3(0.0, 2.35, 0.0), 0.005, 48, col)
              _add_interact(pos + Vector3(0.0, 0.78, 0.0), 0.55, action, 0)


          func _refresh_lobby_text() -> void:
              if board_label != null:
                  var t := "LEVEL %d     $%d\nXP %d / %d\n\nDAILY QUESTS\n" % [Game.level(), Game.money, Game.xp, Game.xp_next()]
                  for q in Game.quests:
                      var mark := "[x] " if q["done"] else "[ ] "
                      t += "%s%s  %d/%d  ($%d)\n" % [mark, q["text"], q["progress"], q["goal"], q["reward"]]
                  board_label.text = t
              for i in shop_labels.size():
                  var f: Dictionary = Game.FUR[i]
                  var lab: Label3D = shop_labels[i]
                  var status := "$%d" % int(f["cost"])
                  if Game.equipped == i:
                      status = "EQUIPPED"
                  elif Game.owned.has(i):
                      status = "OWNED"
                  lab.text = "%s\n%s" % [f["name"], status]


          func _shop_fur(i: int) -> void:
              var f: Dictionary = Game.FUR[i]
              if Game.owned.has(i):
                  Game.equipped = i
                  Game.save_game()
                  _apply_fur(Game.fur_color(), Game.fur_amount())
                  _say("EQUIPPED " + str(f["name"]).to_upper(), 2.0)
              elif Game.money >= int(f["cost"]):
                  Game.money -= int(f["cost"])
                  Game.owned.append(i)
                  Game.equipped = i
                  Game.save_game()
                  _apply_fur(Game.fur_color(), Game.fur_amount())
                  _say("BOUGHT " + str(f["name"]).to_upper(), 2.0)
              else:
                  _say("NOT ENOUGH MONEY", 2.0)
              _refresh_lobby_text()


          # ---------------------------------------------------------------------------
          # THE BASE / BE THE MONSTER : maze helpers
          # ---------------------------------------------------------------------------
          func _cell_center(c: Vector3i) -> Vector3:
              var fy := 0.0 if c.z == 0 else BASE_Y
              return Vector3((float(c.x) - GW / 2.0 + 0.5) * CELL, fy, (float(c.y) - GH / 2.0 + 0.5) * CELL)


          func _pos_to_cell(p: Vector3) -> Vector3i:
              var cx := clampi(int(floorf(p.x / CELL + GW / 2.0)), 0, GW - 1)
              var cy := clampi(int(floorf(p.z / CELL + GH / 2.0)), 0, GH - 1)
              var cz := 1 if p.y < -2.0 else 0
              return Vector3i(cx, cy, cz)


          func _passable(c: Vector3i) -> bool:
              if c.x < 0 or c.y < 0 or c.x >= GW or c.y >= GH:
                  return false
              var ch: String = lv[c.z][c.y][c.x]
              return ch != "#" and ch != "W" and ch != "L"


          func _is_open_ch(l: int, x: int, y: int) -> bool:
              var ch: String = lv[l][y][x]
              return ch != "#" and ch != "W" and ch != "L"


          func _neighbors(c: Vector3i) -> Array[Vector3i]:
              var res: Array[Vector3i] = []
              for d in DIRS:
                  var n := Vector3i(c.x + d.x, c.y + d.y, c.z)
                  if _passable(n):
                      res.append(n)
              if c == stair_top:
                  res.append(stair_bottom)
              elif c == stair_bottom:
                  res.append(stair_top)
              return res


          func _bfs_dist(from_c: Vector3i) -> Dictionary:
              var dist := {}
              dist[from_c] = 0
              var queue: Array = [from_c]
              var qi := 0
              while qi < queue.size():
                  var c: Vector3i = queue[qi]
                  qi += 1
                  for n in _neighbors(c):
                      if not dist.has(n):
                          dist[n] = int(dist[c]) + 1
                          queue.append(n)
              return dist


          # Cell centres to walk through (not including the start cell). Stairs get waypoints.
          func _find_path(from_c: Vector3i, to_c: Vector3i, avoid_c: Vector3i = Vector3i(-99, -99, 0), avoid_r: int = 0) -> Array:
              var result: Array = []
              if from_c == to_c:
                  return result
              var prev := {}
              prev[from_c] = from_c
              var queue: Array = [from_c]
              var qi := 0
              var found := false
              while qi < queue.size():
                  var c: Vector3i = queue[qi]
                  qi += 1
                  if c == to_c:
                      found = true
                      break
                  for n in _neighbors(c):
                      if prev.has(n):
                          continue
                      if avoid_r > 0 and n != to_c and n.z == avoid_c.z and absi(n.x - avoid_c.x) + absi(n.y - avoid_c.y) <= avoid_r:
                          continue
                      prev[n] = c
                      queue.append(n)
              if not found:
                  return result
              var rev: Array = []
              var cur: Vector3i = to_c
              while cur != from_c:
                  rev.append(cur)
                  cur = prev[cur]
              rev.reverse()
              var sc := _cell_center(Vector3i(stair_cell.x, stair_cell.y, 0))
              var last := from_c
              for c2 in rev:
                  var cc: Vector3i = c2
                  if cc.z != last.z:
                      var steps: Array = []
                      for i in 5:
                          steps.append(Vector3(sc.x - 1.5 + 0.6 * float(i) + 0.3, BASE_Y + 0.8 * float(i + 1), sc.z))
                      if cc.z == 1:
                          steps.reverse()
                      for s in steps:
                          result.append(s)
                  result.append(_cell_center(cc))
                  last = cc
              return result


          func _open_count(c: Vector3i) -> int:
              var n := 0
              for d in DIRS:
                  if _passable(Vector3i(c.x + d.x, c.y + d.y, c.z)):
                      n += 1
              return n


          func _vault_locked() -> bool:
              for d in doors:
                  if d["kind"] == "L" and not d["open"]:
                      return true
              return false


          func _locked_door() -> Dictionary:
              for d in doors:
                  if d["kind"] == "L" and not d["open"]:
                      return d
              return {}


          func _random_cell() -> Vector3i:
              return all_cells[rng.randi() % all_cells.size()]


          func _gen_maze() -> Array:
              var rows: Array = []
              for y in GH:
                  var r: Array = []
                  for x in GW:
                      r.append("#")
                  rows.append(r)
              var visited := {}
              var stack: Array = []
              var start := Vector2i(1, 1)
              visited[start] = true
              rows[1][1] = "."
              stack.append(start)
              while not stack.is_empty():
                  var c: Vector2i = stack[stack.size() - 1]
                  var opts: Array = []
                  for d in DIRS:
                      var n := c + d * 2
                      if n.x > 0 and n.y > 0 and n.x < GW - 1 and n.y < GH - 1 and not visited.has(n):
                          opts.append(d)
                  if opts.is_empty():
                      stack.pop_back()
                  else:
                      var dd: Vector2i = opts[rng.randi() % opts.size()]
                      var n2 := c + dd * 2
                      visited[n2] = true
                      rows[n2.y][n2.x] = "."
                      rows[c.y + dd.y][c.x + dd.x] = "."
                      stack.append(n2)
              # extra loops so nothing is a single long dead-end tree
              for k in 18:
                  var lx := rng.randi_range(1, GW - 2)
                  var ly := rng.randi_range(1, GH - 2)
                  if (lx % 2) != (ly % 2) and rows[ly][lx] == "#":
                      rows[ly][lx] = "."
              # a few open rooms
              for k in 3:
                  var cx := 3 + 2 * rng.randi_range(0, 5)
                  var cy := 3 + 2 * rng.randi_range(0, 4)
                  for yy in range(cy - 1, cy + 2):
                      for xx in range(cx - 1, cx + 2):
                          rows[yy][xx] = "."
              return rows


          # Wall slots between two open cells that can hold a door/window pane.
          func _slot_candidates(l: int, want: String, avoid: Vector2i) -> Array:
              var res: Array = []
              for y in range(1, GH - 1):
                  for x in range(1, GW - 1):
                      if (x % 2) == (y % 2):
                          continue
                      var ch: String = lv[l][y][x]
                      if ch != want:
                          continue
                      if avoid.x >= 0 and absi(avoid.x - x) + absi(avoid.y - y) == 1:
                          continue
                      if l == 0 and x == stair_cell.x + 1 and y == stair_cell.y:
                          continue
                      if l == 1 and x == stair_cell.x - 1 and y == stair_cell.y:
                          continue
                      var ok := false
                      if x % 2 == 0:
                          ok = _is_open_ch(l, x - 1, y) and _is_open_ch(l, x + 1, y) and lv[l][y - 1][x] == "#" and lv[l][y + 1][x] == "#"
                      else:
                          ok = _is_open_ch(l, x, y - 1) and _is_open_ch(l, x, y + 1) and lv[l][y][x - 1] == "#" and lv[l][y][x + 1] == "#"
                      if ok:
                          res.append(Vector2i(x, y))
              res.shuffle()
              return res


          func _generate_base() -> void:
              lv = [_gen_maze(), _gen_maze()]
              all_cells.clear()
              for l in 2:
                  for y in range(1, GH, 2):
                      for x in range(1, GW, 2):
                          all_cells.append(Vector3i(x, y, l))

              spawn_cell = Vector3i(1, 1, 0)
              recycler_pos = _cell_center(Vector3i(1, 3, 0))

              # stairs: basement cell (sx-2) -> up through the shaft -> ground cell (sx+2)
              var sx := 3 + 2 * rng.randi_range(0, 5)
              var sy := 1 + 2 * rng.randi_range(0, 6)
              stair_cell = Vector2i(sx, sy)
              lv[0][sy][sx] = "P"
              lv[0][sy][sx + 1] = "."
              lv[1][sy][sx - 1] = "."
              stair_top = Vector3i(sx + 2, sy, 0)
              stair_bottom = Vector3i(sx - 2, sy, 1)

              var dist := _bfs_dist(spawn_cell)
              var far := spawn_cell
              var fd := -1
              for k in dist.keys():
                  var kc: Vector3i = k
                  if kc.z == 0 and int(dist[k]) > fd:
                      fd = int(dist[k])
                      far = kc
              monster_cell = far

              # vault = farthest dead end, its only entrance becomes a locked door
              var vault := Vector2i(-1, -1)
              var vslot := Vector2i(-1, -1)
              var best := -1
              for y in range(1, GH, 2):
                  for x in range(1, GW, 2):
                      var c := Vector2i(x, y)
                      if c == Vector2i(1, 1) or c == Vector2i(1, 3) or c == stair_cell or Vector3i(x, y, 0) == far:
                          continue
                      var opens: Array = []
                      for d in DIRS:
                          var s: Vector2i = c + d
                          if lv[0][s.y][s.x] != "#":
                              opens.append(s)
                      if opens.size() == 1:
                          var dd := int(dist.get(Vector3i(x, y, 0), 0))
                          if dd > best:
                              best = dd
                              vault = c
                              vslot = opens[0]
              if vault.x >= 0 and best >= 5 and not (vslot.x == stair_cell.x + 1 and vslot.y == stair_cell.y):
                  lv[0][vslot.y][vslot.x] = "L"
                  lv[0][vault.y][vault.x] = "V"
              else:
                  vault = Vector2i(-1, -1)

              # windows and hazard doors
              var w0 := _slot_candidates(0, "#", vault)
              for i in mini(4, w0.size()):
                  var s: Vector2i = w0[i]
                  lv[0][s.y][s.x] = "W"
              var w1 := _slot_candidates(1, "#", Vector2i(-1, -1))
              for i in mini(3, w1.size()):
                  var s: Vector2i = w1[i]
                  lv[1][s.y][s.x] = "W"
              var h0 := _slot_candidates(0, ".", vault)
              for i in mini(3, h0.size()):
                  var s: Vector2i = h0[i]
                  lv[0][s.y][s.x] = "H"
              var h1 := _slot_candidates(1, ".", Vector2i(-1, -1))
              for i in mini(3, h1.size()):
                  var s: Vector2i = h1[i]
                  lv[1][s.y][s.x] = "H"

              # loot placement
              var pool0: Array = []
              var pool1: Array = []
              for y in range(1, GH, 2):
                  for x in range(1, GW, 2):
                      var cv := Vector2i(x, y)
                      if cv == stair_cell:
                          continue
                      pool1.append(cv)
                      if cv == Vector2i(1, 1) or cv == Vector2i(1, 3) or cv == vault or Vector3i(x, y, 0) == far:
                          continue
                      if int(dist.get(Vector3i(x, y, 0), 0)) < 4:
                          continue
                      pool0.append(cv)
              pool0.shuffle()
              pool1.shuffle()
              if not pool0.is_empty():
                  var kc2: Vector2i = pool0.pop_back()
                  _add_key(_cell_center(Vector3i(kc2.x, kc2.y, 0)))
              for i in 10:
                  if pool0.is_empty():
                      break
                  _place_item("gold", 0, pool0.pop_back())
              for i in 3:
                  if pool0.is_empty():
                      break
                  _place_item("diamond", 0, pool0.pop_back())
              for i in 8:
                  if pool1.is_empty():
                      break
                  _place_item("gold", 1, pool1.pop_back())
              for i in 4:
                  if pool1.is_empty():
                      break
                  _place_item("diamond", 1, pool1.pop_back())
              if vault.x >= 0:
                  var vc := _cell_center(Vector3i(vault.x, vault.y, 0))
                  _add_item("diamond", vc + Vector3(-0.7, 0.0, 0.0), true)
                  _add_item("diamond", vc + Vector3(0.7, 0.0, 0.0), true)
                  _add_item("diamond", vc + Vector3(0.0, 0.0, 0.7), true)
                  _add_item("gold", vc + Vector3(0.0, 0.0, -0.7), true)


          func _place_item(kind: String, l: int, c: Vector2i) -> void:
              var p := _cell_center(Vector3i(c.x, c.y, l))
              p += Vector3(rng.randf_range(-0.7, 0.7), 0.0, rng.randf_range(-0.7, 0.7))
              _add_item(kind, p, false)


          func _add_item(kind: String, pos: Vector3, in_vault: bool) -> void:
              var n := MeshInstance3D.new()
              var value := 10
              if kind == "gold":
                  var bm := BoxMesh.new()
                  bm.size = Vector3(0.3, 0.09, 0.16)
                  n.mesh = bm
                  n.material_override = mats.gold()
              else:
                  value = 50
                  n.mesh = mats.diamond_mesh(0.1)
                  n.material_override = mats.diamond()
              n.position = pos + Vector3(0.0, 0.2, 0.0)
              world.add_child(n)
              items.append({"node": n, "kind": kind, "value": value, "home": n.position, "taken": false, "vault": in_vault, "claimed": -1})


          func _add_key(pos: Vector3) -> void:
              _add_box(world, pos + Vector3(0.0, 0.3, 0.0), Vector3(0.9, 0.6, 0.5), Color(0.9, 0.85, 0.8), null, "wood")
              key_node = MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = Vector3(0.2, 0.03, 0.3)
              key_node.mesh = bm
              key_node.material_override = mats.glow(Color(0.2, 0.5, 1.0), 2.2)
              key_node.position = pos + Vector3(0.0, 0.66, 0.0)
              world.add_child(key_node)
              var kl := OmniLight3D.new()
              kl.light_color = Color(0.3, 0.55, 1.0)
              kl.omni_range = 3.5
              kl.light_energy = 1.2
              kl.position = pos + Vector3(0.0, 1.0, 0.0)
              world.add_child(kl)


          func _build_base() -> void:
              flicker_mat = mats.glow(Color(1.0, 0.92, 0.7), 1.6)
              _build_level(0)
              _build_level(1)
              _build_stairs()
              _add_recycler(recycler_pos)
              _add_box(world, Vector3(0.0, WALL_H + 0.2, 0.0), Vector3(GW * CELL, 0.4, GH * CELL), Color(0.3, 0.32, 0.32))
              var sp := _cell_center(spawn_cell)
              _make_exit(sp + Vector3(-1.0, 0.0, -0.9))


          func _build_level(l: int) -> void:
              var fy := 0.0 if l == 0 else BASE_Y
              var wall_t := Color(0.92, 0.97, 0.92) if l == 0 else Color(0.62, 0.68, 0.8)
              var floor_t := Color(0.85, 0.9, 0.85) if l == 0 else Color(0.55, 0.6, 0.68)
              if l == 1:
                  _add_box(world, Vector3(0.0, fy - 0.4, 0.0), Vector3(GW * CELL, 0.8, GH * CELL), floor_t, null, "floor")
              for y in GH:
                  var row: Array = lv[l][y]
                  var cz := (float(y) - GH / 2.0 + 0.5) * CELL
                  if l == 0:
                      var fx := 0
                      while fx < GW:
                          if row[fx] == "P":
                              fx += 1
                              continue
                          var fstart := fx
                          while fx < GW and row[fx] != "P":
                              fx += 1
                          var frun := fx - fstart
                          var fcx := (float(fstart) + frun / 2.0 - GW / 2.0) * CELL
                          _add_box(world, Vector3(fcx, -0.4, cz), Vector3(frun * CELL, 0.8, CELL), floor_t, null, "floor")
                  var x := 0
                  while x < GW:
                      var ch: String = row[x]
                      if ch == "#":
                          var start := x
                          while x < GW and row[x] == "#":
                              x += 1
                          var run := x - start
                          var cx := (float(start) + run / 2.0 - GW / 2.0) * CELL
                          _add_box(world, Vector3(cx, fy + WALL_H / 2.0, cz), Vector3(run * CELL, WALL_H, CELL), wall_t)
                      else:
                          if ch == "W" or ch == "L" or ch == "H":
                              _make_door(ch, Vector3i(x, y, l))
                          elif ch == "V":
                              var vl := OmniLight3D.new()
                              vl.light_color = Color(0.3, 0.9, 1.0)
                              vl.omni_range = 5.0
                              vl.light_energy = 1.5
                              vl.position = _cell_center(Vector3i(x, y, l)) + Vector3(0.0, 1.6, 0.0)
                              world.add_child(vl)
                          x += 1
              _decorate_level(l)


          func _decorate_level(l: int) -> void:
              var fy := 0.0 if l == 0 else BASE_Y
              var lamp_mat: StandardMaterial3D = flicker_mat if l == 0 else mats.glow(Color(0.5, 0.85, 1.0), 1.4)
              var static_lamp: StandardMaterial3D = mats.glow(Color(1.0, 0.95, 0.8), 1.5) if l == 0 else lamp_mat
              for y in range(1, GH, 2):
                  for x in range(1, GW, 2):
                      var cv := Vector2i(x, y)
                      if cv == stair_cell:
                          continue
                      var c := _cell_center(Vector3i(x, y, l))
                      if rng.randf() < 0.5:
                          var lm: StandardMaterial3D = lamp_mat if rng.randf() < 0.3 else static_lamp
                          _add_mesh_box(Vector3(c.x, fy + WALL_H - 0.05, c.z), Vector3(1.1, 0.06, 0.35), lm)
                      if l == 0 and (cv == Vector2i(1, 1) or cv == Vector2i(1, 3)):
                          continue
                      if Vector3i(x, y, l) == monster_cell:
                          continue
                      var ch: String = lv[l][y][x]
                      if ch == "V":
                          continue
                      if rng.randf() < 0.2:
                          var sx := 1.0 if rng.randf() < 0.5 else -1.0
                          var sz := 1.0 if rng.randf() < 0.5 else -1.0
                          var cs := rng.randf_range(0.5, 0.85)
                          var crate := _add_box(world, Vector3(c.x + sx * 0.95, fy + cs / 2.0, c.z + sz * 0.95), Vector3(cs, cs, cs), Color(0.9, 0.85, 0.8), null, "wood")
                          crate.rotation.y = rng.randf_range(0.0, 1.5)


          func _build_stairs() -> void:
              var sc := _cell_center(Vector3i(stair_cell.x, stair_cell.y, 0))
              for i in 5:
                  var h := 0.8 * float(i + 1)
                  var px := sc.x - 1.5 + 0.6 * float(i) + 0.3
                  _add_box(world, Vector3(px, BASE_Y + h / 2.0, sc.z), Vector3(0.6, h, CELL), Color(0.9, 0.8, 0.7), null, "metal")
              _add_mesh_box(Vector3(sc.x, 0.02, sc.z - 1.5), Vector3(3.0, 0.04, 0.08), mats.glow(Color(1.0, 0.6, 0.1), 2.0))
              _add_mesh_box(Vector3(sc.x, 0.02, sc.z + 1.5), Vector3(3.0, 0.04, 0.08), mats.glow(Color(1.0, 0.6, 0.1), 2.0))
              var sl := OmniLight3D.new()
              sl.light_color = Color(1.0, 0.6, 0.2)
              sl.omni_range = 6.0
              sl.light_energy = 1.2
              sl.position = Vector3(sc.x, BASE_Y + 2.5, sc.z)
              world.add_child(sl)


          func _make_door(kind: String, c: Vector3i) -> void:
              var p := _cell_center(c)
              var along_x := (c.x % 2) == 1
              var size := Vector3(CELL, WALL_H, 0.3) if along_x else Vector3(0.3, WALL_H, CELL)
              var mat: Material
              if kind == "W":
                  mat = mats.glass()
              elif kind == "L":
                  mat = mats.surface("metal", Color(1.0, 0.35, 0.3), 0.6)
              else:
                  mat = mats.surface("hazard", Color.WHITE, 0.7)
              var body := _add_box(world, Vector3(p.x, p.y + WALL_H / 2.0, p.z), size, Color.WHITE, mat)
              if kind == "L":
                  _label("VAULT", Vector3(p.x, p.y + 2.4, p.z), 0.005, 48, Color(1.0, 0.3, 0.3))
              doors.append({"node": body, "pos": body.position, "along_x": along_x, "kind": kind, "open": false, "cell": c})


          func _add_recycler(pos: Vector3) -> void:
              _add_box(world, pos + Vector3(0.0, 0.5, 0.0), Vector3(1.2, 1.0, 1.2), Color(0.8, 0.85, 0.9), null, "metal")
              _add_box(world, pos + Vector3(0.0, 1.25, 0.0), Vector3(0.9, 0.5, 0.9), Color(0.6, 0.65, 0.7), null, "metal")
              _add_mesh_box(pos + Vector3(0.0, 1.52, 0.0), Vector3(0.7, 0.05, 0.7), mats.glow(Color(0.1, 1.0, 0.3), 2.2))
              for sx in [-0.5, 0.5]:
                  var pipe := MeshInstance3D.new()
                  var cm := CylinderMesh.new()
                  cm.top_radius = 0.07
                  cm.bottom_radius = 0.07
                  cm.height = WALL_H
                  pipe.mesh = cm
                  pipe.material_override = mats.surface("metal", Color(0.9, 0.6, 0.3), 0.5)
                  pipe.position = pos + Vector3(sx, WALL_H / 2.0, 0.55)
                  world.add_child(pipe)
              var steam := CPUParticles3D.new()
              steam.amount = 14
              steam.lifetime = 1.6
              steam.direction = Vector3.UP
              steam.spread = 20.0
              steam.initial_velocity_min = 0.5
              steam.initial_velocity_max = 1.0
              steam.gravity = Vector3(0.0, 0.2, 0.0)
              var sm := SphereMesh.new()
              sm.radius = 0.08
              sm.height = 0.16
              var smat := StandardMaterial3D.new()
              smat.albedo_color = Color(0.9, 1.0, 0.9, 0.35)
              smat.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              sm.material = smat
              steam.mesh = sm
              steam.position = pos + Vector3(0.0, 1.6, 0.0)
              world.add_child(steam)
              steam.emitting = true
              var rl := OmniLight3D.new()
              rl.light_color = Color(0.3, 1.0, 0.4)
              rl.omni_range = 5.0
              rl.light_energy = 1.0
              rl.position = pos + Vector3(0.0, 1.9, 0.0)
              world.add_child(rl)
              _label("RECYCLER", pos + Vector3(0.0, 2.3, 0.0), 0.004, 40, Color(0.3, 1.0, 0.4))


          func _start_base(as_monster: bool) -> void:
              mode = "monster" if as_monster else "base"
              _clear_world()
              _set_env(Color(0.0, 0.0, 0.0), Color(0.45, 0.25, 0.25) if as_monster else Color(0.3, 0.35, 0.4), 0.3, 0.08)
              lamp.light_energy = 2.0
              flash.light_energy = 0.0
              team_value = 0
              my_value = 0
              caught_bots = 0
              mstate = "patrol"
              path = []
              lost_t = 0.0
              noise_t = 0.0
              if as_monster:
                  player.jump_multiplier = 1.25
                  player.max_jump_speed = 8.0
                  _apply_fur(Color(0.07, 0.02, 0.02), 1.0)
              else:
                  player.jump_multiplier = 1.1
                  player.max_jump_speed = 6.5
                  _apply_fur(Game.fur_color(), Game.fur_amount())

              _generate_base()
              _build_base()

              var sum := 0
              for it in items:
                  if not it["vault"]:
                      sum += int(it["value"])
              quota = int(float(sum) * (0.4 if as_monster else 0.6))
              round_t = 240.0 if as_monster else 420.0

              var nbots := 4 if as_monster else 3
              for i in nbots:
                  bots.append(_make_bot(i))
              if not as_monster:
                  _make_monster()

              var sp := _cell_center(monster_cell if as_monster else spawn_cell)
              player.spawn_point = Vector3(sp.x + 0.5, 2.0, sp.z + 0.5)
              player.respawn()
              if as_monster:
                  _say("YOU ARE THE MONSTER.  CATCH THEM ALL.", 6.0)
              else:
                  _say("FIND THE GOLD.  KEEP QUIET.", 6.0)


          func _make_bot(i: int) -> Dictionary:
              var n := Node3D.new()
              var f: Dictionary = Game.FUR[(i + 1) % Game.FUR.size()]
              var col: Color = f["color"]
              var av = null
              if use_model:
                  var a := Avatar.new()
                  n.add_child(a)
                  if a.build(col, float(f["amt"]), false):
                      a.position = Vector3(0.0, 0.25, 0.0)
                      a.rotation.y = PI
                      av = a
                  else:
                      a.queue_free()
              if av == null:
                  var fur := _glow_mat(col, 0.35)
                  var body := MeshInstance3D.new()
                  var cm := CapsuleMesh.new()
                  cm.radius = 0.25
                  cm.height = 1.1
                  body.mesh = cm
                  body.material_override = fur
                  body.position = Vector3(0.0, 0.55, 0.0)
                  n.add_child(body)
                  var head := MeshInstance3D.new()
                  var sm := SphereMesh.new()
                  sm.radius = 0.18
                  sm.height = 0.36
                  head.mesh = sm
                  head.material_override = fur
                  head.position = Vector3(0.0, 1.2, -0.05)
                  n.add_child(head)
              var lab := Label3D.new()
              lab.text = BOT_NAMES[i % BOT_NAMES.size()]
              lab.pixel_size = 0.004
              lab.font_size = 36
              lab.billboard = BaseMaterial3D.BILLBOARD_ENABLED
              lab.position = Vector3(0.0, 1.55, 0.0)
              n.add_child(lab)
              var sp := _cell_center(spawn_cell)
              n.position = sp + Vector3(0.3 * float(i), 0.0, 0.4)
              world.add_child(n)
              return {"node": n, "av": av, "path": [], "state": "seek", "carry": [], "target": -1, "repath": 0.0, "dead_t": 0.0, "hide_t": 0.0, "has_key": false, "speed": 2.8}


          # ---------------------------------------------------------------------------
          # Round logic
          # ---------------------------------------------------------------------------
          func _update_base(delta: float) -> void:
              if round_over:
                  over_t -= delta
                  if over_t <= 0.0:
                      _enter_lobby()
                  return
              round_t -= delta
              if player._running:
                  if mode == "base":
                      _update_pickups()
                  _update_door_touch()
              _update_bots(delta)
              if mode == "base":
                  _update_monster(delta)
                  if team_value >= quota:
                      _end_round(true)
                  elif round_t <= 0.0:
                      _end_round(false)
              else:
                  _update_player_monster()
                  if caught_bots >= bots.size():
                      _end_round(true)
                  elif team_value >= quota:
                      _end_round(false)
                  elif round_t <= 0.0:
                      _end_round(true)


          func _end_round(win: bool) -> void:
              round_over = true
              over_t = 6.0
              var m := 0
              var x := 0
              if mode == "base":
                  m = my_value + (40 if win else 0)
                  x = 20 + my_value / 5 + (30 if win else 0)
                  if win:
                      var r := Game.progress("escape", 1)
                      if r > 0:
                          m += r
                  _say(("YOU ESCAPED!" if win else "TIME UP") + "   +$%d  +%d XP" % [m, x], 6.0)
              else:
                  m = 30 * caught_bots + (50 if win else 0)
                  x = 15 + 10 * caught_bots + (25 if win else 0)
                  _say(("MONSTER WINS" if win else "THE APES ESCAPED") + "   +$%d  +%d XP" % [m, x], 6.0)
              Game.add_money(m)
              Game.add_xp(x)
              flash.light_energy = 0.0


          func _update_pickups() -> void:
              var hands: Array[Vector3] = [player.left_follower.global_position, player.right_follower.global_position]
              if key_node != null and key_node.visible and not has_key:
                  for h in hands:
                      if h.distance_to(key_node.position) < 0.5:
                          has_key = true
                          key_node.visible = false
                          _say("KEYCARD", 2.0)
                          break
              for i in items.size():
                  var it: Dictionary = items[i]
                  if it["taken"]:
                      continue
                  var nd: MeshInstance3D = it["node"]
                  for h in hands:
                      if h.distance_to(nd.position) < 0.4:
                          it["taken"] = true
                          nd.visible = false
                          carried.append(i)
                          _say("PICKED UP " + str(it["kind"]).to_upper(), 1.2)
                          break
              if carried.size() > 0:
                  for h in hands:
                      if h.distance_to(recycler_pos + Vector3(0.0, 0.5, 0.0)) < 1.3:
                          var total := 0
                          for idx in carried:
                              var it2: Dictionary = items[idx]
                              total += int(it2["value"])
                              var q := Game.progress(str(it2["kind"]), 1)
                              if q > 0:
                                  _say("QUEST COMPLETE  +$%d" % q, 3.0)
                          my_value += total
                          team_value += total
                          carried.clear()
                          _say("RECYCLED  +%d" % total, 2.0)
                          break


          func _hand_near_door(d: Dictionary, p: Vector3) -> bool:
              var c: Vector3 = d["pos"]
              var ax: bool = d["along_x"]
              var perp := absf(p.z - c.z) if ax else absf(p.x - c.x)
              var par := absf(p.x - c.x) if ax else absf(p.z - c.z)
              return perp < 0.6 and par < 1.6 and absf(p.y - c.y) < 1.8


          func _update_door_touch() -> void:
              var pts: Array[Vector3] = [player.left_ctrl.global_position, player.right_ctrl.global_position, player.left_follower.global_position, player.right_follower.global_position]
              var spd: Array[float] = [lc_speed, rc_speed, 0.0, 0.0]
              for d in doors:
                  if d["open"]:
                      continue
                  for i in 4:
                      if not _hand_near_door(d, pts[i]):
                          continue
                      var kind: String = d["kind"]
                      if kind == "H":
                          _open_door(d)
                          _noise(d["pos"], 12.0)
                          _say("HAZARD DOOR OPENED", 1.5)
                      elif kind == "L":
                          if has_key:
                              has_key = false
                              _open_door(d)
                              _say("VAULT UNLOCKED", 2.0)
                          elif msg_t <= 0.0:
                              _say("LOCKED - FIND THE KEYCARD", 2.0)
                      elif kind == "W":
                          if spd[i] > 2.5:
                              _open_door(d)
                              _noise(d["pos"], 16.0)
                              _say("GLASS SMASHED", 1.5)
                      break


          func _open_door(d: Dictionary) -> void:
              if d["open"]:
                  return
              d["open"] = true
              var body: StaticBody3D = d["node"]
              body.collision_layer = 0
              var c: Vector3i = d["cell"]
              lv[c.z][c.y][c.x] = "."
              if d["kind"] == "L":
                  for it in items:
                      it["vault"] = false
              var tw := create_tween()
              tw.tween_property(body, "position:y", body.position.y + WALL_H, 0.5)
              tw.tween_callback(body.hide)


          func _noise(pos: Vector3, radius: float) -> void:
              noise_pos = pos
              noise_r = radius
              noise_t = 4.0


          func _clear_line(a: Vector3, b: Vector3) -> bool:
              var space := get_world_3d().direct_space_state
              var rq := PhysicsRayQueryParameters3D.create(a, b, 1)
              return space.intersect_ray(rq).is_empty()


          # ---------------------------------------------------------------------------
          # The monster (hears your speed and your VOICE)
          # ---------------------------------------------------------------------------
          func _make_monster() -> void:
              monster = Node3D.new()
              monster_av = null
              if use_model:
                  var av := Avatar.new()
                  monster.add_child(av)
                  if av.build(Color(0.12, 0.03, 0.03), 1.0, false):
                      av.scale = Vector3.ONE * 1.9
                      av.position = Vector3(0.0, 0.4, 0.0)
                      av.rotation.y = PI
                      av.set_eye_glow(Color(1.0, 0.05, 0.05))
                      monster_av = av
                  else:
                      av.queue_free()
              if monster_av == null:
                  var body := MeshInstance3D.new()
                  var cm := CapsuleMesh.new()
                  cm.radius = 0.35
                  cm.height = 2.2
                  body.mesh = cm
                  body.position = Vector3(0.0, 1.1, 0.0)
                  var bmat := StandardMaterial3D.new()
                  bmat.albedo_color = Color(0.03, 0.03, 0.04)
                  body.material_override = bmat
                  monster.add_child(body)
                  for sx in [-0.14, 0.14]:
                      var eye := MeshInstance3D.new()
                      var sm := SphereMesh.new()
                      sm.radius = 0.06
                      sm.height = 0.12
                      eye.mesh = sm
                      eye.material_override = _glow_mat(Color(1.0, 0.05, 0.05), 3.0)
                      eye.position = Vector3(sx, 1.8, -0.3)
                      monster.add_child(eye)
              var ml := OmniLight3D.new()
              ml.light_color = Color(1.0, 0.1, 0.1)
              ml.omni_range = 4.0
              ml.light_energy = 0.8
              ml.position = Vector3(0.0, 1.8, 0.0)
              monster.add_child(ml)
              monster.position = _cell_center(monster_cell)
              world.add_child(monster)


          func _reset_monster() -> void:
              mstate = "patrol"
              path = []
              lost_t = 0.0
              monster.scale = Vector3.ONE
              monster.position = _cell_center(monster_cell)
              flash.light_energy = 0.0


          func _update_monster(delta: float) -> void:
              if monster == null or round_over:
                  return
              var mpos := monster.position
              var eye := mpos + Vector3(0.0, 1.8, 0.0)
              var ratio := clampf(float(team_value) / float(maxi(quota, 1)), 0.0, 1.0)
              var cur_speed := 0.0

              if mstate == "caught":
                  caught_t -= delta
                  var chead := cam.global_position
                  var f := -cam.global_transform.basis.z
                  f.y = 0.0
                  if f.length() < 0.01:
                      f = Vector3(0.0, 0.0, -1.0)
                  f = f.normalized()
                  var fy := BASE_Y if chead.y < -2.0 else 0.0
                  monster.position = Vector3(chead.x, fy, chead.z) + f * 0.85
                  monster.rotation.y = atan2(f.x, f.z)
                  flash.light_energy = 4.0 + 3.0 * sin(caught_t * 40.0)
                  if caught_t <= 0.0:
                      player.respawn()
                      head_speed = 0.0
                      _reset_monster()
                  return

              # ---- senses: footsteps, voice, line of sight; frozen apes are hard to spot
              var best_d := 1.0e9
              var best_i := -2
              var tpos := Vector3.ZERO
              var tvel := Vector3.ZERO
              if player._running:
                  var ph := cam.global_position
                  var pd := mpos.distance_to(ph)
                  var reach := 2.5 + head_speed * 2.2
                  if talking:
                      reach += 16.0
                  var noticed := pd < reach
                  if not noticed and pd < 13.0:
                      noticed = _clear_line(eye, ph)
                  if noticed and pd < best_d:
                      best_d = pd
                      best_i = -1
                      tpos = ph
                      tvel = head_vel
              for i in bots.size():
                  var b: Dictionary = bots[i]
                  if b["state"] == "dead":
                      continue
                  var bn: Node3D = b["node"]
                  var bp := bn.position + Vector3(0.0, 0.8, 0.0)
                  var bd := mpos.distance_to(bp)
                  var quiet: bool = b["state"] == "hide"
                  var bnoticed := bd < (1.5 if quiet else 6.0)
                  if not bnoticed and quiet and bd < 3.0:
                      bnoticed = _clear_line(eye, bp)
                  elif not bnoticed and not quiet and bd < 11.0:
                      bnoticed = _clear_line(eye, bp)
                  if bnoticed and bd < best_d:
                      best_d = bd
                      best_i = i
                      tpos = bp

              if best_i != -2:
                  last_seen_pos = tpos
                  chase_pos = tpos
                  chase_vel = tvel
                  if mstate != "chase":
                      mstate = "chase"
                      repath_t = 0.0
                  lost_t = 0.0
              elif mstate == "chase":
                  lost_t += delta
                  if lost_t > 1.2:
                      mstate = "search"
                      search_t = 9.0
                      path = _find_path(_pos_to_cell(mpos), _pos_to_cell(last_seen_pos))

              if noise_t > 0.0:
                  noise_t -= delta
                  if (mstate == "patrol" or mstate == "search") and mpos.distance_to(noise_pos) < noise_r:
                      mstate = "investigate"
                      path = _find_path(_pos_to_cell(mpos), _pos_to_cell(noise_pos))
                      noise_t = 0.0

              # ---- decide where to go
              var speed := 2.3 + 0.8 * ratio
              if mstate == "chase":
                  speed = 3.9 + 1.4 * ratio
                  if best_i != -2 and best_d < 3.0:
                      speed *= 1.3
                  repath_t -= delta
                  if repath_t <= 0.0:
                      repath_t = 0.3
                      var lead := chase_pos + chase_vel * 0.5
                      lead.y = chase_pos.y
                      var lc := _pos_to_cell(lead)
                      if not _passable(lc):
                          lc = _pos_to_cell(chase_pos)
                      path = _find_path(_pos_to_cell(mpos), lc)
              elif mstate == "search":
                  speed = 3.0
                  search_t -= delta
                  if path.is_empty():
                      var base_c := _pos_to_cell(last_seen_pos)
                      var goal := _random_cell()
                      for k in 10:
                          var c := _random_cell()
                          goal = c
                          if c.z == base_c.z and absi(c.x - base_c.x) + absi(c.y - base_c.y) <= 8:
                              break
                      path = _find_path(_pos_to_cell(mpos), goal)
                  if search_t <= 0.0:
                      mstate = "patrol"
                      path = []
              elif mstate == "investigate":
                  speed = 3.2
                  if path.is_empty():
                      mstate = "search"
                      search_t = 5.0
                      last_seen_pos = noise_pos
              elif path.is_empty():
                  path = _find_path(_pos_to_cell(mpos), _patrol_goal())

              # doors in the way
              for d in doors:
                  if d["kind"] == "H" and not d["open"] and _flat(mpos, d["pos"]) < 2.6 and absf(mpos.y - (d["pos"].y - WALL_H / 2.0)) < 1.0:
                      _open_door(d)

              var moving := false
              var target := Vector3.ZERO
              var flat := false
              if not path.is_empty():
                  target = path[0]
                  moving = true
              elif mstate == "chase":
                  target = chase_pos
                  moving = true
                  flat = true
              if moving:
                  var to := target - mpos
                  if flat:
                      to.y = 0.0
                  var tl := to.length()
                  if tl < 0.3 and not path.is_empty():
                      path.remove_at(0)
                  elif tl > 0.01:
                      var dv := to / tl
                      monster.position += dv * minf(speed * delta, tl)
                      monster.rotation.y = atan2(-dv.x, -dv.z)
                      cur_speed = speed
              if monster_av != null:
                  monster_av.animate_ai(delta, cur_speed, monster.position.y + 0.1)

              # ---- catch
              if mstate == "chase" and best_i != -2 and best_d < 1.0:
                  if best_i == -1:
                      if cam.global_position.y - monster.position.y < 2.6:
                          mstate = "caught"
                          caught_t = 1.8
                          monster.scale = Vector3.ONE * 1.6
                          _drop_items(carried)
                          carried = []
                          if has_key and key_node != null:
                              has_key = false
                              key_node.visible = true
                          _say("IT GOT YOU", 2.5)
                  else:
                      _catch_bot(best_i)


          # Patrol where the action is: the recycler and wherever loot has gone missing.
          func _patrol_goal() -> Vector3i:
              var r := rng.randf()
              if r < 0.3:
                  return _pos_to_cell(recycler_pos)
              if r < 0.6:
                  var gone: Array = []
                  for it in items:
                      if it["taken"]:
                          gone.append(it)
                  if gone.size() > 0:
                      var g: Dictionary = gone[rng.randi() % gone.size()]
                      return _pos_to_cell(g["home"])
              return _random_cell()


          func _drop_items(list: Array) -> void:
              for idx in list:
                  var it: Dictionary = items[idx]
                  it["taken"] = false
                  it["claimed"] = -1
                  var nd: Node3D = it["node"]
                  nd.visible = true
                  nd.position = it["home"]


          func _catch_bot(i: int) -> void:
              var b: Dictionary = bots[i]
              if b["state"] == "dead":
                  return
              var bn: Node3D = b["node"]
              _drop_items(b["carry"])
              b["carry"] = []
              b["state"] = "dead"
              b["dead_t"] = 7.0
              b["path"] = []
              b["target"] = -1
              bn.visible = false
              if b["has_key"] and key_node != null:
                  b["has_key"] = false
                  key_node.visible = true
              if key_bot == i:
                  key_bot = -1
              if mode == "monster":
                  caught_bots += 1
                  var q := Game.progress("catch", 1)
                  _say("CAUGHT %d/%d" % [caught_bots, bots.size()], 1.5)
                  if q > 0:
                      _say("QUEST COMPLETE  +$%d" % q, 3.0)


          func _update_player_monster() -> void:
              if not player._running:
                  return
              var pts: Array[Vector3] = [cam.global_position, player.left_follower.global_position, player.right_follower.global_position]
              for i in bots.size():
                  var b: Dictionary = bots[i]
                  if b["state"] == "dead":
                      continue
                  var bn: Node3D = b["node"]
                  var bp := bn.position + Vector3(0.0, 0.7, 0.0)
                  for p in pts:
                      if p.distance_to(bp) < 0.8:
                          _catch_bot(i)
                          break


          # ---------------------------------------------------------------------------
          # AI apes (stand-ins for the other players)
          # ---------------------------------------------------------------------------
          func _update_bots(delta: float) -> void:
              var avoid_c := Vector3i(-99, -99, 0)
              var have_threat := false
              var threat_pos := Vector3(1.0e6, 0.0, 1.0e6)
              if mode == "monster":
                  threat_pos = cam.global_position
                  have_threat = true
              elif monster != null:
                  threat_pos = monster.position + Vector3(0.0, 1.0, 0.0)
                  have_threat = true
              if have_threat:
                  avoid_c = _pos_to_cell(threat_pos)

              for i in bots.size():
                  var b: Dictionary = bots[i]
                  var n: Node3D = b["node"]
                  if b["state"] == "dead":
                      if mode == "base":
                          b["dead_t"] -= delta
                          if b["dead_t"] <= 0.0:
                              b["state"] = "seek"
                              n.visible = true
                              n.position = _cell_center(spawn_cell)
                              b["path"] = []
                              b["target"] = -1
                      continue
                  b["repath"] -= delta
                  var before := n.position

                  var mdist := 1.0e9
                  var sees := false
                  if have_threat:
                      mdist = n.position.distance_to(threat_pos)
                      sees = mdist < 11.0 and _clear_line(n.position + Vector3(0.0, 1.0, 0.0), threat_pos)
                      if sees:
                          b["last_seen"] = threat_pos
                          b["alert_t"] = 4.0
                      else:
                          b["alert_t"] = maxf(float(b.get("alert_t", 0.0)) - delta, 0.0)
                      if not sees and float(b.get("alert_t", 0.0)) > 0.0 and b.has("last_seen"):
                          mdist = minf(mdist, n.position.distance_to(b["last_seen"]) + 2.0)

                  var st: String = b["state"]
                  if sees and mdist < 8.0 and st != "flee":
                      b["state"] = "flee"
                      b["path"] = _hide_path(n.position, threat_pos, avoid_c)
                      b["repath"] = 1.2
                      st = "flee"
                  elif st == "flee" and b["path"].is_empty():
                      b["state"] = "hide"
                      b["hide_t"] = rng.randf_range(5.0, 9.0)
                      st = "hide"
                  elif st == "hide":
                      b["hide_t"] -= delta
                      if sees and mdist < 6.5:
                          b["state"] = "flee"
                          b["path"] = _hide_path(n.position, threat_pos, avoid_c)
                          b["repath"] = 1.2
                          st = "flee"
                      elif b["hide_t"] <= 0.0:
                          b["state"] = "deliver" if b["carry"].size() > 0 else "seek"
                          b["path"] = []
                          st = b["state"]

                  # hazard doors get opened (noisily) when an ape walks through
                  for d in doors:
                      if d["kind"] == "H" and not d["open"] and _flat(n.position, d["pos"]) < 2.6 and absf(n.position.y - (d["pos"].y - WALL_H / 2.0)) < 1.0:
                          _open_door(d)
                          _noise(d["pos"], 10.0)

                  # one ape fetches the keycard and unlocks the vault
                  if st == "seek" and key_bot == -1 and i == 0 and key_node != null and key_node.visible and _vault_locked():
                      key_bot = i
                      b["state"] = "key"
                      b["path"] = []
                      st = "key"

                  if st == "key":
                      if key_node == null or not key_node.visible:
                          key_bot = -1
                          b["state"] = "seek"
                      elif n.position.distance_to(key_node.position) < 0.9:
                          key_node.visible = false
                          b["has_key"] = true
                          b["state"] = "unlock"
                          b["path"] = []
                      elif b["path"].is_empty() and b["repath"] <= 0.0:
                          var kc := _pos_to_cell(key_node.position)
                          b["path"] = _find_path(_pos_to_cell(n.position), kc, avoid_c, 6)
                          if b["path"].is_empty():
                              b["path"] = _find_path(_pos_to_cell(n.position), kc)
                          b["repath"] = 1.0
                  elif st == "unlock":
                      var ld := _locked_door()
                      if ld.is_empty():
                          b["has_key"] = false
                          key_bot = -1
                          b["state"] = "seek"
                      elif _flat(n.position, ld["pos"]) < 3.3 and absf(n.position.y - (ld["pos"].y - WALL_H / 2.0)) < 1.0:
                          _open_door(ld)
                          b["has_key"] = false
                          key_bot = -1
                          b["state"] = "seek"
                      elif b["path"].is_empty() and b["repath"] <= 0.0:
                          var dc: Vector3i = ld["cell"]
                          var goal := dc
                          for dv in DIRS:
                              var nc := Vector3i(dc.x + dv.x, dc.y + dv.y, dc.z)
                              if _passable(nc):
                                  goal = nc
                                  break
                          b["path"] = _find_path(_pos_to_cell(n.position), goal)
                          b["repath"] = 1.0
                  elif st == "seek":
                      var ti: int = b["target"]
                      if ti < 0 or items[ti]["taken"] or items[ti]["vault"] or int(items[ti]["claimed"]) != i:
                          ti = _pick_item_for(i, n.position, threat_pos, 1.0e9)
                          b["target"] = ti
                          b["path"] = []
                      if ti >= 0:
                          var tn: Node3D = items[ti]["node"]
                          if n.position.distance_to(tn.position) < 0.7:
                              items[ti]["taken"] = true
                              tn.visible = false
                              b["carry"].append(ti)
                              b["target"] = -1
                              b["path"] = []
                              var more := -1
                              if b["carry"].size() < 3:
                                  more = _pick_item_for(i, n.position, threat_pos, 6.0)
                              if more >= 0:
                                  b["target"] = more
                              else:
                                  b["state"] = "deliver"
                          elif b["path"].is_empty():
                              if _pos_to_cell(n.position) == _pos_to_cell(tn.position):
                                  _step_toward(n, tn.position, b["speed"], delta)
                              elif b["repath"] <= 0.0:
                                  var tc := _pos_to_cell(tn.position)
                                  b["path"] = _find_path(_pos_to_cell(n.position), tc, avoid_c, 6)
                                  if b["path"].is_empty():
                                      b["path"] = _find_path(_pos_to_cell(n.position), tc)
                                  b["repath"] = 1.0
                  elif st == "deliver":
                      if n.position.distance_to(recycler_pos) < 1.6:
                          for idx in b["carry"]:
                              team_value += int(items[idx]["value"])
                          b["carry"] = []
                          b["state"] = "seek"
                          b["path"] = []
                      elif b["path"].is_empty() and b["repath"] <= 0.0:
                          var rc := _pos_to_cell(recycler_pos)
                          b["path"] = _find_path(_pos_to_cell(n.position), rc, avoid_c, 6)
                          if b["path"].is_empty():
                              b["path"] = _find_path(_pos_to_cell(n.position), rc)
                          b["repath"] = 1.0

                  var sp: float = b["speed"]
                  if st == "flee":
                      sp = 3.8 + (0.9 if mdist < 3.5 else 0.0)
                  elif st == "hide":
                      sp = 0.0
                  elif have_threat and mdist < 16.0:
                      sp = 2.0
                  _follow(n, b["path"], sp, delta)
                  if sp > 0.0 and not b["path"].is_empty():
                      if (n.position - before).length() < 0.2 * sp * delta:
                          b["stuck"] = float(b.get("stuck", 0.0)) + delta
                          if b["stuck"] > 1.2:
                              b["path"] = []
                              b["repath"] = 0.0
                              b["stuck"] = 0.0
                      else:
                          b["stuck"] = 0.0
                  if b["av"] != null:
                      var moved := (n.position - before).length() / delta
                      b["av"].animate_ai(delta, moved, n.position.y + 0.1)


          func _pick_item_for(bi: int, from_pos: Vector3, threat_pos: Vector3, max_d: float) -> int:
              var best := -1
              var best_s := -1.0
              for k in items.size():
                  var it: Dictionary = items[k]
                  if it["taken"] or it["vault"]:
                      continue
                  var cl := int(it["claimed"])
                  if cl != -1 and cl != bi:
                      continue
                  var nd: Node3D = it["node"]
                  var dd := from_pos.distance_to(nd.position)
                  if dd > max_d:
                      continue
                  if nd.position.distance_to(threat_pos) < 7.0:
                      continue
                  var s := float(it["value"]) / (1.0 + dd * 0.12)
                  if s > best_s:
                      best_s = s
                      best = k
              if best >= 0:
                  items[best]["claimed"] = bi
              return best


          func _hide_path(from_pos: Vector3, threat_pos: Vector3, avoid_c: Vector3i) -> Array:
              var best := _random_cell()
              var best_s := -1.0e9
              for k in 14:
                  var c := _random_cell()
                  var cp := _cell_center(c)
                  var dt := cp.distance_to(threat_pos)
                  var s := dt
                  if dt < 10.0:
                      s -= 50.0
                  s += 6.0 * float(maxi(0, 3 - _open_count(c)))
                  if not _clear_line(cp + Vector3(0.0, 1.0, 0.0), threat_pos):
                      s += 14.0
                  s -= cp.distance_to(from_pos) * 0.25
                  if s > best_s:
                      best_s = s
                      best = c
              var p := _find_path(_pos_to_cell(from_pos), best, avoid_c, 4)
              if p.is_empty():
                  p = _find_path(_pos_to_cell(from_pos), best)
              return p


          func _follow(n: Node3D, p: Array, speed: float, delta: float) -> void:
              if p.is_empty():
                  return
              var target: Vector3 = p[0]
              var to := target - n.position
              var tl := to.length()
              if tl < 0.25:
                  p.remove_at(0)
              else:
                  var dv := to / tl
                  n.position += dv * minf(speed * delta, tl)
                  n.rotation.y = atan2(-dv.x, -dv.z)


          func _step_toward(n: Node3D, target: Vector3, speed: float, delta: float) -> void:
              var to := target - n.position
              to.y = 0.0
              var tl := to.length()
              if tl > 0.01:
                  var dv := to / tl
                  n.position += dv * minf(speed * delta, tl)
                  n.rotation.y = atan2(-dv.x, -dv.z)


          # ---------------------------------------------------------------------------
          # DON'T SPLASH
          # ---------------------------------------------------------------------------
          func _start_splash() -> void:
              mode = "splash"
              _clear_world()
              _set_env(Color(0.5, 0.7, 0.95), Color(0.85, 0.9, 1.0), 1.0, 0.004, Color(0.75, 0.87, 1.0))
              _set_sky()
              lamp.light_energy = 0.0
              flash.light_energy = 0.0
              player.jump_multiplier = 1.1
              player.max_jump_speed = 6.5
              _apply_fur(Game.fur_color(), Game.fur_amount())
              splashes = 0

              var sun := DirectionalLight3D.new()
              sun.rotation_degrees = Vector3(-50.0, 30.0, 0.0)
              sun.light_energy = 1.1
              world.add_child(sun)

              var water := MeshInstance3D.new()
              var pm := PlaneMesh.new()
              pm.size = Vector2(320.0, 320.0)
              pm.subdivide_width = 48
              pm.subdivide_depth = 48
              water.mesh = pm
              water.material_override = mats.water()
              water.position = Vector3(0.0, -3.0, -30.0)
              world.add_child(water)

              # rocky pillars rising from the sea
              for k in 14:
                  var rock := MeshInstance3D.new()
                  var rm := CylinderMesh.new()
                  var rh := rng.randf_range(8.0, 28.0)
                  rm.height = rh
                  rm.top_radius = rng.randf_range(1.5, 3.5)
                  rm.bottom_radius = rm.top_radius + 1.5
                  rock.mesh = rm
                  rock.material_override = mats.surface("wall", Color(0.7, 0.6, 0.5), 0.15)
                  var side := -1.0 if k % 2 == 0 else 1.0
                  rock.position = Vector3(side * rng.randf_range(14.0, 40.0), -3.5 + rh / 2.0, -rng.randf_range(0.0, 90.0))
                  world.add_child(rock)

              var lvl := Game.level()
              var count := 12 + mini(lvl, 8)
              var gap := 1.5 + 0.08 * float(mini(lvl, 10))
              sink_delay = maxf(0.6, 1.2 - 0.05 * float(lvl))
              var shrink := 1.0 - 0.02 * float(mini(lvl, 10))

              _add_platform(Vector3(0.0, 0.0, 0.0), 2.5, 2.5, false)
              var z := -2.5
              for i in count:
                  var hx := rng.randf_range(0.9, 1.4) * shrink
                  var hz := hx
                  z -= gap + hz
                  _add_platform(Vector3(rng.randf_range(-2.5, 2.5), rng.randf_range(-0.3, 0.3), z), hx, hz, true)
                  z -= hz
              z -= gap + 2.5
              goal_pos = Vector3(0.0, 0.0, z)
              _add_platform(goal_pos, 2.5, 2.5, false)
              _label("FINISH", goal_pos + Vector3(0.0, 2.5, 0.0), 0.01, 100, Color(1.0, 0.85, 0.2))
              _make_exit(Vector3(1.8, 0.0, 1.8))

              player.spawn_point = Vector3(0.0, 2.0, 0.0)
              player.respawn()
              _say("DON'T SPLASH!  REACH THE FINISH.", 5.0)


          func _add_platform(top: Vector3, hx: float, hz: float, sinks: bool) -> void:
              var body := StaticBody3D.new()
              body.collision_layer = 1
              body.position = Vector3(top.x, top.y - 0.3, top.z)
              var mi := MeshInstance3D.new()
              var col := Color(1.0, 1.0, 1.0) if sinks else Color(1.0, 0.85, 0.5)
              var mat: StandardMaterial3D
              if sinks:
                  mat = mats.surface("wood", col, 0.9).duplicate()
              else:
                  mat = mats.surface("metal", Color(1.0, 0.85, 0.4), 0.5).duplicate()
              var cs := CollisionShape3D.new()
              if sinks:
                  var cm := CylinderMesh.new()
                  cm.top_radius = hx
                  cm.bottom_radius = hx * 0.9
                  cm.height = 0.6
                  mi.mesh = cm
                  var cyl := CylinderShape3D.new()
                  cyl.radius = hx
                  cyl.height = 0.6
                  cs.shape = cyl
              else:
                  var bm := BoxMesh.new()
                  bm.size = Vector3(hx * 2.0, 0.6, hz * 2.0)
                  mi.mesh = bm
                  var bs := BoxShape3D.new()
                  bs.size = bm.size
                  cs.shape = bs
              mi.material_override = mat
              body.add_child(mi)
              body.add_child(cs)
              world.add_child(body)
              platforms.append({"node": body, "mat": mat, "col": col, "hx": hx, "hz": hz, "top": top.y, "sinks": sinks, "state": "idle", "t": 0.0})


          func _splash_fx(pos: Vector3) -> void:
              var p := CPUParticles3D.new()
              p.amount = 48
              p.lifetime = 1.0
              p.one_shot = true
              p.explosiveness = 1.0
              p.direction = Vector3.UP
              p.spread = 35.0
              p.initial_velocity_min = 3.0
              p.initial_velocity_max = 6.0
              p.gravity = Vector3(0.0, -9.8, 0.0)
              var sm := SphereMesh.new()
              sm.radius = 0.06
              sm.height = 0.12
              sm.material = mats.glow(Color(0.8, 0.93, 1.0), 0.8)
              p.mesh = sm
              p.position = Vector3(pos.x, -3.0, pos.z)
              world.add_child(p)
              p.emitting = true


          func _reset_platforms() -> void:
              for p in platforms:
                  var nd: StaticBody3D = p["node"]
                  nd.position.y = float(p["top"]) - 0.3
                  nd.show()
                  nd.collision_layer = 1
                  p["state"] = "idle"
                  p["t"] = 0.0
                  var m: StandardMaterial3D = p["mat"]
                  m.albedo_color = p["col"]


          func _update_splash(delta: float) -> void:
              if round_over:
                  over_t -= delta
                  if over_t <= 0.0:
                      _enter_lobby()
                  return
              if not player._running:
                  return
              var head := cam.global_position
              for p in platforms:
                  if not p["sinks"]:
                      continue
                  var nd: StaticBody3D = p["node"]
                  var st: String = p["state"]
                  var cur_top := nd.position.y + 0.3
                  if st == "idle" or st == "armed":
                      var on := absf(head.x - nd.position.x) < float(p["hx"]) + 0.25 and absf(head.z - nd.position.z) < float(p["hz"]) + 0.25 and head.y > cur_top and head.y < cur_top + 1.8
                      if st == "idle" and on:
                          p["state"] = "armed"
                          p["t"] = 0.0
                      elif st == "armed":
                          p["t"] += delta
                          var m: StandardMaterial3D = p["mat"]
                          m.albedo_color = Color(1.0, 0.3, 0.2) if int(float(p["t"]) * 8.0) % 2 == 0 else Color(1.0, 0.7, 0.2)
                          if p["t"] >= sink_delay:
                              p["state"] = "sinking"
                  elif st == "sinking":
                      nd.position.y -= 0.6 * delta
                      if nd.position.y < -3.5:
                          p["state"] = "gone"
                          p["t"] = 0.0
                          nd.hide()
                          nd.collision_layer = 0
                  elif st == "gone":
                      p["t"] += delta
                      if p["t"] > 6.0:
                          nd.position.y = float(p["top"]) - 0.3
                          nd.show()
                          nd.collision_layer = 1
                          p["state"] = "idle"
                          var m2: StandardMaterial3D = p["mat"]
                          m2.albedo_color = p["col"]

              if head.y < -1.2:
                  splashes += 1
                  _say("SPLASH!", 2.0)
                  _reset_platforms()
                  head_speed = 0.0
                  player.respawn()
                  return
              if absf(head.x - goal_pos.x) < 2.5 and absf(head.z - goal_pos.z) < 2.5 and head.y > 0.3 and head.y < 2.5:
                  round_over = true
                  over_t = 5.0
                  var m3 := 60 + maxi(0, 40 - splashes * 10)
                  var x3 := 30
                  var r := Game.progress("splash", 1)
                  m3 += r
                  Game.add_money(m3)
                  Game.add_xp(x3)
                  _say("YOU CROSSED!  +$%d  +%d XP" % [m3, x3], 5.0)


          # ---------------------------------------------------------------------------
          # CI self test (godot --headless -- --selftest): builds every mode, simulates AI
          # ---------------------------------------------------------------------------
          func _selftest() -> void:
              print("SELFTEST start")
              _enter_lobby()
              _start_splash()
              _start_base(true)
              _start_base(false)
              var bad := 0
              var from_c := spawn_cell
              for it in items:
                  if it["vault"]:
                      continue
                  var nd: Node3D = it["node"]
                  var pth := _find_path(from_c, _pos_to_cell(nd.position))
                  if pth.is_empty():
                      bad += 1
              print("SELFTEST items=", items.size(), " unreachable=", bad, " quota=", quota, " doors=", doors.size())
              for k in 4000:
                  _update_bots(0.1)
                  _update_monster(0.1)
              print("SELFTEST after sim team_value=", team_value)
              _start_base(true)
              for k in 200:
                  _update_bots(0.1)
              _enter_lobby()
              print("SELFTEST OK")
              get_tree().quit()
          EOF

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/GillaRemake.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.gillaremake.game"
          package/name="Gilla Remake"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          graphics/opengl_debug=false
          xr_features/xr_mode=1
          xr_features/hand_tracking=0
