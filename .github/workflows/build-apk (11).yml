              for n in [head, body, lh, rh]:
                  n.material_override = mat
              tag.text = nm


          func apply(h: Vector3, q: Quaternion, l: Vector3, r: Vector3) -> void:
              if not fresh:
                  fresh = true
                  head.global_position = h
                  lh.global_position = l
                  rh.global_position = r
              t_head = h
              t_q = q
              t_l = l
              t_r = r


          func set_role(r: String) -> void:
