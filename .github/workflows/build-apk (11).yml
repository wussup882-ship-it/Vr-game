# Place at .github/workflows/build-apk.yml
# Generates a complete Godot 4.3 multiplayer VR project (Gorilla-Tag style locomotion)
# on the runner with cat << 'EOF' blocks, then exports an Android (Quest / OpenXR) APK.
name: Build Forest Gorilla Tag APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_BASE_URL: https://github.com/godotengine/godot/releases/download/4.3-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
      - name: Download Godot 4.3 and headless export templates
        run: |
          set -e
          cd "$RUNNER_TEMP"
          wget -q "$GODOT_BASE_URL/Godot_v4.3-stable_linux.x86_64.zip"
          wget -q "$GODOT_BASE_URL/Godot_v4.3-stable_export_templates.tpz"
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          godot --version
      - name: Create debug keystore and Godot editor settings
        run: |
          set -e
          KS="$HOME/debug.keystore"
          keytool -genkey -v -keystore "$KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.3.tres editor_settings-4.tres; do
            cat << EOF > ~/.config/godot/$f
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KS"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
      - name: Write project.godot and export_presets.cfg
        run: |
          set -e
          mkdir -p game
          cat << 'EOF' > game/project.godot
          ; Engine configuration file.
          config_version=5

          [application]

          config/name="Forest Gorilla Tag"
          run/main_scene="res://scenes/Main.tscn"
          config/features=PackedStringArray("4.3", "Mobile")

          [audio]

          driver/enable_input=true

          [autoload]

          Net="*res://scripts/Net.gd"
          Voice="*res://scripts/Voice.gd"

          [display]

          window/vsync/vsync_mode=0

          [layer_names]

          3d_physics/layer_1="world"
          3d_physics/layer_2="creatures"

          [physics]

          common/physics_ticks_per_second=72

          [rendering]

          renderer/rendering_method="mobile"
          renderer/rendering_method.mobile="mobile"
          textures/vram_compression/import_etc2_astc=true
          anti_aliasing/quality/msaa_3d=1

          [xr]

          openxr/enabled=true
          shaders/enabled=true
          EOF
          cat << 'EOF' > game/export_presets.cfg
          [preset.0]

          name="Quest"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ForestGorillaTag.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk="29"
          gradle_build/target_sdk="34"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.example.forestgorillatag"
          package/name="Forest Gorilla Tag"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          graphics/opengl_debug=false
          xr_features/xr_mode=1
          xr_features/enable_meta_plugin=true
          meta_xr_features/quest_support=2
          screen/immersive_mode=true
          user_data_backup/allow=false
          permissions/record_audio=true
          permissions/internet=true
          permissions/access_network_state=true
          permissions/access_wifi_state=true
          permissions/change_wifi_multicast_state=true
          EOF
      - name: Write GDScript files
        run: |
          set -e
          mkdir -p game/scripts
          cat << 'EOF' > game/scripts/Net.gd
          extends Node
          # Networking autoload: ENet + 6-character room codes + LAN discovery.

          signal players_changed
          signal status(msg: String)
          signal join_failed
          signal game_start
          signal player_left(pid: int)

          enum Mode { COOP, EVIL }

          const PORT := 24566
          const DISC_PORT := 24565
          const MAX_PLAYERS := 5
          const MIN_PLAYERS := 2
          const ALPHABET := "ABCDEFGHJKLMNPQR"

          var mode: int = Mode.COOP
          var room_code := ""
          var is_host := false
          var in_game := false
          var players: Dictionary = {}

          var _listen: PacketPeerUDP = null
          var _find: PacketPeerUDP = null
          var _finding := false
          var _find_code := ""
          var _find_t := 0.0
          var _find_elapsed := 0.0


          func _ready() -> void:
              multiplayer.peer_connected.connect(_on_peer_connected)
              multiplayer.peer_disconnected.connect(_on_peer_disconnected)
              multiplayer.connected_to_server.connect(_on_connected)
              multiplayer.connection_failed.connect(_on_conn_failed)
              multiplayer.server_disconnected.connect(_on_server_lost)
              var xr := XRServer.find_interface("OpenXR")
              if xr != null and xr.is_initialized():
                  get_viewport().use_xr = true
                  DisplayServer.window_set_vsync_mode(DisplayServer.VSYNC_DISABLED)


          func _make_code() -> String:
              var s := ""
              for i in 6:
                  s += ALPHABET[randi() % ALPHABET.length()]
              return s


          func host_game(m: int) -> void:
              _reset()
              mode = m
              room_code = _make_code()
              var peer := ENetMultiplayerPeer.new()
              var err := peer.create_server(PORT, MAX_PLAYERS - 1)
              if err != OK:
                  status.emit("Could not host (error %d)" % err)
                  return
              multiplayer.multiplayer_peer = peer
              is_host = true
              players = {1: {"name": "Host"}}
              _listen = PacketPeerUDP.new()
              if _listen.bind(DISC_PORT) != OK:
                  status.emit("LAN discovery unavailable")
              else:
                  status.emit("Hosting room " + room_code)
              players_changed.emit()


          func join_game(code: String) -> void:
              _reset()
              _find_code = code.to_upper()
              room_code = _find_code
              _find = PacketPeerUDP.new()
              _find.set_broadcast_enabled(true)
              for i in 8:
                  if _find.bind(30000 + randi() % 30000) == OK:
                      break
              _finding = true
              _find_t = 0.0
              _find_elapsed = 0.0
              status.emit("Searching for room " + _find_code + "...")


          func _targets() -> Array:
              var t: Array = ["255.255.255.255"]
              for a in IP.get_local_addresses():
                  var s := str(a)
                  var parts := s.split(".")
                  if parts.size() == 4 and not s.begins_with("127.") and not s.begins_with("169."):
                      t.append("%s.%s.%s.255" % [parts[0], parts[1], parts[2]])
              return t


          func _process(delta: float) -> void:
              if _listen != null:
                  while _listen.get_available_packet_count() > 0:
                      var msg := _listen.get_packet().get_string_from_utf8()
                      var ip := _listen.get_packet_ip()
                      var port := _listen.get_packet_port()
                      if msg == "FGT?" + room_code and not in_game:
                          _listen.set_dest_address(ip, port)
                          _listen.put_packet(("FGT!%d" % mode).to_utf8_buffer())
              if _finding and _find != null:
                  _find_elapsed += delta
                  _find_t -= delta
                  if _find_t <= 0.0:
                      _find_t = 0.8
                      for t in _targets():
                          _find.set_dest_address(t, DISC_PORT)
                          _find.put_packet(("FGT?" + _find_code).to_utf8_buffer())
                  while _find.get_available_packet_count() > 0:
                      var m := _find.get_packet().get_string_from_utf8()
                      var host_ip := _find.get_packet_ip()
                      if m.begins_with("FGT!"):
                          _finding = false
                          mode = int(m.substr(4))
                          _connect_to(host_ip)
                          return
                  if _find_elapsed > 15.0:
                      _finding = false
                      status.emit("Room not found")
                      join_failed.emit()


          func _connect_to(ip: String) -> void:
              if _find != null:
                  _find.close()
                  _find = null
              var peer := ENetMultiplayerPeer.new()
              var err := peer.create_client(ip, PORT)
              if err != OK:
                  status.emit("Connect failed (%d)" % err)
                  join_failed.emit()
                  return
              multiplayer.multiplayer_peer = peer
              status.emit("Found room, connecting...")


          func _stop_listen() -> void:
              if _listen != null:
                  _listen.close()
                  _listen = null


          func _reset() -> void:
              _finding = false
              if _find != null:
                  _find.close()
                  _find = null
              _stop_listen()
              if multiplayer.multiplayer_peer != null:
                  multiplayer.multiplayer_peer.close()
              multiplayer.multiplayer_peer = null
              players = {}
              is_host = false
              in_game = false
              room_code = ""


          func leave() -> void:
              _reset()


          func _on_peer_connected(_id: int) -> void:
              pass


          func _on_peer_disconnected(id: int) -> void:
              if multiplayer.is_server() and players.has(id):
                  players.erase(id)
                  _push_players()


          func _on_connected() -> void:
              register.rpc_id(1)


          func _on_conn_failed() -> void:
              status.emit("Connection failed")
              _reset()
              join_failed.emit()


          func _on_server_lost() -> void:
              _reset()
              get_tree().change_scene_to_file("res://scenes/Main.tscn")


          @rpc("any_peer", "reliable")
          func register() -> void:
              if not multiplayer.is_server():
                  return
              var id := multiplayer.get_remote_sender_id()
              players[id] = {"name": "Monkey %d" % (id % 100)}
              _push_players()


          func _push_players() -> void:
              set_players.rpc(players, mode, room_code)


          @rpc("authority", "call_local", "reliable")
          func set_players(p: Dictionary, m: int, code: String) -> void:
              var old: Array = players.keys()
              players = p
              mode = m
              room_code = code
              for k in old:
                  if not players.has(k):
                      player_left.emit(k)
              players_changed.emit()


          func start_game() -> void:
              if not multiplayer.is_server():
                  return
              if players.size() < MIN_PLAYERS:
                  status.emit("Need %d players to start" % MIN_PLAYERS)
                  return
              in_game = true
              _stop_listen()
              multiplayer.multiplayer_peer.refuse_new_connections = true
              _begin.rpc()


          @rpc("authority", "call_local", "reliable")
          func _begin() -> void:
              in_game = true
              game_start.emit()
          EOF
          cat << 'EOF' > game/scripts/Voice.gd
          extends Node
          # Microphone loudness via AudioEffectCapture.

          const SCREAM := 0.6
          const GAIN := 1.0

          var level := 0.0

          var _cap: AudioEffectCapture
          var _player: AudioStreamPlayer


          func _ready() -> void:
              var idx := AudioServer.bus_count
              AudioServer.add_bus(idx)
              AudioServer.set_bus_name(idx, "Mic")
              _cap = AudioEffectCapture.new()
              AudioServer.add_bus_effect(idx, _cap)
              AudioServer.set_bus_mute(idx, true)
              _player = AudioStreamPlayer.new()
              _player.stream = AudioStreamMicrophone.new()
              _player.bus = "Mic"
              add_child(_player)
              if OS.get_name() == "Android":
                  get_tree().on_request_permissions_result.connect(_on_perm)
                  OS.request_permissions()
              _player.play()


          func _on_perm(_permission: String, granted: bool) -> void:
              if granted:
                  _player.stop()
                  _player.play()


          func _process(delta: float) -> void:
              var peak := 0.0
              var frames := _cap.get_frames_available()
              if frames > 0:
                  var buf := _cap.get_buffer(frames)
                  for v in buf:
                      var a: float = maxf(absf(v.x), absf(v.y))
                      if a > peak:
                          peak = a
              peak = clampf(peak * GAIN, 0.0, 1.0)
              level = maxf(peak, level - delta * 2.0)
          EOF
          cat << 'EOF' > game/scripts/Main.gd
          extends Node3D
          # Menu / lobby. All buttons are 3D and are pressed by poking them with a hand.

          const KEYS := "ABCDEFGHJKLMNPQR"

          var ui: Node3D
          var info: Label3D
          var buttons: Array = []
          var held: Dictionary = {}
          var cool := 0.5
          var screen := "main"
          var code_in := ""
          var code_label: Label3D = null
          var lobby_label: Label3D = null

          @onready var lh: XRController3D = $Rig/Left
          @onready var rh: XRController3D = $Rig/Right


          func _ready() -> void:
              ui = Node3D.new()
              ui.position = Vector3(0, 1.25, -0.9)
              add_child(ui)
              info = Label3D.new()
              info.font_size = 36
              info.pixel_size = 0.0012
              info.position = Vector3(0, 0.72, -0.9)
              add_child(info)
              Net.status.connect(_on_status)
              Net.players_changed.connect(_on_players)
              Net.game_start.connect(_on_start)
              Net.join_failed.connect(_on_join_failed)
              _show_main()


          func _on_status(m: String) -> void:
              info.text = m


          func _on_players() -> void:
              if screen == "wait" or screen == "lobby":
                  _show_lobby()


          func _on_start() -> void:
              get_tree().change_scene_to_file("res://scenes/World.tscn")


          func _on_join_failed() -> void:
              if screen == "wait":
                  _show_join()


          func _clear() -> void:
              for c in ui.get_children():
                  c.queue_free()
              buttons.clear()
              held.clear()
              cool = 0.6
              code_label = null
              lobby_label = null


          func _label(text: String, pos: Vector2, fsize: int = 48) -> Label3D:
              var l := Label3D.new()
              l.text = text
              l.font_size = fsize
              l.pixel_size = 0.0015
              l.position = Vector3(pos.x, pos.y, 0.0)
              ui.add_child(l)
              return l


          func _button(id: String, text: String, pos: Vector2, size := Vector2(0.5, 0.14), col := Color(0.15, 0.45, 0.9)) -> void:
              var b := Node3D.new()
              b.position = Vector3(pos.x, pos.y, 0.0)
              var mi := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = Vector3(size.x, size.y, 0.04)
              mi.mesh = bm
              var m := StandardMaterial3D.new()
              m.albedo_color = col
              mi.material_override = m
              b.add_child(mi)
              var l := Label3D.new()
              l.text = text
              l.font_size = 40
              l.pixel_size = 0.0012
              l.position = Vector3(0, 0, 0.025)
              b.add_child(l)
              b.set_meta("id", id)
              b.set_meta("size", size)
              ui.add_child(b)
              buttons.append(b)


          func _show_main() -> void:
              screen = "main"
              _clear()
              _label("FOREST GORILLA TAG", Vector2(0, 0.5), 64)
              _button("host_coop", "HOST CO-OP", Vector2(0, 0.25))
              _button("host_evil", "HOST EVIL MRBEAST", Vector2(0, 0.05), Vector2(0.7, 0.14), Color(0.8, 0.2, 0.2))
              _button("join", "JOIN ROOM", Vector2(0, -0.15))


          func _show_join() -> void:
              screen = "join"
              _clear()
              code_in = ""
              code_label = _label("______", Vector2(0, 0.62), 72)
              for i in KEYS.length():
                  var cx := (i % 4) * 0.28 - 0.42
                  var cy := 0.42 - floorf(i / 4.0) * 0.17
                  _button("k_" + KEYS[i], KEYS[i], Vector2(cx, cy), Vector2(0.24, 0.14))
              _button("del", "DEL", Vector2(-0.3, -0.3), Vector2(0.28, 0.14), Color(0.8, 0.45, 0.1))
              _button("go", "JOIN", Vector2(0.03, -0.3), Vector2(0.28, 0.14), Color(0.1, 0.6, 0.2))
              _button("back", "BACK", Vector2(0.36, -0.3), Vector2(0.28, 0.14), Color(0.5, 0.5, 0.5))


          func _show_wait() -> void:
              screen = "wait"
              _clear()
              _label("Searching for room\n" + code_in + "\n(same Wi-Fi as host)", Vector2(0, 0.3), 48)
              _button("back", "CANCEL", Vector2(0, -0.2), Vector2(0.5, 0.14), Color(0.5, 0.5, 0.5))


          func _show_lobby() -> void:
              screen = "lobby"
              _clear()
              var s := "ROOM CODE:  %s\nMODE: %s\nPLAYERS %d/%d\n" % [Net.room_code, "CO-OP" if Net.mode == Net.Mode.COOP else "EVIL MRBEAST", Net.players.size(), Net.MAX_PLAYERS]
              for pid in Net.players:
                  s += "- " + str(Net.players[pid]["name"]) + "\n"
              lobby_label = _label(s, Vector2(0, 0.25), 48)
              if Net.is_host:
                  _button("start", "START GAME", Vector2(0, -0.3), Vector2(0.6, 0.15), Color(0.1, 0.6, 0.2))
              _button("back", "LEAVE", Vector2(0, -0.5), Vector2(0.4, 0.14), Color(0.5, 0.5, 0.5))


          func _process(dt: float) -> void:
              cool -= dt
              for h in [lh, rh]:
                  var hp: Vector3 = h.global_position
                  for b in buttons:
                      var lp: Vector3 = b.to_local(hp)
                      var sz: Vector2 = b.get_meta("size")
                      var inside := absf(lp.x) < sz.x * 0.5 and absf(lp.y) < sz.y * 0.5 and absf(lp.z) < 0.08
                      var key := "%d_%d" % [h.get_instance_id(), b.get_instance_id()]
                      if inside:
                          if not held.get(key, false):
                              held[key] = true
                              if cool <= 0.0:
                                  h.trigger_haptic_pulse("haptic", 0.0, 0.6, 0.08, 0.0)
                                  _press(str(b.get_meta("id")))
                                  return
                      else:
                          held[key] = false


          func _press(id: String) -> void:
              if id.begins_with("k_"):
                  if code_in.length() < 6:
                      code_in += id.substr(2)
                      _update_code()
                  return
              match id:
                  "host_coop":
                      Net.host_game(Net.Mode.COOP)
                      if Net.is_host:
                          _show_lobby()
                  "host_evil":
                      Net.host_game(Net.Mode.EVIL)
                      if Net.is_host:
                          _show_lobby()
                  "join":
                      _show_join()
                  "del":
                      if code_in.length() > 0:
                          code_in = code_in.substr(0, code_in.length() - 1)
                          _update_code()
                  "go":
                      if code_in.length() == 6:
                          var c := code_in
                          _show_wait()
                          code_in = c
                          Net.join_game(c)
                      else:
                          info.text = "Enter all 6 letters"
                  "start":
                      Net.start_game()
                  "back":
                      Net.leave()
                      info.text = ""
                      _show_main()


          func _update_code() -> void:
              if code_label != null:
                  code_label.text = code_in + "_".repeat(6 - code_in.length())
          EOF
          cat << 'EOF' > game/scripts/Map.gd
          extends Node3D
          # Forest clearing: ring of trees, boulders. Deterministic so all peers match.

          const TreeScene := preload("res://scenes/Tree.tscn")

          var spawn_points: Array = []
          var rng := RandomNumberGenerator.new()


          func _ready() -> void:
              rng.seed = 7
              var n := 22
              for i in n:
                  var a := TAU * float(i) / float(n) + rng.randf_range(-0.08, 0.08)
                  var r := rng.randf_range(20.0, 24.0)
                  var t: Node3D = TreeScene.instantiate()
                  t.position = Vector3(cos(a) * r, 0.0, sin(a) * r)
                  t.rotation.y = rng.randf() * TAU
                  add_child(t)
                  var inward := Vector3(-cos(a), 0.0, -sin(a))
                  spawn_points.append(t.position + inward * 1.8)
              for i in 16:
                  var a2 := TAU * float(i) / 16.0 + 0.2
                  var t2: Node3D = TreeScene.instantiate()
                  t2.position = Vector3(cos(a2) * 27.0, 0.0, sin(a2) * 27.0)
                  add_child(t2)
              for i in 6:
                  var a3 := TAU * float(i) / 6.0 + rng.randf_range(-0.3, 0.3)
                  var r3 := rng.randf_range(10.0, 15.0)
                  var t3: Node3D = TreeScene.instantiate()
                  t3.position = Vector3(cos(a3) * r3, 0.0, sin(a3) * r3)
                  add_child(t3)
              for i in 10:
                  var a4 := rng.randf() * TAU
                  var r4 := rng.randf_range(5.0, 16.0)
                  var sz := Vector3(rng.randf_range(0.8, 2.2), rng.randf_range(0.6, 2.0), rng.randf_range(0.8, 2.2))
                  _boulder(Vector3(cos(a4) * r4, sz.y * 0.5, sin(a4) * r4), sz)


          func _boulder(pos: Vector3, sz: Vector3) -> void:
              var body := StaticBody3D.new()
              body.position = pos
              var mi := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = sz
              mi.mesh = bm
              var m := StandardMaterial3D.new()
              m.albedo_color = Color(0.45, 0.45, 0.48)
              mi.material_override = m
              body.add_child(mi)
              var cs := CollisionShape3D.new()
              var bs := BoxShape3D.new()
              bs.size = sz
              cs.shape = bs
              body.add_child(cs)
              add_child(body)


          func player_spawn(i: int) -> Vector3:
              var a := TAU * float(i) / 5.0
              return Vector3(cos(a) * 3.0, 0.1, sin(a) * 3.0)
          EOF
          cat << 'EOF' > game/scripts/Blaster.gd
          extends Node3D

          var world = null
          var cd := 0.0

          @onready var muzzle: Node3D = $Muzzle


          func _process(dt: float) -> void:
              cd -= dt


          func fire() -> void:
