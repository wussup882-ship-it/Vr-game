      - name: Install Android build template and OpenXR Vendors plugin
        run: |
          set -e
          mkdir -p game/android/build
          unzip -q -o ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d game/android/build
          printf "4.3.stable" > game/android/.build_version
          # Godot OpenXR Vendors plugin (Meta Quest loader + manifest entries) for Godot 4.3
          URL=$(curl -sL https://api.github.com/repos/GodotVR/godot_openxr_vendors/releases/tags/3.0.0-stable | python3 -c "import sys,json; a=[x['browser_download_url'] for x in json.load(sys.stdin).get('assets',[]) if x['name'].endswith('.zip')]; print(a[0] if a else '')")
          echo "Vendors plugin URL: $URL"
          test -n "$URL"
          curl -sL "$URL" -o "$RUNNER_TEMP/vendors.zip"
          mkdir -p "$RUNNER_TEMP/vendors" game/addons
          unzip -q -o "$RUNNER_TEMP/vendors.zip" -d "$RUNNER_TEMP/vendors"
          SRC=$(find "$RUNNER_TEMP/vendors" -type d -name godotopenxrvendors | head -n 1)
          cp -r "$SRC" game/addons/
          ls game/addons/godotopenxrvendors
          cat << 'EOF' >> game/project.godot

          [editor_plugins]

          enabled=PackedStringArray("res://addons/godotopenxrvendors/plugin.cfg")
          EOF
      - name: Import project and export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/build"
          cd game
          godot --headless --import || true
          godot --headless --import || true
          godot --headless --export-debug "Quest" "$GITHUB_WORKSPACE/build/ForestGorillaTag.apk"
          ls -lh "$GITHUB_WORKSPACE/build"
          test -f "$GITHUB_WORKSPACE/build/ForestGorillaTag.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForestGorillaTag-apk
          path: build/ForestGorillaTag.apk
          if-no-files-found: error
