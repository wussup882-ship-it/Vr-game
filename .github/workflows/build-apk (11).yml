              gun.visible = not beast
              body_scale = 1.7 if beast else 1.0
              if beast:
                  mat.albedo_color = Color(0.9, 0.2, 0.1)
                  tag.text = "MR BEAST"


          func _process(dt: float) -> void:
              if not fresh:
                  return
              var k := minf(1.0, dt * 18.0)
              var cur := head.global_transform
              var nq := cur.basis.get_rotation_quaternion().slerp(t_q, k)
