          cat << 'EOF' > game/scripts/Gorilla.gd
          extends CharacterBody3D
          # Host runs think(); clients treat gorillas as puppets.

          var gid := 0
          var puppet := false
          var hp := 3
          var frozen_t := 0.0
          var atk_cd := 0.5
          var speed := 3.2
          var net_pos := Vector3.ZERO
          var net_yaw := 0.0
          var dead := false
          var mat := StandardMaterial3D.new()

          @onready var vis: Node3D = $Visual


          func _ready() -> void:
              mat.albedo_color = Color(0.13, 0.12, 0.14)
              for c in vis.get_children():
                  if c is MeshInstance3D:
                      c.material_override = mat
              net_pos = global_position
              vis.scale = Vector3.ONE * 0.05
              create_tween().tween_property(vis, "scale", Vector3.ONE, 0.6)


          func _frost(f: bool) -> void:
              mat.albedo_color = Color(0.45, 0.8, 1.0) if f else Color(0.13, 0.12, 0.14)


          func set_net(p: Vector3, yaw: float, fr: bool) -> void:
              net_pos = p
              net_yaw = yaw
              _frost(fr)


          func think(dt: float, target: Vector3, has_target: bool) -> bool:
              atk_cd -= dt
              var hit := false
              if frozen_t > 0.0:
                  frozen_t -= dt
                  velocity.x = 0.0
                  velocity.z = 0.0
              elif has_target:
                  var d := target - global_position
                  d.y = 0.0
                  var dist := d.length()
                  if dist > 1.5:
                      var dir := d / dist
                      velocity.x = dir.x * speed
                      velocity.z = dir.z * speed
                  else:
                      velocity.x = 0.0
                      velocity.z = 0.0
                      if atk_cd <= 0.0:
                          atk_cd = 1.2
                          hit = true
                  if dist > 0.2:
                      rotation.y = lerp_angle(rotation.y, atan2(-d.x, -d.z), minf(1.0, dt * 8.0))
              else:
                  velocity.x = 0.0
                  velocity.z = 0.0
              if is_on_floor():
                  velocity.y = -1.0
              else:
                  velocity.y -= 20.0 * dt
              move_and_slide()
              _frost(frozen_t > 0.0)
              return hit


          func _process(dt: float) -> void:
              if puppet and not dead:
                  var k := minf(1.0, dt * 12.0)
                  global_position = global_position.lerp(net_pos, k)
                  rotation.y = lerp_angle(rotation.y, net_yaw, k)


          func die() -> void:
              dead = true
              collision_layer = 0
              remove_from_group("gorilla")
              var tw := create_tween()
              tw.tween_property(vis, "scale", Vector3.ONE * 0.05, 0.3)
              tw.tween_callback(queue_free)
          EOF
          cat << 'EOF' > game/scripts/Player.gd
          extends CharacterBody3D
          # Gorilla-Tag style locomotion: a swept capsule body that follows the head.
          # When a hand touches geometry (layers 1 and 2) the body is pushed opposite
          # to the hand's movement, and keeps that velocity when you let go.

          const HAND_R := 0.075
          const MAX_SPEED := 9.0
          const GRAV := 9.8
          const BOOST := 1.1

          var world = null
          var down := false
          var vel := Vector3.ZERO
          var prev: Array = [Vector3.ZERO, Vector3.ZERO]
          var prev_ok := false
          var hand_shape := SphereShape3D.new()
          var cap := CapsuleShape3D.new()
          var hands: Array = []
          var laser: MeshInstance3D
          var marker: MeshInstance3D
          var aim_hit := Vector3.ZERO
          var aim_ok := false

          @onready var origin: XROrigin3D = $Origin
          @onready var cam: XRCamera3D = $Origin/Cam
          @onready var hud: Label3D = $Origin/Cam/Hud
          @onready var aim: XRController3D = $Origin/Aim
          @onready var blaster = $Origin/Aim/Blaster
          @onready var shape: CollisionShape3D = $Shape


          func _unshaded(c: Color) -> StandardMaterial3D:
              var m := StandardMaterial3D.new()
              m.albedo_color = c
              m.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
              return m


          func _ready() -> void:
              hand_shape.radius = HAND_R
              cap.radius = 0.25
              cap.height = 1.7
              shape.shape = cap
              hands = [$Origin/Left, $Origin/Right]
              blaster.world = world
              $Origin/Aim.button_pressed.connect(_aim_btn)
              $Origin/Left.button_pressed.connect(_left_btn)
              laser = MeshInstance3D.new()
              var lm := BoxMesh.new()
              lm.size = Vector3(0.01, 0.01, 1.0)
              laser.mesh = lm
              laser.material_override = _unshaded(Color(1, 0.1, 0.1))
              aim.add_child(laser)
              marker = MeshInstance3D.new()
              var sm := SphereMesh.new()
              sm.radius = 0.15
              sm.height = 0.3
              marker.mesh = sm
              marker.material_override = _unshaded(Color(1, 0.2, 0.2))
              marker.top_level = true
              add_child(marker)
              laser.visible = false
              marker.visible = false


          func get_hand_pos(i: int) -> Vector3:
              return hands[i].global_position


          func teleport(p: Vector3) -> void:
              global_position = p
              vel = Vector3.ZERO
              prev_ok = false


          func set_down(d: bool, p: Vector3) -> void:
              down = d
              teleport(p)


          func _aim_btn(n: String) -> void:
              if down or world == null or n != "trigger_click":
                  return
              if world.my_role() == "beast":
                  if aim_ok:
                      world.request_beast("gorilla", aim_hit)
              else:
                  blaster.fire()


          func _left_btn(n: String) -> void:
              if down or world == null or n != "trigger_click":
                  return
              if world.my_role() == "beast" and aim_ok:
                  world.request_beast("trap", aim_hit)


          func _process(_dt: float) -> void:
              if world == null:
                  return
              var role: String = world.my_role()
              blaster.visible = role == "monkey" and not down
              laser.visible = role == "beast" and not down
              marker.visible = laser.visible and aim_ok
              hud.text = world.hud_text()


          func _fit_capsule() -> void:
              var cp := cam.position
              var hgt := clampf(cp.y + 0.1, 0.55, 2.2)
              cap.height = hgt
              shape.position = Vector3(cp.x, hgt * 0.5, cp.z)


          func _touch(space: PhysicsDirectSpaceState3D, pos: Vector3) -> bool:
              var q := PhysicsShapeQueryParameters3D.new()
              q.shape = hand_shape
              q.transform = Transform3D(Basis.IDENTITY, pos)
              q.collision_mask = 3
              return space.intersect_shape(q, 1).size() > 0


          func _update_aim() -> void:
              if world == null or down or world.my_role() != "beast":
                  aim_ok = false
                  return
              var o := aim.global_position
              var d := -aim.global_transform.basis.z
              var q := PhysicsRayQueryParameters3D.create(o, o + d * 40.0, 1)
              var r := get_world_3d().direct_space_state.intersect_ray(q)
              var dist := 40.0
              if r.is_empty():
                  aim_ok = false
              else:
                  aim_ok = true
                  aim_hit = r["position"]
                  dist = o.distance_to(aim_hit)
                  marker.global_position = aim_hit
              var bm: BoxMesh = laser.mesh
              bm.size = Vector3(0.01, 0.01, dist)
              laser.position = Vector3(0, 0, -dist * 0.5)


          func _physics_process(dt: float) -> void:
              _fit_capsule()
              _update_aim()
              if down:
                  prev_ok = false
                  return
              var space := get_world_3d().direct_space_state
              var push := Vector3.ZERO
              var touching := 0
              for i in 2:
                  var h: XRController3D = hands[i]
                  var hp: Vector3 = h.position
                  var pv: Vector3 = prev[i]
                  if prev_ok:
                      if _touch(space, h.global_position):
                          var wd: Vector3 = origin.global_transform.basis * (hp - pv)
                          if wd.length() > 0.0005:
                              push -= wd
                          touching += 1
                  prev[i] = hp
              prev_ok = true
              if touching > 0:
                  vel = (push / float(touching) / dt) * BOOST
                  vel = vel.limit_length(MAX_SPEED)
              else:
                  vel.y -= GRAV * dt
                  vel = vel.limit_length(MAX_SPEED * 1.6)
              var col := move_and_collide(vel * dt)
              if col != null:
                  var n := col.get_normal()
                  vel = vel.slide(n)
                  var rest := col.get_remainder().slide(n)
                  if rest.length() > 0.0001:
                      move_and_collide(rest)
                  if n.y > 0.7 and touching == 0:
                      vel.x = move_toward(vel.x, 0.0, 10.0 * dt)
                      vel.z = move_toward(vel.z, 0.0, 10.0 * dt)
              if global_position.y < -10.0:
                  teleport(Vector3(0, 1, 0))
          EOF
          cat << 'EOF' > game/scripts/World.gd
          extends Node3D
          # Game session. The host is authoritative for gorillas, damage, roles and win conditions.

          const PlayerScene := preload("res://scenes/Player.tscn")
          const AvatarScene := preload("res://scenes/Avatar.tscn")
          const GorillaScene := preload("res://scenes/Gorilla.tscn")
          const TrapScene := preload("res://scenes/Trap.tscn")

          const KILLS_TO_WIN := 25
          const EVIL_TIME := 180.0
          const READY_TIME := 5.0
          const CONTEST_TIME := 6.0
          const SCREAM_COOLDOWN := 5.0
          const FREEZE_TIME := 2.0
          const PLAYER_HP := 100.0
          const RESPAWN_TIME := 5.0

          @onready var map = $Map
          @onready var players_root: Node3D = $Players
          @onready var gorillas_root: Node3D = $Gorillas
          @onready var traps_root: Node3D = $Traps

          var local = null
          var avatars: Dictionary = {}
          var gor: Dictionary = {}
          var heads: Dictionary = {}
          var hps: Dictionary = {}
          var alive: Dictionary = {}
          var roles: Dictionary = {}
          var spawn_idx: Dictionary = {}
          var respawn_t: Dictionary = {}
          var contest_peak: Dictionary = {}
          var beast_cd: Dictionary = {"gorilla": 0.0, "trap": 0.0}

          var phase := "ready"
          var phase_time := READY_TIME
          var kills := 0
          var result := ""
          var event_text := ""
          var event_n := 0
          var seen_event := 0
          var hud_msg := ""
          var hud_msg_t := 0.0
          var next_gid := 1
          var spawn_timer := 2.0
          var pose_t := 0.0
          var gsync_t := 0.0
          var state_t := 0.0
          var scream_cd := 0.0
          var my_peak := 0.0
          var loud_t := 0.0
          var ending := false


          func _ready() -> void:
              var me := multiplayer.get_unique_id()
              var ids: Array = Net.players.keys()
              ids.sort()
              for i in ids.size():
                  var pid: int = ids[i]
                  spawn_idx[pid] = i
                  hps[pid] = PLAYER_HP
                  alive[pid] = true
                  roles[pid] = "monkey"
                  if pid == me:
                      local = PlayerScene.instantiate()
                      local.world = self
                      players_root.add_child(local)
                      local.teleport(map.player_spawn(i))
                  else:
                      var a: Node3D = AvatarScene.instantiate()
                      players_root.add_child(a)
                      a.setup(str(Net.players[pid]["name"]), pid)
                      avatars[pid] = a
              Net.player_left.connect(_on_left)


          func _on_left(pid: int) -> void:
              if avatars.has(pid):
                  avatars[pid].queue_free()
                  avatars.erase(pid)
              alive[pid] = false
              heads.erase(pid)


          func my_role() -> String:
              return str(roles.get(multiplayer.get_unique_id(), "monkey"))


          func _pname(pid: int) -> String:
              if Net.players.has(pid):
                  return str(Net.players[pid]["name"])
              return "?"


          # ------------------------------------------------------------------ local frame
          func _process(dt: float) -> void:
              if local == null:
                  return
              var me := multiplayer.get_unique_id()
              hud_msg_t -= dt
              scream_cd -= dt

              pose_t -= dt
              if pose_t <= 0.0:
                  pose_t = 0.05
                  var cam: Node3D = local.cam
                  var h := cam.global_position
                  heads[me] = h
                  pose.rpc(h, cam.global_transform.basis.get_rotation_quaternion(), local.get_hand_pos(0), local.get_hand_pos(1))

              if phase == "contest":
                  my_peak = maxf(my_peak, Voice.level)
                  loud_t -= dt
                  if loud_t <= 0.0:
                      loud_t = 0.2
                      if multiplayer.is_server():
                          contest_peak[me] = maxf(contest_peak.get(me, 0.0), my_peak)
                      else:
                          report_loud.rpc_id(1, my_peak)
              elif phase == "play" and my_role() == "monkey" and alive.get(me, true):
                  if Voice.level > Voice.SCREAM and scream_cd <= 0.0:
                      scream_cd = SCREAM_COOLDOWN
                      if multiplayer.is_server():
                          _freeze(me)
                      else:
                          scream.rpc_id(1)


          func hud_text() -> String:
              var me := multiplayer.get_unique_id()
              var role := my_role()
              var s := ""
              if role == "beast":
                  s += "MRBEAST\n"
              else:
                  s += "MONKEY   HP " + str(int(hps.get(me, PLAYER_HP))) + "\n"
              if not alive.get(me, true):
                  s += "DOWN - spectating\n"
              match phase:
                  "ready":
                      s += "Get ready... " + str(int(ceil(phase_time)))
                  "contest":
                      s += "SCREAM TO BE MRBEAST!  " + str(int(ceil(phase_time)))
                  "play":
                      if Net.mode == Net.Mode.COOP:
                          s += "Gorillas defeated: %d / %d" % [kills, KILLS_TO_WIN]
                      else:
                          s += "Survive: " + str(int(ceil(maxf(phase_time, 0.0)))) + "s"
                      if role == "beast":
                          s += "\nR-trigger: gorilla   L-trigger: trap"
                      else:
                          s += "\nR-trigger: shoot   SCREAM: freeze"
                  "over":
                      s += result
              if hud_msg_t > 0.0:
                  s += "\n" + hud_msg
              s += "\nMIC " + str(int(Voice.level * 100.0)) + "%"
              return s


          # ------------------------------------------------------------------ pose / state sync
          @rpc("any_peer", "unreliable_ordered")
          func pose(h: Vector3, q: Quaternion, l: Vector3, r: Vector3) -> void:
              var s := multiplayer.get_remote_sender_id()
              heads[s] = h
              if avatars.has(s):
                  avatars[s].apply(h, q, l, r)


          @rpc("authority", "unreliable")
          func sync_state(st: Dictionary) -> void:
              phase = st["ph"]
              phase_time = st["t"]
              kills = st["k"]
              hps = st["hps"]
              result = st["res"]
              var nr: Dictionary = st["roles"]
              if nr.hash() != roles.hash():
                  roles = nr
                  _apply_roles()
              if st["evn"] != seen_event:
                  seen_event = st["evn"]
                  hud_msg = st["ev"]
                  hud_msg_t = 4.0


          @rpc("authority", "unreliable")
          func sync_gorillas(arr: PackedFloat32Array) -> void:
              var i := 0
              while i + 5 < arr.size():
                  var id := int(arr[i])
                  if gor.has(id):
                      gor[id].set_net(Vector3(arr[i + 1], arr[i + 2], arr[i + 3]), arr[i + 4], arr[i + 5] > 0.5)
                  i += 6


          func _apply_roles() -> void:
              for pid in avatars:
                  avatars[pid].set_role(str(roles.get(pid, "monkey")))


          func _event(text: String) -> void:
              event_text = text
              event_n += 1
              seen_event = event_n
              hud_msg = text
              hud_msg_t = 4.0


          # ------------------------------------------------------------------ host simulation
          func _set_phase(p: String, t: float) -> void:
              phase = p
              phase_time = t


          func _physics_process(dt: float) -> void:
              if not multiplayer.is_server() or ending:
                  return
              for k in beast_cd:
                  beast_cd[k] = maxf(0.0, beast_cd[k] - dt)
              match phase:
                  "ready":
                      phase_time -= dt
                      if phase_time <= 0.0:
                          if Net.mode == Net.Mode.COOP:
                              _set_phase("play", 0.0)
                              _event("Defend the clearing! Scream to freeze gorillas!")
                          else:
                              _set_phase("contest", CONTEST_TIME)
                              _event("SCREAM! The loudest player becomes MrBeast!")
                  "contest":
                      phase_time -= dt
                      if phase_time <= 0.0:
                          _end_contest()
                  "play":
                      _host_play(dt)
                  "over":
                      phase_time -= dt
                      if phase_time <= 0.0:
                          ending = true
                          to_menu.rpc()
              state_t -= dt
              if state_t <= 0.0:
                  state_t = 0.1
                  sync_state.rpc({"ph": phase, "t": phase_time, "k": kills, "roles": roles, "hps": hps, "res": result, "ev": event_text, "evn": event_n})
              gsync_t -= dt
              if gsync_t <= 0.0:
                  gsync_t = 0.05
                  if gor.size() > 0:
                      var arr := PackedFloat32Array()
                      for id in gor:
                          var g = gor[id]
                          arr.append(float(id))
                          arr.append(g.global_position.x)
                          arr.append(g.global_position.y)
                          arr.append(g.global_position.z)
                          arr.append(g.rotation.y)
                          arr.append(1.0 if g.frozen_t > 0.0 else 0.0)
                      sync_gorillas.rpc(arr)


          func _end_contest() -> void:
              var ids: Array = Net.players.keys()
              var best: int = ids[0]
              var bv := -1.0
              for pid in ids:
                  roles[pid] = "monkey"
                  var v: float = contest_peak.get(pid, 0.0)
                  if v > bv:
                      bv = v
                      best = pid
              if bv < 0.05:
                  best = ids.pick_random()
              roles[best] = "beast"
              _apply_roles()
              _event("%s is MRBEAST!" % _pname(best))
              _set_phase("play", EVIL_TIME)


          func _max_gor() -> int:
              return 6 + 2 * Net.players.size()


          func _host_play(dt: float) -> void:
              var evil := Net.mode == Net.Mode.EVIL
              var ids: Array = []
              var pos: Array = []
              var monkeys_total := 0
              var monkeys_alive := 0
              for pid in Net.players.keys():
                  if str(roles.get(pid, "monkey")) != "monkey":
                      continue
                  monkeys_total += 1
                  if alive.get(pid, false):
                      monkeys_alive += 1
                      if heads.has(pid):
                          ids.append(pid)
                          pos.append(heads[pid])
              if evil:
                  phase_time -= dt
              else:
                  spawn_timer -= dt
                  if spawn_timer <= 0.0:
                      spawn_timer = maxf(1.2, 4.0 - float(kills) * 0.1)
                      if gor.size() < _max_gor():
                          _spawn_at(map.spawn_points.pick_random())

              for id in gor.keys():
                  var g = gor[id]
                  var best := -1
                  var bd := 1e9
                  for i in ids.size():
                      var p: Vector3 = pos[i]
                      var d := Vector2(p.x - g.global_position.x, p.z - g.global_position.z).length()
                      if d < bd:
                          bd = d
                          best = i
                  var tp := Vector3.ZERO
                  var ok := false
                  if best >= 0:
                      tp = pos[best]
                      ok = tp.y < 3.8
                  if g.think(dt, tp, ok):
                      _damage(ids[best], 12.0)

              for t in traps_root.get_children():
                  for i in ids.size():
                      var p2: Vector3 = pos[i]
                      if Vector2(p2.x - t.global_position.x, p2.z - t.global_position.z).length() < 0.9 and p2.y < 2.0:
                          _damage(ids[i], 20.0 * dt)

              for pid in respawn_t.keys():
                  respawn_t[pid] -= dt
                  if respawn_t[pid] <= 0.0:
                      respawn_t.erase(pid)
                      if Net.players.has(pid):
                          hps[pid] = PLAYER_HP
                          set_down.rpc(pid, false, map.player_spawn(spawn_idx[pid]))

              if evil:
                  if monkeys_total > 0 and monkeys_alive == 0:
                      _end("MRBEAST WINS! All monkeys eliminated.")
                  elif phase_time <= 0.0:
                      _end("MONKEYS WIN! You survived MrBeast.")
              else:
                  if kills >= KILLS_TO_WIN:
                      _end("MONKEYS WIN! %d gorillas defeated." % kills)
                  elif monkeys_total > 0 and monkeys_alive == 0:
                      _end("GORILLAS WIN! The monkeys fell.")


          func _end(text: String) -> void:
              result = text
              _event(text)
              _set_phase("over", 8.0)


          func _damage(pid: int, amt: float) -> void:
              if phase != "play" or not alive.get(pid, false):
                  return
              hps[pid] = maxf(0.0, float(hps[pid]) - amt)
              if hps[pid] <= 0.0:
                  alive[pid] = false
                  set_down.rpc(pid, true, Vector3(0, 10, 0))
                  if Net.mode == Net.Mode.COOP:
                      respawn_t[pid] = RESPAWN_TIME
                  _event("%s was downed!" % _pname(pid))


          func _spawn_at(p: Vector3) -> void:
              var id := next_gid
              next_gid += 1
              spawn_gorilla.rpc(id, p)


          func _nearest_spawn(p: Vector3) -> Vector3:
              var best: Vector3 = map.spawn_points[0]
              for s in map.spawn_points:
                  if s.distance_to(p) < best.distance_to(p):
                      best = s
              return best


          func _freeze(pid: int) -> void:
              for id in gor:
                  gor[id].frozen_t = FREEZE_TIME
              _event("%s SCREAMED! Gorillas frozen!" % _pname(pid))


          # ------------------------------------------------------------------ RPCs: gorillas / traps / players
          @rpc("authority", "call_local", "reliable")
          func spawn_gorilla(id: int, p: Vector3) -> void:
              var g = GorillaScene.instantiate()
              g.gid = id
              g.puppet = not multiplayer.is_server()
              g.position = p
              gorillas_root.add_child(g)
              gor[id] = g


          @rpc("authority", "call_local", "reliable")
          func remove_gorilla(id: int) -> void:
              if gor.has(id):
                  gor[id].die()
                  gor.erase(id)


          @rpc("authority", "call_local", "reliable")
          func spawn_trap(p: Vector3) -> void:
              var t: Node3D = TrapScene.instantiate()
              t.position = p
              traps_root.add_child(t)


          @rpc("authority", "call_local", "reliable")
          func set_down(pid: int, d: bool, p: Vector3) -> void:
              alive[pid] = not d
              if pid == multiplayer.get_unique_id():
                  if local != null:
                      local.set_down(d, p)
              elif avatars.has(pid):
                  avatars[pid].visible = not d


          @rpc("authority", "call_local", "reliable")
          func to_menu() -> void:
              if multiplayer.is_server():
                  await get_tree().create_timer(1.0).timeout
              Net.leave()
              get_tree().change_scene_to_file("res://scenes/Main.tscn")


          @rpc("any_peer", "unreliable")
          func report_loud(v: float) -> void:
              if not multiplayer.is_server():
                  return
              var s := multiplayer.get_remote_sender_id()
              contest_peak[s] = maxf(contest_peak.get(s, 0.0), v)


          @rpc("any_peer", "reliable")
          func scream() -> void:
              if not multiplayer.is_server():
                  return
              var s := multiplayer.get_remote_sender_id()
              if str(roles.get(s, "monkey")) == "monkey" and phase == "play":
                  _freeze(s)


          # ------------------------------------------------------------------ shooting
          func player_shot(o: Vector3, d: Vector3) -> void:
              var to := o + d * 60.0
              var q := PhysicsRayQueryParameters3D.create(o, to, 3)
              var r := get_world_3d().direct_space_state.intersect_ray(q)
              var end := to
              if not r.is_empty():
                  end = r["position"]
                  var c = r["collider"]
                  if c != null and c.is_in_group("gorilla"):
                      _request_hit(c.gid)
              _tracer(o, end)
              fx_shot.rpc(o, end)


          func _request_hit(id: int) -> void:
              if multiplayer.is_server():
                  _do_hit(id)
              else:
                  hit_gorilla.rpc_id(1, id)


          @rpc("any_peer", "reliable")
          func hit_gorilla(id: int) -> void:
              if multiplayer.is_server():
                  _do_hit(id)


          func _do_hit(id: int) -> void:
              if phase != "play" or not gor.has(id):
                  return
              var g = gor[id]
              g.hp -= 1
              if g.hp <= 0:
                  kills += 1
                  remove_gorilla.rpc(id)


          @rpc("any_peer", "unreliable")
          func fx_shot(a: Vector3, b: Vector3) -> void:
              _tracer(a, b)


          func _tracer(a: Vector3, b: Vector3) -> void:
              var dist := a.distance_to(b)
              if dist < 0.05:
                  return
              var mi := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = Vector3(0.02, 0.02, dist)
              mi.mesh = bm
              var m := StandardMaterial3D.new()
              m.albedo_color = Color(1, 0.9, 0.2)
              m.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
              mi.material_override = m
              add_child(mi)
              mi.global_position = (a + b) * 0.5
              var up := Vector3.UP
              if absf((b - a).normalized().dot(up)) > 0.99:
                  up = Vector3.RIGHT
              mi.look_at(b, up)
              get_tree().create_timer(0.07).timeout.connect(mi.queue_free)


          # ------------------------------------------------------------------ evil MrBeast actions
          func request_beast(kind: String, point: Vector3) -> void:
              if multiplayer.is_server():
                  _beast_do(1, kind, point)
              else:
                  beast_req.rpc_id(1, kind, point)


          @rpc("any_peer", "reliable")
          func beast_req(kind: String, point: Vector3) -> void:
              if multiplayer.is_server():
                  _beast_do(multiplayer.get_remote_sender_id(), kind, point)


          func _beast_do(pid: int, kind: String, point: Vector3) -> void:
              if phase != "play" or str(roles.get(pid, "")) != "beast":
                  return
              if float(beast_cd.get(kind, 1.0)) > 0.0:
                  return
              if kind == "gorilla":
                  if gor.size() >= _max_gor() + 4:
                      return
                  beast_cd["gorilla"] = 1.0
                  _spawn_at(_nearest_spawn(point))
              elif kind == "trap":
                  if traps_root.get_child_count() >= 5:
                      return
                  beast_cd["trap"] = 2.5
                  spawn_trap.rpc(Vector3(point.x, 0.0, point.z))
          EOF
