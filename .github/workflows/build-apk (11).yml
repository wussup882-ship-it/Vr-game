              lh.global_position = lh.global_position.lerp(t_l, k)
              rh.global_position = rh.global_position.lerp(t_r, k)
              var yaw := Basis(t_q).get_euler().y
              var bb := Basis(Vector3.UP, yaw).scaled(Vector3.ONE * body_scale)
              body.global_transform = Transform3D(bb, head.global_position - Vector3(0, 0.55 * body_scale, 0))
              tag.global_position = head.global_position + Vector3(0, 0.35, 0)
