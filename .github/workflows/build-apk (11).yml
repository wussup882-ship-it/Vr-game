          extends Node3D
          # Remote player visual.

          var t_head := Vector3.ZERO
          var t_q := Quaternion.IDENTITY
          var t_l := Vector3.ZERO
          var t_r := Vector3.ZERO
          var fresh := false
          var body_scale := 1.0
          var mat := StandardMaterial3D.new()

          @onready var head: Node3D = $Head
          @onready var body: Node3D = $Body
